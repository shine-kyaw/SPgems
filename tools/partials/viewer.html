<!-- Fullscreen high-resolution viewer — §13.8.
     FR-VIEW-002 requires all four zoom inputs: scroll wheel, pinch,
     double-tap and on-screen controls. All are wired in gem.js. -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="viewer__bar">
    <span data-vcount class="tnum">1 / 1</span>
    <div class="viewer__ctrls">
      <button class="viewer__btn" type="button" data-zoom-out aria-label="Zoom out">
        <svg width="13" height="2" viewBox="0 0 13 2" aria-hidden="true"><path d="M0 1h13" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <span data-zoom-label class="tnum" style="min-width:44px;text-align:center">100%</span>
      <button class="viewer__btn" type="button" data-zoom-in aria-label="Zoom in">
        <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path d="M0 6.5h13M6.5 0v13" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="viewer__btn" type="button" data-vclose aria-label="Close viewer">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="m1 1 13 13M14 1 1 14" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
    </div>
  </div>

  <div class="viewer__stage" data-stage>
    <button class="viewer__nav viewer__nav--prev" type="button" data-vprev aria-label="Previous image">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true"><path d="M9.5 1 1.5 9l8 8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <div class="viewer__holder" data-holder></div>
    <button class="viewer__nav viewer__nav--next" type="button" data-vnext aria-label="Next image">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true"><path d="M1.5 1l8 8-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>

  <p class="viewer__cap" data-vcap></p>
</div>
