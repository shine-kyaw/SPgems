<!-- Results column: toolbar, applied-filter chips, grid, zero state, pagination -->
<div>
  <div class="toolbar">
    <!-- FR-SRCH-012 — the count updates live and is announced to screen readers -->
    <p class="toolbar__count" data-count aria-live="polite" aria-atomic="true"></p>
    <div class="toolbar__right">
      <!-- FR-MOB-010 — single-column toggle, persisted in localStorage -->
      <div class="coltoggle" role="group" aria-label="Grid density">
        <button type="button" data-cols="2" aria-pressed="true" aria-label="Two columns">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="5.5" height="13" stroke="currentColor"/><rect x="8" y=".5" width="5.5" height="13" stroke="currentColor"/></svg>
        </button>
        <button type="button" data-cols="1" aria-pressed="false" aria-label="One column">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="13" height="13" stroke="currentColor"/></svg>
        </button>
      </div>
      <!-- FR-CAT-008 — curated first, then newest; user-selectable sorts -->
      <div class="toolbar__sort">
        <label for="sort">Sort</label>
        <select id="sort" data-sort>
          <option value="curated">Curated</option>
          <option value="newest">Newest</option>
          <option value="carat_desc">Carat, high to low</option>
          <option value="carat_asc">Carat, low to high</option>
          <option value="price_desc">Price, high to low</option>
          <option value="price_asc">Price, low to high</option>
        </select>
      </div>
    </div>
  </div>

  <!-- FR-SRCH-015 — applied filters as removable chips -->
  <div class="applied" data-applied hidden></div>

  <!-- FR-CAT-002 — generously sized cards, few per screen. Density signals
       commodity; space signals value. -->
  <div class="grid grid--3" data-grid>{{CARDS}}</div>

  <!-- FR-SRCH-016 — a zero-result page is a lead-capture opportunity -->
  <div class="zero" data-zero hidden>
    <p class="eyebrow eyebrow--gold">Nothing matches</p>
    <h2 class="h3 mt-2">We do not have a stone matching that.</h2>
    <p class="small mt-2" style="color:var(--ink-secondary);max-width:52ch;margin-inline:auto" data-zero-why></p>
    <div class="zero__acts">
      <button class="btn btn--secondary btn--sm" type="button" data-relax hidden></button>
      <a class="btn btn--primary btn--sm" href="{{BASE}}contact.html" data-enquire
         data-item-kind="sourcing" data-item-id="SOURCING"
         data-item-title="Sourcing request" data-item-meta="From a zero-result search">
        Tell us what you are looking for
      </a>
    </div>
    <p class="caption mt-4" style="max-width:56ch;margin-inline:auto">
      Our catalogue is what we hold today. We are in Mogok every month, and a specific
      brief is often easier for us to fill than a browse.
    </p>
  </div>

  <!-- FR-CAT-007 — real pagination with a ?page= parameter. Never infinite
       scroll: it breaks the footer, back-navigation and crawlability. -->
  <nav class="pager" data-pager aria-label="Pagination" hidden></nav>
</div>
