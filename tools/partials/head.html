<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="noindex, nofollow">
<!-- DEMO: noindex is set site-wide on purpose. This build contains specimen
     inventory data and placeholder imagery and must never be indexed. Remove
     this tag, and add the §23 structured-data layer, at production launch. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SP Gems">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- §28.3 — open-source pairing: Cormorant Garamond (display) + Instrument Sans
     (body/spec). FR-PERF-033 requires these to be self-hosted, subset and
     preloaded in production; the CDN link is a demo convenience only. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
