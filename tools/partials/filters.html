<!-- Faceted filter rail — §19.1.
     FR-SRCH-001: five primary filters visible without interaction; the
     remaining seven sit behind a single "More filters" disclosure. Twelve
     simultaneous filters is a database interface, not a gallery.
     FR-SRCH-013/014: every option carries its count; options yielding zero
     results are disabled and left visible, never hidden. -->
<aside class="filters" aria-label="Filter gemstones">
  <div class="filters__sheet-head">
    <p class="eyebrow">Filters</p>
    <button class="icon-btn" type="button" data-close-filters aria-label="Close filters">
      <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><path d="m1 1 15 15M16 1 1 16" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>

  <div class="filters__scroll">
    <!-- 1. Gemstone type — multi-select -->
    <div class="fgroup">
      <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-type">
        Type <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fgroup__body" id="f-type">
        <label class="fopt"><input type="checkbox" data-filter="type" value="ruby"><span data-label>Ruby</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="type" value="sapphire"><span data-label>Sapphire</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="type" value="spinel"><span data-label>Spinel</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="type" value="other"><span data-label>Other gemstones</span><span class="fopt__n">0</span></label>
      </div>
    </div>

    <!-- 2. Carat weight — range with numeric inputs -->
    <div class="fgroup">
      <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-carat">
        Carat weight <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fgroup__body" id="f-carat">
        <div class="range">
          <label class="visually-hidden" for="carat-min">Minimum carat</label>
          <input class="input" id="carat-min" data-carat-min type="number" min="0" step="0.01" placeholder="From" inputmode="decimal">
          <span>&ndash;</span>
          <label class="visually-hidden" for="carat-max">Maximum carat</label>
          <input class="input" id="carat-max" data-carat-max type="number" min="0" step="0.01" placeholder="To" inputmode="decimal">
          <span>ct</span>
        </div>
      </div>
    </div>

    <!-- 3. Price band — includes "Price on Request" as an explicit option,
            which is why bands beat pure POR: a POR-only catalogue has no
            working price filter at all (§12.5). -->
    <div class="fgroup">
      <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-band">
        Price <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fgroup__body" id="f-band">
        <label class="fopt"><input type="checkbox" data-filter="band" value="Under US$5,000"><span data-label>Under US$5,000</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="US$5,000 - 10,000"><span data-label>US$5,000 &ndash; 10,000</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="US$10,000 - 25,000"><span data-label>US$10,000 &ndash; 25,000</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="US$25,000 - 50,000"><span data-label>US$25,000 &ndash; 50,000</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="US$50,000 - 100,000"><span data-label>US$50,000 &ndash; 100,000</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="US$100,000+"><span data-label>US$100,000+</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="checkbox" data-filter="band" value="Price on Request"><span data-label>Price on Request</span><span class="fopt__n">0</span></label>
      </div>
    </div>

    <!-- 4. Treatment — FR-SRCH-003: defaults to All, never to "Unheated only".
            Defaulting to unheated would hide most of the inventory and
            implicitly disparage heated stones. -->
    <div class="fgroup">
      <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-treat">
        Treatment <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fgroup__body" id="f-treat">
        <label class="fopt"><input type="radio" name="f-treatment" data-filter="treatment" value="unheated"><span data-label>Unheated only</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="radio" name="f-treatment" data-filter="treatment" value="heated"><span data-label>Heated</span><span class="fopt__n">0</span></label>
        <p class="caption mt-1">Default is all treatments. Heating is accepted practice and always disclosed.</p>
      </div>
    </div>

    <!-- 5. Availability — FR-CAT-006: sold stones are excluded by default and
            surfaced under Archive, where they keep their record. -->
    <div class="fgroup">
      <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-avail">
        Availability <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fgroup__body" id="f-avail">
        <label class="fopt"><input type="radio" name="f-avail" data-filter="availability" value="available"><span data-label>Available now</span><span class="fopt__n">0</span></label>
        <label class="fopt"><input type="radio" name="f-avail" data-filter="availability" value="archive"><span data-label>Include the archive</span><span class="fopt__n">0</span></label>
      </div>
    </div>

    <!-- Advanced tier — FR-SRCH-002: expanded state persisted per visitor -->
    <div class="fadv" data-advanced>
      <button class="fadv__toggle" type="button" aria-expanded="false">
        <span>More filters</span>
        <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <div class="fadv__body" hidden>

        <!-- 6. Origin region — Mogok carries a distinct premium and must never
                be conflated with a generic "Burma" (§12.3). -->
        <div class="fgroup">
          <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-origin">
            Origin <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="fgroup__body" id="f-origin">
            <label class="fopt"><input type="checkbox" data-filter="origin" value="Mogok"><span data-label>Mogok</span><span class="fopt__n">0</span></label>
            <label class="fopt"><input type="checkbox" data-filter="origin" value="Namyarseik (Kachin)"><span data-label>Namyarseik, Kachin</span><span class="fopt__n">0</span></label>
          </div>
        </div>

        <!-- 7. Colour — swatch grid -->
        <div class="fgroup">
          <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-colour">
            Colour <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="fgroup__body" id="f-colour">
            <div class="swatches">
              <label class="swatch"><input type="checkbox" data-filter="colour" value="red"><span><i style="background:#8C1D2A"></i><em data-label>Red</em></span></label>
              <label class="swatch"><input type="checkbox" data-filter="colour" value="pink"><span><i style="background:#C4607A"></i><em data-label>Pink</em></span></label>
              <label class="swatch"><input type="checkbox" data-filter="colour" value="blue"><span><i style="background:#26417A"></i><em data-label>Blue</em></span></label>
              <label class="swatch"><input type="checkbox" data-filter="colour" value="green"><span><i style="background:#5A7A2E"></i><em data-label>Green</em></span></label>
              <label class="swatch"><input type="checkbox" data-filter="colour" value="grey"><span><i style="background:#8A8A8A"></i><em data-label>Grey</em></span></label>
              <label class="swatch"><input type="checkbox" data-filter="colour" value="colourless"><span><i style="background:#E8E4DC"></i><em data-label>Colourless</em></span></label>
            </div>
            <p class="caption mt-2">Swatches are indicative. Photography is the record.</p>
          </div>
        </div>

        <!-- 8. Shape — icon grid -->
        <div class="fgroup">
          <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-shape">
            Shape <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="fgroup__body" id="f-shape">
            <div class="shapes">
              <label class="shape"><input type="checkbox" data-filter="shape" value="cushion"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="2.5" width="15" height="15" rx="4.5" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Cushion</em></span></label>
              <label class="shape"><input type="checkbox" data-filter="shape" value="oval"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><ellipse cx="10" cy="10" rx="6" ry="7.5" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Oval</em></span></label>
              <label class="shape"><input type="checkbox" data-filter="shape" value="pear"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.5c3 3 6 5 6 8a6 6 0 1 1-12 0c0-3 3-5 6-8Z" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Pear</em></span></label>
              <label class="shape"><input type="checkbox" data-filter="shape" value="emerald"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 2.5h8l3.5 3.5v8L14 17.5H6L2.5 14V6L6 2.5Z" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Emerald</em></span></label>
              <label class="shape"><input type="checkbox" data-filter="shape" value="cabochon"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2.5 14.5a7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Cabochon</em></span></label>
              <label class="shape"><input type="checkbox" data-filter="shape" value="round"><span><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.1"/></svg><em data-label>Round</em></span></label>
            </div>
          </div>
        </div>

        <!-- 9. Certification -->
        <div class="fgroup">
          <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-cert">
            Certification <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="fgroup__body" id="f-cert">
            <label class="fopt"><input type="checkbox" data-filter="cert" value="any"><span data-label>Certified only</span><span class="fopt__n">0</span></label>
            <label class="fopt"><input type="checkbox" data-filter="cert" value="GRS"><span data-label>GRS</span><span class="fopt__n">0</span></label>
            <label class="fopt"><input type="checkbox" data-filter="cert" value="AIGS"><span data-label>AIGS</span><span class="fopt__n">0</span></label>
          </div>
        </div>

        <!-- 10. Clarity — descriptive tiers only. Coloured stones are not
                 graded on the diamond clarity scale (§12.3). -->
        <div class="fgroup">
          <button class="fgroup__h" type="button" aria-expanded="true" aria-controls="f-clarity">
            Clarity <svg class="chev" width="10" height="6" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <div class="fgroup__body" id="f-clarity">
            <label class="fopt"><input type="checkbox" data-filter="clarity" value="eye-clean"><span data-label>Eye-clean</span><span class="fopt__n">0</span></label>
            <label class="fopt"><input type="checkbox" data-filter="clarity" value="minor"><span data-label>Minor inclusions</span><span class="fopt__n">0</span></label>
            <label class="fopt"><input type="checkbox" data-filter="clarity" value="translucent"><span data-label>Translucent</span><span class="fopt__n">0</span></label>
          </div>
        </div>

        <!-- 11 & 12. Toggles -->
        <div class="fgroup">
          <label class="fopt"><input type="checkbox" data-filter="exceptional" value="1"><span data-label>Exceptional tier only</span><span class="fopt__n">0</span></label>
          <label class="fopt"><input type="checkbox" data-filter="pairs" value="1"><span data-label>Matched pairs only</span><span class="fopt__n">0</span></label>
        </div>
      </div>
    </div>
  </div>

  <!-- FR-MOB-012 — explicit "Show N results" and "Clear all" in the sheet -->
  <div class="filters__sheet-foot">
    <button class="btn btn--secondary" type="button" data-close-filters>Close</button>
    <button class="btn btn--primary" type="button" data-show-results>Show results</button>
  </div>
</aside>
