<script>
"use strict";
/* ==========================================================================
   Schedule an Appointment (SDD §19.4 second CTA, §7.5 timezone handling)
   FR-CON-011: the visitor's local time and Yangon time are shown together,
   always, and both come from one formatter.
   ========================================================================== */
var APPT = { type:"video", day:0, slot:null, ctx:null };
var APPT_TYPES = [
  ["video","Video call","Zoom or Viber, screen-shared stone review."],
  ["phone","Telephone","A straightforward call with a specialist."],
  ["in_person","In person","At our Yangon office, by arrangement."]
];
/* Business hours are Yangon wall-clock; conversion is done through the IANA db. */
var APPT_HOURS = [9,10,11,13,14,15,16];

function apptDays(){
  var out=[], base=new Date(2026,7,24); /* fixed base so the demo is stable */
  for(var i=0;i<5;i++){
    var d=new Date(base.getTime()+i*86400000);
    out.push({y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate(),
      label:new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short"}).format(d)});
  }
  return out;
}
function apptUtc(){
  var day = apptDays()[APPT.day];
  if(APPT.slot===null) return null;
  return zonedToUtc(day.y, day.m, day.d, APPT.slot, 0, YANGON_TZ);
}

function openAppointment(key){
  var g = GEMS.filter(function(x){ return x.slug===key; })[0];
  APPT.ctx = g || null; APPT.slot = null;
  lastFocus = document.activeElement;
  $("#modal").setAttribute("data-open","true");
  document.body.style.overflow = "hidden";
  paintAppointment();
}
function paintAppointment(){
  var g = APPT.ctx, days = apptDays(), utc = apptUtc();
  var win = utc ? formatWindowForDisplay(utc) : null;

  var ctx = g ? '<div class="ctx">'+plate(g,0)+'<div class="stack g1">'+
      '<strong style="font-family:var(--f-display); font-size:20px; font-weight:400">'+esc(g.title)+'</strong>'+
      '<span class="t-sm num" style="color:var(--ink-secondary)">'+g.carat.toFixed(2)+' ct &middot; '+esc(g.shape)+'</span>'+
      '<span class="mono t-cap" style="color:var(--ink-meta)">'+esc(g.stoneId)+'</span>'+
    '</div></div>' : "";

  $("#modalBody").innerHTML =
    '<button class="modal-x" type="button" data-close="modal" aria-label="Close">×</button>'+
    '<form class="stack g4" id="apptForm" novalidate>'+
      '<div class="stack g2"><p class="eyebrow">Appointment</p><h3 id="mtitle">Schedule an appointment</h3>'+
      '<p class="t-sm" style="color:var(--ink-secondary)">'+
        (g?"To view "+esc(g.stoneId)+" and anything comparable we hold.":"Tell us when suits and we will confirm by email.")+'</p></div>'+
      ctx+
      '<div class="stack g2"><span class="eyebrow">How would you like to meet?</span>'+
        '<div class="appt-types">'+APPT_TYPES.map(function(t){
          return '<button class="appt-t" type="button" data-atype="'+t[0]+'" aria-pressed="'+(APPT.type===t[0])+'">'+
            '<b>'+t[1]+'</b><span>'+t[2]+'</span></button>'; }).join("")+'</div></div>'+

      '<div class="stack g2"><span class="eyebrow">Day</span>'+
        '<div class="slots">'+days.map(function(d,i){
          return '<button class="slot" type="button" data-aday="'+i+'" aria-pressed="'+(APPT.day===i)+'">'+esc(d.label)+'</button>'; }).join("")+
        '</div></div>'+

      '<div class="stack g2"><span class="eyebrow">Time — shown in Yangon office hours</span>'+
        '<div class="slots">'+APPT_HOURS.map(function(h){
          return '<button class="slot" type="button" data-aslot="'+h+'" aria-pressed="'+(APPT.slot===h)+'">'+
            String(h).padStart(2,"0")+':00</button>'; }).join("")+
        '</div></div>'+

      (win ? '<div class="tzbox" data-prd="FR-CON-011 · both times, always">'+
          '<div class="tzrow you"><span class="lbl">Your time</span><span class="val">'+esc(win.clientLocal)+'</span></div>'+
          '<div class="tzrow"><span class="lbl">Yangon</span><span class="val">'+esc(win.yangonLocal)+'</span></div>'+
          '<p style="font-size:12.5px; color:var(--ink-secondary); line-height:1.55">Detected as '+esc(win.clientTz)+
            '. Myanmar Standard Time is UTC+06:30 — a half-hour offset, so we always print both.</p>'+
        '</div>'
        : '<p class="quote-note">Pick a time and we will show it in your timezone and ours, side by side.</p>')+

      '<div class="stack g3">'+
        '<div class="fld"><label for="a-name">Your name *</label><input id="a-name" required autocomplete="name"><span class="err">Please tell us your name.</span></div>'+
        '<div class="two">'+
          '<div class="fld"><label for="a-email">Email *</label><input id="a-email" type="email" required autocomplete="email"><span class="err">Please enter a valid email address.</span></div>'+
          '<div class="fld"><label for="a-phone">Phone or Viber</label><input id="a-phone" type="tel" autocomplete="tel"></div>'+
        '</div>'+
        '<div class="fld" data-prd="FR-INQ-002 · country drives compliance routing"><label for="a-country">Country or territory *</label>'+
          '<select id="a-country" required><option value="">Select…</option>'+COUNTRIES.map(function(c){ return '<option>'+c+'</option>'; }).join("")+'</select>'+
          '<span class="err">Please select a country or territory.</span></div>'+
        '<div class="fld"><label for="a-msg">What would you like to see?</label>'+
          '<textarea id="a-msg" placeholder="Carat, colour, treatment, budget — whatever you already know."></textarea></div>'+
      '</div>'+
      '<div class="stack g2">'+
        '<button class="btn btn-primary btn-full" type="submit"'+(APPT.slot===null?" disabled":"")+'>Request this appointment</button>'+
        '<p class="t-cap" style="color:var(--ink-meta)">We confirm by email with a calendar invitation. Demonstration build — nothing is transmitted.</p>'+
      '</div>'+
    '</form>';

  $("#a-name").focus();
  ["a-name","a-email","a-country"].forEach(function(id){
    var el=$("#"+id); el.addEventListener("blur", function(){ validate(el); });
  });
  $("#apptForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var ok = ["a-name","a-email","a-country"].map(function(id){ return validate($("#"+id)); }).every(Boolean);
    if(!ok){ var bad=$(".fld.is-err input, .fld.is-err select"); if(bad) bad.focus(); return; }
    var u = apptUtc(), w = formatWindowForDisplay(u);
    var ref = "CON-2026-"+String(1000+Math.floor(Math.random()*8999));
    $("#modalBody").innerHTML =
      '<button class="modal-x" type="button" data-close="modal" aria-label="Close">×</button>'+
      '<div class="stack g4"><div class="stack g2"><p class="eyebrow">Appointment requested</p>'+
      '<h3 id="mtitle">Thank you — we have your request.</h3></div>'+
      '<div class="tzbox">'+
        '<div class="tzrow you"><span class="lbl">Your time</span><span class="val">'+esc(w.clientLocal)+'</span></div>'+
        '<div class="tzrow"><span class="lbl">Yangon</span><span class="val">'+esc(w.yangonLocal)+'</span></div>'+
      '</div>'+
      '<p class="measure">A specialist will confirm within one business day, Yangon time, and send a calendar invitation. '+
      'The invitation carries both times so nothing is lost to the half-hour offset.</p>'+
      '<div class="ctx"><div class="stack g1"><span class="eyebrow">Your reference</span>'+
      '<strong class="mono" style="font-size:18px">'+ref+'</strong></div></div>'+
      '<p class="t-cap" style="color:var(--ink-meta)">Demonstration build. No message was sent. In production this creates a consultation record, routes it by country per §21.4, and issues an .ics invitation.</p>'+
      '<button class="btn btn-secondary btn-full" type="button" data-close="modal">Close</button></div>';
    $(".modal-x").focus();
  });
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-appointment],[data-quote],[data-atype],[data-aday],[data-aslot]") : null;
  if(!t) return;
  if(t.hasAttribute("data-appointment")){ e.preventDefault(); setMob(false); openAppointment(t.getAttribute("data-appointment")); return; }
  if(t.hasAttribute("data-quote")){ e.preventDefault(); setMob(false); openEnquiry(t.getAttribute("data-quote")); return; }
  if(t.hasAttribute("data-atype")){ APPT.type=t.getAttribute("data-atype"); paintAppointment(); return; }
  if(t.hasAttribute("data-aday")){ APPT.day=+t.getAttribute("data-aday"); paintAppointment(); return; }
  if(t.hasAttribute("data-aslot")){ APPT.slot=+t.getAttribute("data-aslot"); paintAppointment(); return; }
});
</script>

<script>
"use strict";
/* ==========================================================================
   CMS additions for SDD §19 — the two new Payload globals.
   Both exist so the nav grouping and the contact block are content edits
   rather than deploys, which is the whole point of §19's "data, not code".
   ========================================================================== */

/* logo into the admin sidebar */
(function(){
  var orig = adminShell;
  adminShell = function(active, title, crumb, bodyHtml, topRight){
    var html = orig(active, title, crumb, bodyHtml, topRight);
    return html.replace('<div class="a-brand"><b>SP GEMS</b><span>Content management</span></div>',
      '<div class="a-brand"><img class="brand-logo" src="'+LOGO_SRC+'" alt="SP Gems"><span style="margin-top:8px">Content management</span></div>');
  };
})();

/* --- NavigationMenu global (SDD §19.3) --- */
function adminNavigation(){
  if(!can("content")) return adminShell("navigation","Navigation",'<a href="#/admin">Admin</a> · Content', noAccess("navigation"));
  var rows = NAV_MENU.map(function(n,i){
    var kids = n.children.length
      ? n.children.map(function(c,j){
          return '<tr><td style="padding-left:var(--a-6); color:var(--ink-meta)">↳</td>'+
            '<td><input class="a-inp" data-navf="'+i+','+j+',label" value="'+esc(c.label)+'"'+(ro()?" disabled":"")+'></td>'+
            '<td><input class="a-inp" data-navf="'+i+','+j+',route" value="'+esc(c.route)+'"'+(ro()?" disabled":"")+'></td>'+
            '<td><input class="a-inp" data-navf="'+i+','+j+',description" value="'+esc(c.description||"")+'"'+(ro()?" disabled":"")+'></td>'+
            '<td class="a-rowact"><button class="a-btn a-btn-sm" type="button" data-navdel="'+i+','+j+'"'+(ro()?" disabled":"")+'>Remove</button></td></tr>';
        }).join("")
      : "";
    return '<tr><td><b style="font-weight:600">'+(i+1)+'</b></td>'+
      '<td><input class="a-inp" data-navf="'+i+',-1,label" value="'+esc(n.label)+'"'+(ro()?" disabled":"")+'></td>'+
      '<td><input class="a-inp" data-navf="'+i+',-1,route" value="'+esc(n.route)+'" placeholder="(parent only)"'+(ro()?" disabled":"")+'></td>'+
      '<td colspan="2" style="color:var(--ink-meta); font-size:12px">'+
        (n.children.length? n.children.length+' dropdown item'+(n.children.length>1?"s":"") : 'Direct link')+'</td></tr>'+kids;
  }).join("");

  return adminShell("navigation","Navigation",'<a href="#/admin">Admin</a> · Content',
    '<div class="a-panel"><div class="a-panel-h"><h2>Primary navigation</h2>'+
      '<span class="a-sub">SDD §19.3 — grouped to mirror the current site</span></div>'+
      '<div class="a-tw"><table class="a-tbl"><thead><tr><th></th><th>Label</th><th>Route</th><th>Sub-label</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>'+
      '<div class="a-pag"><span>Edits here change the header and the mobile menu immediately.</span>'+
      '<span class="sp"></span><button class="a-btn a-btn-sm" type="button" data-navreset="1"'+(ro()?" disabled":"")+'>Reset to supplied grouping</button></div>'+
    '</div>'+
    '<div class="a-panel"><div class="a-panel-h"><h2>Why this is a global, not a component</h2></div><div class="a-panel-b">'+
      '<p class="a-hint">The menu is an array of <code>{ label, route, children[] }</code> nodes rendered by one generic dropdown component. '+
      'Nothing in the component assumes the current grouping is permanent — so moving to the PRD §9 structure '+

<script>

/* --- register the new admin screens in the sidebar and router --- */
(function(){
  var iContent = -1, iSystem = -1;
  A_NAV.forEach(function(n,i){ if(n[0]==="grp" && n[1]==="Content") iContent=i; if(n[0]==="grp" && n[1]==="System") iSystem=i; });
  if(iContent>-1) A_NAV.splice(iContent+1, 0, ["navigation","Navigation","content"]);
  A_NAV.forEach(function(n,i){ if(n[0]==="grp" && n[1]==="System") iSystem=i; });
  if(iSystem>-1) A_NAV.splice(iSystem+1, 0, ["sitesettings","Site settings","settings"]);
})();

var _renderAdmin = renderAdmin;
renderAdmin = function(parts){
  var seg = parts[1] || "dashboard";
  if(seg==="navigation")     { document.body.classList.add("admin"); return adminNavigation(); }
  if(seg==="sitesettings")   { document.body.classList.add("admin"); return adminSiteSettings(); }
  if(seg==="consultations")  { document.body.classList.add("admin"); return adminConsultations(); }
  return _renderAdmin(parts);
};

document.addEventListener("input", function(e){
  var nf = e.target.getAttribute && e.target.getAttribute("data-navf");
  if(nf){
    var p = nf.split(","), i = +p[0], j = +p[1], k = p[2];
    if(j < 0) NAV_MENU[i][k] = e.target.value; else NAV_MENU[i].children[j][k] = e.target.value;
    mountChrome(); return;
  }
  var sf = e.target.getAttribute && e.target.getAttribute("data-ssf");
  if(sf){
    if(sf==="telephones" || sf==="emails") SITE[sf] = e.target.value.split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    else SITE[sf] = e.target.value;

  }
});
document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-navdel],[data-navreset]") : null;
  if(!t) return;
  if(t.hasAttribute("data-navdel")){
    var p = t.getAttribute("data-navdel").split(",");

});

<script>
"use strict";
/* ==========================================================================
   Restyle behaviour: hero carousel, scroll-solid header, no-purchase catalogue.
   ========================================================================== */

/* --- hero: photographic carousel, matching the live site's 6-slide rotator --- */
var HERO_SLIDES = [
  { img:"assets/img/hero-7.jpg", script:"Colorful Lifestyle ... Colorful Dream ...", line:"Let’s enjoy our lives ..." },
  { img:"assets/img/hero-4.jpg", script:"From our own workings in Mogok", line:"Natural Myanmar gemstones" },
  { img:"assets/img/hero-9.jpg", script:"Mined, cut and set by one house", line:"Since 1985" },
  { img:"assets/img/hero-6.jpg", script:"Rubyland", line:"The Mogok valley" },
  { img:"assets/img/hero-5.jpg", script:"Origin, treatment, laboratory report", line:"Every stone documented" },
  { img:"assets/img/hero-8.jpg", script:"The Value", line:"Our jewellery collection" }
];
var heroI = 0, heroTimer = null;

function heroHTML(){
  return '<section class="hero" data-prd="Live-site hero carousel">'+
    HERO_SLIDES.map(function(s,i){
      return '<div class="hero-slide'+(i===0?" on":"")+'" data-slide="'+i+'">'+
        '<img src="'+s.img+'" alt="'+esc(s.line)+'"'+(i?' loading="lazy"':'')+'></div>';
    }).join("")+
    '<div class="hero-scrim"></div>'+
    '<div class="hero-in stack g2">'+
      '<p class="script-line" id="heroScript">'+esc(HERO_SLIDES[0].script)+'</p>'+
      '<h1 id="heroLine">'+esc(HERO_SLIDES[0].line)+'</h1>'+
      '<div class="hero-cta">'+
        '<a class="btn btn-primary" href="#/gemstones">View the collection</a>'+
        '<a class="btn btn-secondary" href="#/about/our-story">Our story</a>'+
      '</div>'+
    '</div>'+
    '<div class="hero-dots" role="tablist" aria-label="Hero slides">'+
      HERO_SLIDES.map(function(s,i){
        return '<button type="button" data-herodot="'+i+'" aria-current="'+(i===0)+'" aria-label="Slide '+(i+1)+'"></button>';
      }).join("")+
    '</div>'+
  '</section>';
}
function heroGo(i){
  var slides = $$(".hero-slide"); if(!slides.length) return;
  heroI = (i + HERO_SLIDES.length) % HERO_SLIDES.length;
  slides.forEach(function(el,n){ el.classList.toggle("on", n===heroI); });
  $$("[data-herodot]").forEach(function(b,n){ b.setAttribute("aria-current", n===heroI); });
  var s = $("#heroScript"), l = $("#heroLine");
  if(s) s.textContent = HERO_SLIDES[heroI].script;
  if(l) l.textContent = HERO_SLIDES[heroI].line;
}
function heroStart(){
  clearInterval(heroTimer);
  if(!$(".hero")) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  /* No auto-advance (§17): auto-rotating heroes undercut whichever slide
     the visitor is actually reading. Dots remain user-controlled. */
}
document.addEventListener("click", function(e){
  var d = e.target.closest && e.target.closest("[data-herodot]");
  if(d){ heroGo(+d.getAttribute("data-herodot")); heroStart(); }
});

/* --- header goes solid once past the hero --- */
function syncHeader(){
  var h = $(".hdr"); if(!h) return;
  var hero = $(".hero");
  if(!hero){ h.classList.add("solid"); return; }
  h.classList.toggle("solid", window.scrollY > hero.offsetHeight - 120);
}
window.addEventListener("scroll", syncHeader, {passive:true});

/* --- swap the homepage hero for the carousel, and mark hero-less pages --- */
var _viewHome = viewHome;
viewHome = function(){
  var html = _viewHome();
  // replace the original hero section with the photographic carousel
  html = html.replace(/<section class="hero"[\s\S]*?<\/section>/, heroHTML());
  return html;
};

var _route = route;
route = function(keepScroll){
  _route(keepScroll);
  var onHome = !location.hash.replace(/^#\/?/,"").split("?")[0];
  document.body.classList.toggle("nohero", !onHome && !document.body.classList.contains("admin"));
  if(onHome){ heroI = 0; heroStart(); } else { clearInterval(heroTimer); }
  syncHeader();
};

/* ==========================================================================
   No purchasing. Items are fully viewable; nothing on the site can transact.
   ========================================================================== */
var VIEW_ONLY = '<div class="viewonly"><b>Viewing only</b>'+

  );

<script>
"use strict";
/* ==========================================================================
   Journal — three education articles (§26: "3 articles is enough to launch").
   Written to the same standard as the rest of the house copy: specific,
   checkable, no adjectives doing work that facts should do.
   ========================================================================== */
var ARTICLES = [
  {
    slug:"what-makes-a-mogok-ruby-different",
    title:"What makes a Mogok ruby different",
    standfirst:"Marble-hosted geology, almost no iron, and the fluorescence that follows from it.",
    img:"assets/img/mining-2.jpg",
    alt:"The Mogok valley workings",
    body:[
      ["Geology, not marketing",
       "Most of the world's ruby forms in basalt, which is rich in iron. Mogok's does not. The valley's rubies grew in metamorphosed limestone — marble — which is unusually poor in iron and rich in chromium. Chromium is what makes a ruby red. Iron is what damps its fluorescence."],
      ["Why that combination matters",
       "Because there is so little iron to suppress it, Mogok material fluoresces strongly under ultraviolet light — including the ultraviolet present in ordinary daylight. The stone effectively adds its own red to the red it is already reflecting. This is the origin of the phrase you will hear used about fine Burmese ruby: that it appears lit from within. It is not a figure of speech; it is a measurable optical property, and it is the single clearest reason Mogok material has held a premium for centuries."],
      ["What it looks like in practice",
       "Set a Mogok ruby beside a Mozambican stone of the same weight and apparent colour, then move both from a window into a restaurant. The Mozambican stone will usually darken and flatten. The Mogok stone will often hold, and sometimes appear to brighten. We photograph every stone under both daylight-balanced and incandescent light for exactly this reason — a single studio image tells you less than half of what you need to know."],
      ["What origin does not tell you",
       "Origin is not a grade. There is ordinary Mogok material and there is exceptional Mozambican material, and a laboratory origin report says where a stone formed, not how good it is. Colour, clarity, cut and treatment status all still apply. Origin narrows the field; it does not settle the question."]
    ]
  },
  {
    slug:"heated-or-unheated-what-it-means",
    title:"Heated or unheated: what it means",
    standfirst:"Why the distinction moves the price, and how a laboratory establishes it.",
    img:"assets/img/value-4.jpg",
    alt:"A cut and polished stone",
    body:[
      ["What heating actually does",
       "Heating a ruby or sapphire to somewhere between 800°C and 1,800°C dissolves the fine rutile inclusions — the silk — that scatter light inside the stone, and can shift its colour toward a more saturated red or blue. The change is permanent and, done properly, leaves no residue. It is an accepted and very old practice: the substantial majority of corundum on the market today has been heated."],
      ["Why unheated stones cost more",
       "Not because heating is a defect, but because an unheated stone of fine colour is evidence that the ground produced that colour on its own. Most rough does not. Scarcity, not virtue, sets the premium — and at fine quality it is a large one, frequently multiples rather than percentages."],
      ["How a laboratory decides",
       "A gemmologist looks for the physical signature heat leaves behind: rutile silk that has begun to dissolve into discontinuous dashes, healed fractures with a fingerprint pattern, melted or recrystallised mineral inclusions, and — under magnification — tension halos around crystals that expanded at different rates from the host. Spectroscopy supports the reading. It is an interpretation of evidence, not a single test, which is why two competent laboratories can occasionally disagree on a borderline stone."],
      ["What we will and will not tell you",
       "Where a laboratory has ruled on treatment, we publish the report number and you can verify it with the issuing lab yourself. Where no report exists, the stone's page says the finding is our own house assessment rather than a laboratory determination. We would rather lose a sale to that sentence than have you discover the distinction later."]
    ]
  },
  {
    slug:"how-to-read-a-laboratory-report",
    title:"How to read a laboratory report",
    standfirst:"A line-by-line walk through an origin and treatment report.",
    img:"assets/img/feature-2.jpg",
    alt:"A finished piece",
    body:[
      ["The four lines that carry the value",
       "A coloured-stone report runs to a page or more, but four entries do most of the work: <em>Species and variety</em> (is it corundum, and is it ruby or sapphire), <em>Origin</em> (where it formed, usually phrased as an opinion because that is what it is), <em>Treatment</em> or <em>Comment</em> (what has been done to it), and the <em>report number and date</em>. Read those four before anything else."],
      ["Read the hedging carefully",
       "Origin is expressed as an opinion — you will see wording along the lines of \"the analysed properties are consistent with those of rubies from Mogok, Myanmar.\" That is the strongest form the science supports, not a weak claim. Conversely, \"no indications of heating\" is meaningfully different from a positive statement that a stone is unheated: it says the evidence for heat was not found. In practice the trade treats it as unheated, but it is worth knowing what the sentence actually says."],
      ["Trade colour terms are issued, not chosen",
       "\"Pigeon's Blood\" and \"Royal Blue\" are proprietary designations that particular laboratories apply against their own colour references. They are not free-floating adjectives a seller may adopt. We use such a term only where a laboratory has issued it for that specific stone, and we name the laboratory and report number alongside it every time. A seller using the phrase with no report behind it is telling you something."],
      ["Verify it yourself",
       "GRS, Gübelin, Lotus and AIGS all operate public report-verification tools. Every report number we publish is meant to be typed into one. If a number does not resolve, that is worth an email — to them or to us."]
    ]
  }
];

function pgJournal(){
  return pgHead("Journal","Understanding gemstones","Plain explanations of the things that decide what a coloured stone is worth.")+
  '<section class="band band-ivory"><div class="wrap">'+
    '<div class="grid-gems">'+ARTICLES.map(function(a){
      return '<a class="artcard" href="#/journal/'+a.slug+'">'+img(a.img,a.alt,"3/2")+
        '<div class="card-t"><span class="card-type">Learn</span>'+
        '<h4 style="font-size:20px">'+esc(a.title)+'</h4>'+
        '<p class="t-sm" style="color:var(--ink-meta)">'+esc(a.standfirst)+'</p></div></a>';
    }).join("")+'</div>'+
    '<p style="margin-top:var(--s5); font-size:13px; color:var(--ink-meta); max-width:60ch">'+
    'More articles follow as we write them. We would rather publish three we can stand behind than twelve that restate each other.</p>'+
  '</div></section>'+
  ctaBand("Ask us anything about a stone you are considering.");
}

function pgArticle(slug){
  var a = ARTICLES.filter(function(x){ return x.slug===slug; })[0];
  if(!a) return pgJournal();
  var others = ARTICLES.filter(function(x){ return x.slug!==slug; });
  return pgHead("Journal · Learn", a.title, a.standfirst)+
  '<section class="band band-ivory"><div class="wrap"><div class="ed-3">'+
    '<div class="prose">'+a.body.map(function(s){
      return '<h3 style="font-size:19px; margin-top:var(--s3)">'+esc(s[0])+'</h3><p>'+s[1]+'</p>';
    }).join("")+'</div>'+
    '<div>'+img(a.img,a.alt,"4/5")+'</div>'+
  '</div></div></section>'+
  '<section class="band band-ivory-deep band-tight"><div class="wrap">'+
    '<div class="sec-head"><div class="stack"><p class="eyebrow">Also in the Journal</p><h3>Keep reading</h3></div></div>'+
    '<div class="ed">'+others.map(function(o){
      return '<a class="artcard" href="#/journal/'+o.slug+'">'+img(o.img,o.alt,"3/2")+
        '<div class="card-t"><span class="card-type">Learn</span><h4 style="font-size:19px">'+esc(o.title)+'</h4></div></a>';
    }).join("")+'</div>'+
  '</div></section>'+
  ctaBand("Speak to a specialist.");
}

/* register: Journal is a real section now, not a stub */
PAGES["journal"] = [pgJournal,"journal"];
ARTICLES.forEach(function(a){
  PAGES["journal/"+a.slug] = [function(){ return pgArticle(a.slug); },"journal"];
});
delete STUBS.journal;
delete STUBS.mogok;
delete STUBS.jewellery;

<script>
"use strict";
/* ==========================================================================
   Per-route metadata (§19). Hash routing still limits crawlability — the real
   fix is path-based routing with pre-rendering (P0-7, a separate migration) —
   but titles, descriptions, canonicals and OG tags are correct per route now,
   which is what social sharing and any JS-executing crawler will read.
   ========================================================================== */
var SITE_URL = "https://spgems-myanmar.com";
var OG_FALLBACK = "assets/img/hero-4.jpg";

function metaFor(parts, qs){
  var key = parts.join("/");
  var T = function(t,d,img){ return {title:t+" | SP Gems", desc:d, img:img||OG_FALLBACK}; };

  if(!parts.length) return T("Natural Myanmar Gemstones from Mogok",
    "SP Gems mines, cuts and sets Myanmar gemstones from its own workings in the Mogok valley. Trading since 1985, established 2007. Every stone documented: origin, treatment, laboratory report.");

  if(parts[0]==="gemstones" && parts[1]){
    var g = GEMS.filter(function(x){ return x.slug===parts[1]; })[0];
    if(g) return T(g.title+", "+g.carat.toFixed(2)+" ct",
      g.title+" of "+g.carat.toFixed(2)+" ct from "+g.origin+". "+
      (g.treatment==="unheated"?"Unheated":"Heated")+
      (g.lab?", "+g.lab+" report "+g.certNo:"")+". "+g.clarity+". Viewing by appointment.");
    return T("Stone not found","That stone is not in the current catalogue.");
  }
  if(parts[0]==="gemstones") return T("Gemstone Collection",
    "Individually catalogued Myanmar rubies, sapphires and spinels. Full specification, origin, treatment status and laboratory report on every stone. Viewing only — nothing is sold online.");

  var M = {
    "about/our-story":            T("Our Story","The SanPya family began trading in Mogok in 1985. SP Gems was formally established in 2007 and still works the same valley."),
    "about/the-value":            T("The Value","Design-led jewellery built around stones from our own workings, led by Aung Kyaw Zin."),
    "about/mining-works":         T("Mining Works","Our own workings on the eastern flank of the Mogok valley, and the Yangon workshop where every stone is cut."),
    "about/milestones":           T("Milestones","Four decades in the Mogok valley, set down in order."),
    "about/csr":                  T("Corporate Social Responsibility","Schooling, water access and landslide support in the valley our people live in."),
    "about/responsible-sourcing": T("Responsible Sourcing","What we can document and what we cannot. Chain-of-custody records, laboratory reports, and a plain position on the sanctions environment."),
    "news":                       T("News & Events","Recent recoveries, new pieces and workshop news from SP Gems."),
    "contact":                    T("Contact","No. 30 A, Pyay Road, Mayangone, Yangon. Telephone, Viber and email. Office hours 9.00–17.00 Myanmar Standard Time."),
    "journal":                    T("Journal","Plain explanations of origin, treatment and laboratory reports for coloured stones.")
  };
  if(M[key]) return M[key];
  if(parts[0]==="journal" && parts[1]){
    var a = (typeof ARTICLES!=="undefined") ? ARTICLES.filter(function(x){ return x.slug===parts[1]; })[0] : null;
    if(a) return T(a.title, a.standfirst, a.img);
  }
  if(parts[0]==="admin") return T("Content management","Administration.");
  return T("Page not found","That address is not part of this site.");
}

function setMeta(name, val, attr){
  attr = attr || "name";
  var el = document.head.querySelector("meta["+attr+"='"+name+"']");
  if(!el){ el = document.createElement("meta"); el.setAttribute(attr, name); document.head.appendChild(el); }
  el.setAttribute("content", val);
}
function applyMeta(parts, qs){
  var m = metaFor(parts, qs);
  var url = SITE_URL + "/#/" + parts.join("/") + (qs ? "?"+qs : "");
  document.title = m.title;
  setMeta("description", m.desc);
  setMeta("og:title", m.title, "property");
  setMeta("og:description", m.desc, "property");
  setMeta("og:type", parts[0]==="gemstones" && parts[1] ? "product" : "website", "property");
  setMeta("og:url", url, "property");
  setMeta("og:image", SITE_URL + "/" + m.img, "property");
  setMeta("og:site_name", "SP Gems", "property");
  setMeta("twitter:card", "summary_large_image");
  setMeta("twitter:title", m.title);
  setMeta("twitter:description", m.desc);
  setMeta("twitter:image", SITE_URL + "/" + m.img);
  var link = document.head.querySelector("link[rel=canonical]");
  if(!link){ link = document.createElement("link"); link.rel="canonical"; document.head.appendChild(link); }
  link.href = url;
  setJsonLd(parts);
}

/* JSON-LD: Organization sitewide, plus Product + BreadcrumbList per stone.
   No `price` is emitted — nothing is sold online, and a price-free Offer is
   the honest shape for price-on-request. */
function setJsonLd(parts){
  var blocks = [{
    "@context":"https://schema.org", "@type":"JewelryStore", "name":"SP GEMS & Jewellery",
    "url":SITE_URL, "logo":SITE_URL+"/assets/img/logo.png",
    "description":"Myanmar gemstone mining, cutting and fine jewellery. Mogok and Yangon, trading since 1985.",
    "foundingDate":"2007",
    "address":{"@type":"PostalAddress","streetAddress":"No. 30 A, Pyay Road, (7 Mile), Mayangone Tsp","addressLocality":"Yangon","addressCountry":"MM","postOfficeBoxNumber":"11061"},
    "telephone":["+95-1-660-397","+95-1-666-052","+95-1-666-053"],
    "faxNumber":"+95-1-664-574",
    "email":"spgems.myanmar@gmail.com",
    "openingHoursSpecification":[{"@type":"OpeningHoursSpecification",
      "dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
      "opens":"09:00","closes":"17:00"}]
  }];

  if(parts[0]==="gemstones" && parts[1]){
    var g = GEMS.filter(function(x){ return x.slug===parts[1]; })[0];
    if(g){
      var avail = g.availability==="sold" ? "SoldOut" : (g.availability==="reserved" ? "PreOrder" : "InStock");
      var props = [
        {"@type":"PropertyValue","name":"Carat weight","value":g.carat.toFixed(2)+" ct"},
        {"@type":"PropertyValue","name":"Origin","value":g.origin},
        {"@type":"PropertyValue","name":"Treatment","value":g.treatment==="unheated"?"No indication of heating":"Heated"},
        {"@type":"PropertyValue","name":"Shape","value":g.shape},
        {"@type":"PropertyValue","name":"Dimensions","value":g.dims.map(function(d){return d.toFixed(2);}).join(" × ")+" mm"}
      ];
      if(g.lab) props.push({"@type":"PropertyValue","name":"Laboratory report","value":g.lab+" "+g.certNo});
      blocks.push({
        "@context":"https://schema.org","@type":"Product",
        "name":g.title+", "+g.carat.toFixed(2)+" ct",
        "sku":g.stoneId,
        "description":g.provenance,
        "brand":{"@type":"Brand","name":"SP Gems"},
        "additionalProperty":props,
        "offers":{"@type":"Offer","availability":"https://schema.org/"+avail,
                  "priceCurrency":"USD","url":SITE_URL+"/#/gemstones/"+g.slug,
                  "availabilityStarts":undefined}
      });
      blocks.push({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":SITE_URL+"/"},
        {"@type":"ListItem","position":2,"name":"Gemstones","item":SITE_URL+"/#/gemstones"},
        {"@type":"ListItem","position":3,"name":g.title}
      ]});
    }
  }
  var old = document.getElementById("ld-json");
  if(old) old.remove();
  var s = document.createElement("script");
  s.type = "application/ld+json"; s.id = "ld-json";
  s.textContent = JSON.stringify(blocks.length===1 ? blocks[0] : blocks);
  document.head.appendChild(s);
}

/* hook metadata into the router */
var _routeSeo = route;
route = function(keepScroll){
  _routeSeo(keepScroll);
  var hsh = location.hash.replace(/^#/,"") || "/";
  var qi = hsh.indexOf("?"), path = qi<0?hsh:hsh.slice(0,qi), qs = qi<0?"":hsh.slice(qi+1);
  try { applyMeta(path.split("/").filter(Boolean), qs); } catch(e){}
};
</script>

<script>"use strict";route();</script>
</body>
