<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Gems Digital Gallery</title>
<!-- faceted-gem monogram favicon — SDD §19.2 (the legacy site ships none) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171412'/%3E%3Cg fill='none' stroke='%23B08D57' stroke-width='1.1' stroke-linejoin='round'%3E%3Cpath d='M6 12.5 L16 5 L26 12.5 L16 27 Z'/%3E%3Cpath d='M6 12.5 H26'/%3E%3Cpath d='M11 12.5 L16 5 L21 12.5 L16 27 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Dancing+Script:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="description" content="SP Gems mines, cuts and sets Myanmar gemstones from its own workings in the Mogok valley. Trading since 1985. Every stone documented: origin, treatment, laboratory report.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://spgems-myanmar.com/">
</head>
<body>

<style>
/* ============================================================
   SP GEMS — demonstration build
   Design tokens are transcribed from PRD v1.0 section 28.2/28.3.
   Single committed light identity: the stones supply the colour,
   the interface supplies the quiet (section 28.2).
   ============================================================ */
:root{
  --ink:#171412;
  --ink-secondary:#4A443F;
  --ink-meta:#5C564F;      /* AA-safe on ivory: 7.0:1 (was #6B645D) */
  --ink-tertiary:#7A736C;  /* PRD token; disabled states only */
  --ivory:#F7F4EF;
  --ivory-deep:#EFEAE2;
  --charcoal:#232120;
  --charcoal-deep:#141312;
  --stone:#8A8A8A;
  --rule:#DDD6CC;
  --rule-dark:#3A3735;
  --gold:#B08D57;
  --gold-text:#7E6440;     /* gold darkened to clear 4.5:1 on ivory */
  --ruby:#8C1D2A;
  --success:#3F6B4A; --warn:#8A6A20; --error:#8C2F26;

  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:48px;
  --s6:64px; --s7:96px; --s8:128px; --s9:192px;

  --ease-in:cubic-bezier(0.22,1,0.36,1);
  --ease-out:cubic-bezier(0.4,0,1,1);
  --max:1440px; --max-text:1200px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ivory); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.65;
  font-weight:400; -webkit-font-smoothing:antialiased;
  padding-bottom:56px; /* demo strip */
}
img,svg{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
.dark :focus-visible,.band-dark :focus-visible{outline-color:var(--gold)}
::selection{background:rgba(176,141,87,.28)}

/* ---------- type scale — PRD FR-UI-011 ---------- */
.t-display{font-family:var(--f-display); font-size:61px; line-height:1.05; font-weight:400; letter-spacing:-.01em; margin:0; text-wrap:balance}
h1,.t-h1{font-family:var(--f-display); font-size:49px; line-height:1.1; font-weight:400; margin:0; text-wrap:balance}
h2,.t-h2{font-family:var(--f-display); font-size:39px; line-height:1.15; font-weight:400; margin:0; text-wrap:balance}
h3,.t-h3{font-family:var(--f-display); font-size:31px; line-height:1.2; font-weight:400; margin:0; text-wrap:balance}
h4,.t-h4{font-family:var(--f-display); font-size:25px; line-height:1.3; font-weight:500; margin:0}
.t-lg{font-size:20px; line-height:1.6}
.t-sm{font-size:15px; line-height:1.55}
.t-cap{font-size:13px; line-height:1.5}
p{margin:0; max-width:68ch}
.measure{max-width:66ch}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* small-caps label — PRD FR-UI-013 */
.eyebrow{
  font-size:12px; font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-meta); margin:0;
}
.band-dark .eyebrow{color:var(--gold)}

/* ---------- layout ---------- */
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--s4)}
.wrap-text{max-width:var(--max-text); margin:0 auto; padding:0 var(--s4)}
.band{padding:var(--s7) 0}
.band-tight{padding:var(--s6) 0}
.band-ivory{background:var(--ivory); color:var(--ink)}
.band-ivory-deep{background:var(--ivory-deep); color:var(--ink)}
.band-dark{background:var(--charcoal); color:var(--ivory)}
.band-dark p{color:#D9D3CA}
.band-dark .rule{background:var(--rule-dark)}
.rule{height:1px; background:var(--rule); border:0; margin:0}
.stack{display:flex; flex-direction:column}
.g1{gap:var(--s1)} .g2{gap:var(--s2)} .g3{gap:var(--s3)}
.g4{gap:var(--s4)} .g5{gap:var(--s5)} .g6{gap:var(--s6)}

/* ---------- buttons — PRD 28.5 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  padding:15px 28px; border-radius:2px; border:1px solid transparent;
  font-size:13px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; cursor:pointer; background:none;
  transition:background 180ms var(--ease-in), color 180ms var(--ease-in), border-color 180ms var(--ease-in);
}
.btn-primary{background:var(--ink); color:var(--ivory); border-color:var(--ink)}
.btn-primary:hover{background:#2E2A26; border-color:#2E2A26}
.btn-secondary{border-color:var(--ink); color:var(--ink)}
.btn-secondary:hover{background:var(--ink); color:var(--ivory)}
.band-dark .btn-primary{background:var(--ivory); color:var(--ink); border-color:var(--ivory)}
.band-dark .btn-primary:hover{background:#fff}
.band-dark .btn-secondary{border-color:#6E6862; color:var(--ivory)}
.band-dark .btn-secondary:hover{background:var(--ivory); color:var(--ink); border-color:var(--ivory)}
.btn-full{width:100%}
.link{
  display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  font-size:13px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  border-bottom:1px solid var(--rule); padding-bottom:4px; width:fit-content;
  transition:border-color 180ms var(--ease-in);
}
.link:hover{border-color:var(--ink)}
.band-dark .link{border-color:#4A4643} .band-dark .link:hover{border-color:var(--gold)}
.link-plain{color:var(--ink-secondary); text-decoration:none; border-bottom:1px solid var(--rule)}
.link-plain:hover{border-color:var(--ink); color:var(--ink)}

/* badge — text only, 1px border, no fill (PRD 28.5) */
.badge{
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px;
  border:1px solid var(--rule); border-radius:0;
  font-size:11px; font-weight:500; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-secondary); white-space:nowrap;
}
.badge-strong{border-color:var(--ink); color:var(--ink)}
.badge-exc{border-color:var(--gold); color:var(--gold-text)}
.badge-sold{border-color:var(--ink-meta); color:var(--ink-meta)}
.band-dark .badge{border-color:#4A4643; color:#C9C3BA}

/* ---------- gem plate — PRD 12.7 neutral grey ground ---------- */
.plate{position:relative; background:var(--stone); aspect-ratio:4/5; overflow:hidden}
.plate svg{width:100%; height:100%}
.plate-mark{
  position:absolute; right:10px; bottom:8px; font-family:var(--f-mono);
  font-size:9px; letter-spacing:.14em; color:rgba(255,255,255,.5); text-transform:uppercase;
}
.plate-note{
  position:absolute; left:10px; top:9px; font-family:var(--f-mono);
  font-size:9px; letter-spacing:.1em; color:rgba(255,255,255,.45); text-transform:uppercase;
}
</style>
<style>
/* ---------- site header ---------- */
.hdr{position:sticky; top:0; z-index:60; background:var(--ivory); border-bottom:1px solid var(--rule)}
.hdr-in{max-width:var(--max); margin:0 auto; padding:0 var(--s4); display:flex; align-items:center; gap:var(--s4); height:76px}
.brand{display:flex; flex-direction:column; text-decoration:none; line-height:1; flex:0 0 auto}
.brand-n{font-family:var(--f-display); font-size:26px; letter-spacing:.06em; font-weight:500}
.brand-s{font-size:9px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-meta); margin-top:5px}
.nav{display:flex; gap:var(--s4); margin-left:auto; align-items:center}
.nav a{
  text-decoration:none; font-size:12px; font-weight:500; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-secondary); padding:6px 0;
  border-bottom:1px solid transparent; transition:color 180ms var(--ease-in), border-color 180ms var(--ease-in);
}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--ink)}
/* header button uses the standard site button */
.burger{display:none; margin-left:auto; background:none; border:1px solid var(--rule); padding:10px 14px; border-radius:2px; cursor:pointer; font-size:11px; letter-spacing:.12em; text-transform:uppercase}

/* ---------- hero — max 80vh (PRD 29 s1) ---------- */
.hero{position:relative; height:80vh; max-height:760px; min-height:520px; background:var(--charcoal-deep); overflow:hidden; display:flex; align-items:flex-end}
.hero canvas{position:absolute; inset:0; width:100%; height:100%}
.hero-scrim{position:absolute; inset:0; background:linear-gradient(to top,rgba(20,19,18,.82) 0%,rgba(20,19,18,.35) 45%,rgba(20,19,18,.12) 100%)}
.hero-in{position:relative; max-width:var(--max); margin:0 auto; padding:0 var(--s4) var(--s6); width:100%; color:var(--ivory)}
.hero h1{font-size:61px; line-height:1.05; max-width:16ch; color:#fff}
.hero p{color:#D9D3CA; max-width:52ch}
.hero .eyebrow{color:var(--gold)}
.hero-cta{display:flex; gap:var(--s2); flex-wrap:wrap; margin-top:var(--s3)}
.hero-cta .btn-primary{background:var(--ivory); color:var(--ink); border-color:var(--ivory)}
.hero-cta .btn-secondary{border-color:rgba(247,244,239,.55); color:var(--ivory)}
.hero-cta .btn-secondary:hover{background:var(--ivory); color:var(--ink); border-color:var(--ivory)}

/* ---------- section heading ---------- */
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s5)}
.sec-head .stack{gap:12px}

/* ---------- gem card — PRD FR-CAT-002/003 ---------- */
.grid-gems{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s5) var(--s4)}
.card{display:flex; flex-direction:column; gap:var(--s2); text-decoration:none; color:inherit; background:none; border:0; padding:0; text-align:left; cursor:pointer}
.card .plate{transition:transform 400ms var(--ease-in)}
.card:hover .plate{transform:scale(1.02)}
.card-t{display:flex; flex-direction:column; gap:7px}
.card-type{font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-secondary)}
.card-carat{font-family:var(--f-display); font-size:25px; line-height:1.15; font-variant-numeric:tabular-nums}
.card:hover .card-carat{box-shadow:0 1px 0 var(--rule)}
.card-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:3px}
.card-price{font-size:14px; color:var(--ink-meta); font-variant-numeric:tabular-nums; margin-top:2px}
.card-sold .plate{opacity:.72}

/* ---------- catalogue ---------- */
.cat-head{padding:var(--s6) 0 var(--s4)}
.cat-layout{display:grid; grid-template-columns:264px 1fr; gap:var(--s6); align-items:start; padding-bottom:var(--s7)}
.filters{position:sticky; top:100px; display:flex; flex-direction:column; gap:var(--s3)}
.fgroup{display:flex; flex-direction:column; gap:12px; padding-bottom:var(--s3); border-bottom:1px solid var(--rule)}
.fgroup:last-child{border-bottom:0}
.fopt{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--ink-secondary); cursor:pointer; padding:2px 0}
.fopt input{width:15px; height:15px; accent-color:var(--ink); margin:0; flex:0 0 auto; cursor:pointer}
.fopt:hover{color:var(--ink)}
.fopt.is-zero{color:var(--ink-tertiary); cursor:not-allowed}
.fopt .fcount{margin-left:auto; font-family:var(--f-mono); font-size:12px; color:var(--ink-tertiary); font-variant-numeric:tabular-nums}
.frange{display:flex; align-items:center; gap:10px}
.frange input[type=number]{
  width:100%; padding:8px 10px; border:0; border-bottom:1px solid var(--rule); border-radius:2px;
  background:none; font:inherit; font-size:15px; font-variant-numeric:tabular-nums; color:var(--ink);
}
.frange input:focus{border-bottom-color:var(--ink); outline:none; box-shadow:0 1px 0 var(--ink)}
.fmore{
  background:none; border:0; border-top:1px solid var(--rule); padding:var(--s2) 0 0; cursor:pointer;
  text-align:left; font-size:12px; font-weight:500; letter-spacing:.13em; text-transform:uppercase; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.fmore .chev{transition:transform 200ms var(--ease-in)}
.fmore[aria-expanded="true"] .chev{transform:rotate(180deg)}
.swatches{display:grid; grid-template-columns:repeat(6,1fr); gap:7px}
.sw{aspect-ratio:1; border:1px solid var(--rule); cursor:pointer; padding:0; border-radius:0; position:relative}
.sw[aria-pressed="true"]{outline:1px solid var(--ink); outline-offset:2px; border-color:var(--ink)}
.shapes{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.shp{aspect-ratio:1; border:1px solid var(--rule); background:none; cursor:pointer; display:grid; place-items:center; padding:5px; border-radius:0}
.shp[aria-pressed="true"]{border-color:var(--ink); background:var(--ivory-deep)}
.shp svg{width:100%; height:100%; stroke:var(--ink-secondary); fill:none; stroke-width:1.1}
.shp[aria-pressed="true"] svg{stroke:var(--ink)}

.chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center; min-height:32px}
.chip{
  display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--rule);
  border-radius:2px; font-size:12px; letter-spacing:.06em; background:none; cursor:pointer; color:var(--ink-secondary);
}
.chip:hover{border-color:var(--ink); color:var(--ink)}
.chip .x{font-size:14px; line-height:1}
.cat-bar{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s3)}
.count{font-size:15px; color:var(--ink-meta); font-variant-numeric:tabular-nums}
.sortsel{border:0; border-bottom:1px solid var(--rule); background:none; font:inherit; font-size:14px; padding:6px 22px 6px 4px; border-radius:0; cursor:pointer; color:var(--ink);
  appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-meta) 50%),linear-gradient(135deg,var(--ink-meta) 50%,transparent 50%);
  background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.empty{border:1px solid var(--rule); padding:var(--s6) var(--s5); display:flex; flex-direction:column; gap:var(--s3); align-items:flex-start}
.loadmore{display:flex; justify-content:center; padding-top:var(--s5)}
</style>
<style>
/* ---------- gemstone detail — PRD 13.1 two column, sticky rail ---------- */
.det{display:grid; grid-template-columns:58fr 42fr; gap:var(--s6); align-items:start; padding:var(--s5) 0 var(--s7)}
.det-media{display:flex; flex-direction:column; gap:var(--s2)}
.det-hero{cursor:zoom-in; position:relative; background:var(--stone)}
.thumbs{display:flex; gap:10px; flex-wrap:wrap}
.thumb{width:74px; background:var(--stone); border:1px solid transparent; cursor:pointer; padding:0; position:relative; border-radius:0}
.thumb[aria-current="true"]{border-color:var(--ink)}
.thumb svg{width:100%; aspect-ratio:1/1}
.thumb-ic{position:absolute; right:4px; bottom:3px; font-family:var(--f-mono); font-size:8px; color:rgba(255,255,255,.8); letter-spacing:.08em}
.rail{position:sticky; top:100px; display:flex; flex-direction:column; gap:var(--s4)}
.ident{display:flex; flex-direction:column; gap:12px}
.ident h1{font-size:39px; line-height:1.12}
.ident-sub{font-size:17px; color:var(--ink-secondary); font-variant-numeric:tabular-nums}
.ident-id{font-family:var(--f-mono); font-size:12px; letter-spacing:.09em; color:var(--ink-meta)}
.ident-badges{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}

.spec{border-top:1px solid var(--rule); font-variant-numeric:tabular-nums}
.spec-row{display:grid; grid-template-columns:40% 1fr; gap:var(--s2); padding:13px 0; border-bottom:1px solid var(--rule); align-items:baseline}
.spec-k{font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-meta); display:flex; align-items:center; gap:6px}
.spec-v{font-size:16px; color:var(--ink)}
.qmark{
  width:17px; height:17px; border:1px solid var(--rule); border-radius:50%; background:none; cursor:pointer;
  font-size:10px; line-height:1; color:var(--ink-meta); display:inline-grid; place-items:center; flex:0 0 auto; padding:0;
}
.qmark:hover{border-color:var(--ink); color:var(--ink)}
.pop{
  position:absolute; z-index:80; max-width:320px; background:var(--charcoal); color:#E4DFD7;
  padding:var(--s3); font-size:14px; line-height:1.55; box-shadow:0 8px 32px rgba(20,19,18,.28);
}
.pop a{color:var(--gold)}
.pop-close{position:absolute; top:6px; right:8px; background:none; border:0; color:#9C958C; cursor:pointer; font-size:16px; line-height:1; padding:4px}

.price-blk{display:flex; flex-direction:column; gap:6px; padding-top:var(--s1)}
.price-v{font-family:var(--f-display); font-size:31px; line-height:1.15; font-variant-numeric:tabular-nums}
.avail{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-meta); display:flex; align-items:center; gap:8px}
.avail::before{content:""; width:6px; height:6px; background:var(--success); flex:0 0 auto}
.avail-sold::before{background:var(--ink-tertiary)}
.avail-res::before{background:var(--warn)}
.cta-blk{display:flex; flex-direction:column; gap:14px}
.msg-row{display:flex; gap:var(--s2); flex-wrap:wrap; align-items:center}
.msg-row a{font-size:13px; color:var(--ink-secondary); text-decoration:none; border-bottom:1px solid var(--rule); padding-bottom:2px}
.msg-row a:hover{border-color:var(--ink); color:var(--ink)}
.reassure{font-size:13px; color:var(--ink-meta)}

/* treatment disclosure — PRD FR-GEM-052, visually distinct, always present */
.treat{border:1px solid var(--ink); padding:var(--s4); display:flex; flex-direction:column; gap:12px; background:var(--ivory-deep)}
.treat-hd{display:flex; align-items:center; gap:12px}
.treat-hd .eyebrow{color:var(--ink)}
.verified{font-size:12px; color:var(--ink-secondary); display:flex; align-items:center; gap:7px}
.verified::before{content:""; width:5px; height:5px; background:var(--success); flex:0 0 auto}

/* editorial narrative blocks — asymmetric (PRD FR-UI-023) */
.ed{display:grid; grid-template-columns:1fr 1fr; gap:var(--s6); align-items:center}
.ed-off{padding-top:var(--s5)}
.ed-3{display:grid; grid-template-columns:5fr 7fr; gap:var(--s6); align-items:start}
.cert-card{display:grid; grid-template-columns:150px 1fr; gap:var(--s4); align-items:start; border:1px solid var(--rule); padding:var(--s4)}
.cert-thumb{background:var(--ivory-deep); border:1px solid var(--rule); aspect-ratio:3/4; display:grid; place-items:center; position:relative; overflow:hidden}
.cert-wm{position:absolute; inset:0; display:grid; place-items:center; transform:rotate(-32deg); font-family:var(--f-mono); font-size:10px; letter-spacing:.3em; color:rgba(23,20,18,.16); text-align:center; line-height:2.4}
.gal{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s3)}
.gal figure{margin:0; display:flex; flex-direction:column; gap:10px}
.gal figcaption{font-size:13px; color:var(--ink-meta); line-height:1.5}

/* ---------- modal + viewer ---------- */
.ov{position:fixed; inset:0; z-index:200; display:none}
.ov[data-open="true"]{display:block}
.ov-bd{position:absolute; inset:0; background:rgba(20,19,18,.72)}
.modal{
  position:relative; max-width:560px; margin:6vh auto; background:var(--ivory); padding:var(--s5);
  max-height:88vh; overflow:auto; box-shadow:0 24px 64px rgba(20,19,18,.32);
}
.modal-x{position:absolute; top:14px; right:14px; background:none; border:0; font-size:22px; line-height:1; cursor:pointer; padding:8px; color:var(--ink-secondary)}
.ctx{display:flex; gap:var(--s3); align-items:center; border:1px solid var(--rule); padding:12px; background:var(--ivory-deep)}
.ctx .plate{width:56px; aspect-ratio:1; flex:0 0 auto}
.fld{display:flex; flex-direction:column; gap:7px}
.fld label{font-size:12px; font-weight:500; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-secondary)}
.fld input,.fld select,.fld textarea{

.viewer-bar .mono{font-size:12px}
.viewer-stage{flex:1; overflow:hidden; display:grid; place-items:center; cursor:grab; touch-action:none}
.viewer-stage.is-drag{cursor:grabbing}

.viewer-stage.is-drag svg{transition:none}
.vbtn{background:none; border:1px solid #3A3735; color:#C9C3BA; padding:8px 13px; cursor:pointer; border-radius:2px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; min-width:44px; min-height:44px; display:inline-grid; place-items:center}

/* glossary — PRD FR-GEM-056: disclosure, not hover tooltip */
var GLOSS = {
  Treatment:"Most rubies and sapphires on the market are heated to improve colour and clarity. This is accepted practice and must always be disclosed. Unheated stones of comparable quality are considerably rarer and command a premium.",

/* ---------- deterministic pseudo-random, seeded per stone ---------- */
function rng(seed){ var s = 0; for (var i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) >>> 0;
  return function(){ s = (s*1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- facet-diagram geometry ---------- */
function samplePoly(v, n){
  var per=[], tot=0, i;
  for(i=0;i<v.length;i++){ var a=v[i], b=v[(i+1)%v.length];
    var d=Math.hypot(b[0]-a[0], b[1]-a[1]); per.push(d); tot+=d; }
  var out=[];
  for(i=0;i<n;i++){
    var d=(i/n)*tot, k=0;
    while(d>per[k]){ d-=per[k]; k=(k+1)%v.length; }
    var a=v[k], b=v[(k+1)%v.length], f=per[k]?d/per[k]:0;
    out.push([a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]);
  }
  return out;
}
function shapePoints(shape, n){
  if(shape==="Emerald"){
    var w=0.76, k=0.28;
    return samplePoly([[-w+k*w,-1],[w-k*w,-1],[w,-1+k],[w,1-k],[w-k*w,1],[-w+k*w,1],[-w,1-k],[-w,-1+k]], n);
  }
  var P=[];
  for(var i=0;i<n;i++){
    var t=(i/n)*Math.PI*2 - Math.PI/2, c=Math.cos(t), s=Math.sin(t), x, y, p, u, f;
    switch(shape){
      case "Round":    x=c;        y=s; break;
      case "Oval":     x=c*0.78;   y=s; break;
      case "Cabochon": x=c*0.86;   y=s*0.92; break;
      case "Cushion":  p=2/3.4;
        x=Math.sign(c)*Math.pow(Math.abs(c),p)*0.93;
        y=Math.sign(s)*Math.pow(Math.abs(s),p); break;
      case "Pear":     u=(s+1)/2; f=1-0.70*Math.pow(u,1.7); x=c*f*0.94; y=s; break;
      case "Marquise": x=Math.sign(c)*Math.pow(Math.abs(c),0.55)*0.60; y=s; break;
      default:         x=c*0.80;   y=s;
    }
    P.push([x,y]);
  }
  return P;
}
function pathOf(pts, sc, cx, cy, r){
  var d="";
  for(var i=0;i<pts.length;i++){
    d += (i?"L":"M") + (cx+pts[i][0]*sc*r).toFixed(2) + " " + (cy+pts[i][1]*sc*r).toFixed(2);
  }
  return d+"Z";
}

/* Returns a schematic facet diagram. view: 0 front, 1 three-quarter,
   2 scale reference, 3 second lighting condition, 4 macro. */
function gemSVG(g, view, w, h){
  view = view||0; w = w||400; h = h||500;
  var rand = rng(g.stoneId+view), tint = g.tint, step = (g.shape==="Emerald");
  var cabo = (g.shape==="Cabochon");
  var cx=w/2, cy=h/2, r=Math.min(w,h)*0.36;
  if(view===2) r*=0.62;
  if(view===4) r*=1.62;

  var warm = (view===3);
  if(warm){ tint = shiftWarm(tint); }

  var N=96, pts=shapePoints(g.shape,N);
  var facet='stroke="rgba(255,255,255,.46)" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"';
  var edge ='stroke="rgba(20,19,18,.46)" stroke-width="1.4" fill="none" vector-effect="non-scaling-stroke"';
  var s='';

  s += '<path d="'+pathOf(pts,1,cx,cy,r)+'" fill="'+tint+'" fill-opacity="'+(view===4?.34:.30)+'"/>';

  if(cabo){
    s += '<path d="'+pathOf(pts,0.72,cx,cy-r*0.06,r)+'" fill="'+tint+'" fill-opacity=".16" '+facet+'/>';
    s += '<path d="'+pathOf(pts,0.40,cx-r*0.16,cy-r*0.20,r)+'" fill="rgba(255,255,255,.14)" '+facet+'/>';
    if(g.variety==="Star Sapphire"){
      for(var a=0;a<3;a++){
        var ang=(a*60)*Math.PI/180, L=r*0.80;
        s += '<line x1="'+(cx-Math.cos(ang)*L).toFixed(1)+'" y1="'+(cy-Math.sin(ang)*L).toFixed(1)+
             '" x2="'+(cx+Math.cos(ang)*L).toFixed(1)+'" y2="'+(cy+Math.sin(ang)*L).toFixed(1)+
             '" stroke="rgba(255,255,255,.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';
      }
    }
  } else if(step){
    [0.84,0.66,0.48,0.30].forEach(function(k){
      s += '<path d="'+pathOf(pts,k,cx,cy,r)+'" fill="'+tint+'" fill-opacity=".07" '+facet+'/>';
    });
  } else {
    var girdle=0.79, table=0.42;
    s += '<path d="'+pathOf(pts,girdle,cx,cy,r)+'" fill="'+tint+'" fill-opacity=".10" '+facet+'/>';
    s += '<path d="'+pathOf(pts,table,cx,cy,r)+'" fill="rgba(255,255,255,.10)" '+facet+'/>';
    var i, stepA=N/16, stepB=N/8;
    for(i=0;i<N;i+=stepA){
      s += '<line x1="'+(cx+pts[i][0]*r).toFixed(1)+'" y1="'+(cy+pts[i][1]*r).toFixed(1)+
           '" x2="'+(cx+pts[i][0]*girdle*r).toFixed(1)+'" y2="'+(cy+pts[i][1]*girdle*r).toFixed(1)+
           '" stroke="rgba(255,255,255,.40)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }
    for(i=Math.round(stepA/2);i<N;i+=stepB){
      s += '<line x1="'+(cx+pts[i][0]*girdle*r).toFixed(1)+'" y1="'+(cy+pts[i][1]*girdle*r).toFixed(1)+
           '" x2="'+(cx+pts[i][0]*table*r).toFixed(1)+'" y2="'+(cy+pts[i][1]*table*r).toFixed(1)+
           '" stroke="rgba(255,255,255,.34)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }
  }
  s += '<path d="'+pathOf(pts,1,cx,cy,r)+'" '+edge+'/>';

  /* macro view: indicate silk / inclusions as short needles */
  if(view===4){
    for(var k2=0;k2<9;k2++){
      var px=cx+(rand()-.5)*r*1.1, py=cy+(rand()-.5)*r*1.1, len=r*(0.08+rand()*0.14), th=rand()*Math.PI;
      s += '<line x1="'+(px-Math.cos(th)*len).toFixed(1)+'" y1="'+(py-Math.sin(th)*len).toFixed(1)+
           '" x2="'+(px+Math.cos(th)*len).toFixed(1)+'" y2="'+(py+Math.sin(th)*len).toFixed(1)+
           '" stroke="rgba(255,255,255,.42)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
    }
  }
  /* scale reference: 10 mm bar with millimetre ticks */
  if(view===2){
    var mm=(Math.min(w,h)*0.36*0.62*2)/Math.max(g.dims[0],g.dims[1]);
    var bar=mm*10, bx=cx-bar/2, by=cy+r*1.5;
    s += '<line x1="'+bx.toFixed(1)+'" y1="'+by.toFixed(1)+'" x2="'+(bx+bar).toFixed(1)+'" y2="'+by.toFixed(1)+
         '" stroke="rgba(255,255,255,.7)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';
    for(var t2=0;t2<=10;t2++){
      var tx=bx+bar*t2/10, tl=(t2%5===0)?7:4;
      s += '<line x1="'+tx.toFixed(1)+'" y1="'+by.toFixed(1)+'" x2="'+tx.toFixed(1)+'" y2="'+(by+tl).toFixed(1)+
           '" stroke="rgba(255,255,255,.7)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>';
    }
    s += '<text x="'+cx+'" y="'+(by+24)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" fill="rgba(255,255,255,.7)">10 MM</text>';
  }

  var tf = (view===1) ? ' transform="rotate(-11 '+cx+' '+cy+') translate(0 '+(h*0.01).toFixed(1)+')"' : '';
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(viewLabel(g,view))+'" xmlns="http://www.w3.org/2000/svg">'+
         '<g'+tf+'>'+s+'</g></svg>';
}
function shiftWarm(hex){
  var n=parseInt(hex.slice(1),16), R=(n>>16)&255, G=(n>>8)&255, B=n&255;
  R=Math.min(255,Math.round(R*1.12+14)); G=Math.round(G*1.02); B=Math.max(0,Math.round(B*0.82));
  return "#"+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);
}
var VIEWS=[
  {k:"Front &middot; daylight 6500K", cap:"Face-up on the neutral grey standard ground, daylight-balanced."},
  {k:"Three-quarter", cap:"Angled three-quarter view showing the pavilion and girdle."},
  {k:"Scale reference", cap:"Shown against a millimetre scale."},
  {k:"Incandescent 2800K", cap:"The same stone under incandescent light, for colour behaviour."},
  {k:"Macro &middot; inclusions", cap:"Macro detail of the internal characteristics that support the origin call."}
];
function viewLabel(g,v){ return g.title+", "+g.carat.toFixed(2)+" ct — "+VIEWS[v].k.replace(/&middot;/g,"·")+" (schematic placeholder)"; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
</script>

      '<p class="t-lg">We do not claim certification under a scheme that does not yet exist for Myanmar coloured stones. We tell you what we know and show you the paper.</p>'+
      '<a class="link" href="#/about/mining-works">Our sourcing position</a>'+
    '</div>'+
  '</div></section>',

  /* 9 — education */
  '<section class="band band-ivory" data-prd="§29 s9 Education"><div class="wrap">'+
    '<div class="sec-head"><div class="stack"><p class="eyebrow">Journal</p><h2>Understanding gemstones</h2></div>'+
    '<a class="link" href="#/journal">Read the Journal</a></div>'+
    '<div class="grid-gems">'+
      [["What makes a Mogok ruby different","Marble-hosted geology, low iron, and the fluorescence that follows from it.","assets/img/mining-2.jpg"],
       ["Heated or unheated: what it means","Why the distinction moves the price, and how a laboratory establishes it.","assets/img/value-4.jpg"],
       ["How to read a GRS report","A line-by-line walk through an origin and treatment report.","assets/img/feature-2.jpg"]].map(function(a){
        return '<a class="artcard" href="#/journal">'+img(a[2],a[0],"3/2")+
          '<div class="card-t"><span class="card-type">Learn</span><h4 style="font-size:22px">'+a[0]+'</h4>'+
          '<p class="t-sm" style="color:var(--ink-meta)">'+a[1]+'</p></div></a>';
      }).join("")+
    '</div>'+
  '</div></section>',

  /* 10 — latest */
  '<section class="band band-ivory-deep band-tight" data-prd="§29 s10 · FR-HOME-001 auto-hide at 120 days"><div class="wrap">'+
    '<div class="sec-head" style="margin-bottom:var(--s4)"><div class="stack"><p class="eyebrow">Latest</p><h3>From SP Gems</h3></div></div>'+
    '<div class="ed">'+
      '<div class="stack g1"><p class="eyebrow" style="color:var(--ink-meta)">14 August 2026</p><h4>Eleven stones added from the June recovery</h4><p class="t-sm measure" style="color:var(--ink-secondary)">Four unheated rubies and seven spinels, all cut in Yangon, now in the catalogue.</p></div>'+
      '<div class="stack g1"><p class="eyebrow" style="color:var(--ink-meta)">2 July 2026</p><h4>An 8.14 ct unheated ruby, reported by Gübelin</h4><p class="t-sm measure" style="color:var(--ink-secondary)">The largest unheated stone from our workings in four seasons.</p></div>'+
    '</div>'+
  '</div></section>',

  /* 11 — consultation */
  '<section class="band band-dark" data-prd="§29 s11 Consultation"><div class="wrap-text" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--s3)">'+
    '<p class="eyebrow">Private consultation</p>'+
    '<h2 style="color:var(--ivory); max-width:20ch">Speak with a specialist — by video call, or in person in Yangon.</h2>'+
    '<p class="t-lg" style="max-width:56ch">Tell us what you are looking for. We will show you what we have, and say plainly when we do not have it.</p>'+
    '<a class="btn btn-primary" href="#/contact" style="margin-top:8px">Contact us</a>'+
  '</div></section>'
  ].join("");
}
</script>

<style>
#mnav.open{position:static; width:auto; height:auto; clip:auto; margin:0; overflow:visible; white-space:normal;
  display:flex; flex-direction:column; padding:0 var(--s3) var(--s3); background:var(--ivory); border-top:1px solid var(--rule)}
#mnav.open a{padding:14px 0; border-bottom:1px solid var(--rule); text-decoration:none; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-secondary)}
#mnav.open .btn{margin-top:var(--s2)}
</style>
<script>
"use strict";
/* ---------------- filter state — PRD FR-SRCH-010, URL-encoded ---------------- */
var TYPES = ["Ruby","Sapphire","Spinel","Peridot","Tourmaline","Moonstone"];
var ORIGINS = ["Mogok","Namyarseik","Other Myanmar"];
var COLOURS = [["Red","#9E2436"],["Pink","#C4657F"],["Blue","#20407E"],["Violet","#8B7BA8"],["Green","#6E8F3C"],["Colourless","#B8C4CC"]];
var SHAPES = ["Cushion","Oval","Round","Pear","Emerald","Marquise","Cabochon"];
var PAGE = 24; /* FR-CAT-007 production page size */
var F;

/* localStorage throws in sandboxed frames and private contexts — never let a
   persisted preference take the catalogue down with it (FR-SRCH-002). */
var store = (function(){
  var mem = {};
  return {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
  };
})();

function defaults(){ return {type:[],cmin:"",cmax:"",band:[],treatment:"all",availability:"available",
  origin:[],colour:[],shape:[],cert:false,exceptional:false,sort:"curated",shown:PAGE}; }

function parseQuery(qs){
  var f = defaults(); if(!qs) return f;
  qs.split("&").forEach(function(kv){
    var p = kv.split("="), k = decodeURIComponent(p[0]), v = decodeURIComponent(p[1]||"");
    if(!k) return;
    if(k==="type") f.type = v.split(",").filter(Boolean);
    else if(k==="band") f.band = v.split(",").filter(Boolean);
    else if(k==="origin") f.origin = v.split(",").filter(Boolean);
    else if(k==="colour") f.colour = v.split(",").filter(Boolean);
    else if(k==="shape") f.shape = v.split(",").filter(Boolean);
    else if(k==="carat_min") f.cmin = v;
    else if(k==="carat_max") f.cmax = v;
    else if(k==="treatment") f.treatment = v;
    else if(k==="availability") f.availability = v;
    else if(k==="cert") f.cert = v==="1";
    else if(k==="exceptional") f.exceptional = v==="1";
    else if(k==="sort") f.sort = v;
  });
  return f;
}
function buildQuery(f){
  var q = [];
  if(f.type.length) q.push("type="+f.type.join(","));
  if(f.cmin!=="") q.push("carat_min="+f.cmin);
  if(f.cmax!=="") q.push("carat_max="+f.cmax);
  if(f.band.length) q.push("band="+encodeURIComponent(f.band.join(",")));
  if(f.treatment!=="all") q.push("treatment="+f.treatment);
  if(f.availability!=="available") q.push("availability="+f.availability);
  if(f.origin.length) q.push("origin="+encodeURIComponent(f.origin.join(",")));
  if(f.colour.length) q.push("colour="+f.colour.join(","));
  if(f.shape.length) q.push("shape="+f.shape.join(","));
  if(f.cert) q.push("cert=1");
  if(f.exceptional) q.push("exceptional=1");
  if(f.sort!=="curated") q.push("sort="+f.sort);
  return q.join("&");
}
function originGroup(g){
  if(g.origin.indexOf("Mogok")>-1 || g.origin.indexOf("Pyaung Gaung")>-1) return "Mogok";
  if(g.origin.indexOf("Namyarseik")>-1) return "Namyarseik";
  return "Other Myanmar";
}
/* a record is public only once published — drafts never leak to the site */
function isLive(g){ return !g.status || g.status==="published"; }
function passAll(g,f){
  if(!isLive(g)) return false;
  if(f.type.length && f.type.indexOf(g.type)<0) return false;
  if(f.cmin!=="" && g.carat < parseFloat(f.cmin)) return false;
  if(f.cmax!=="" && g.carat > parseFloat(f.cmax)) return false;
  if(f.band.length && f.band.indexOf(g.band)<0) return false;
  if(f.treatment!=="all" && g.treatment!==f.treatment) return false;
  if(f.availability==="available" && g.availability==="sold") return false;
  if(f.origin.length && f.origin.indexOf(originGroup(g))<0) return false;
  if(f.colour.length && f.colour.indexOf(g.colourFamily)<0) return false;
  if(f.shape.length && f.shape.indexOf(g.shape)<0) return false;
  if(f.cert && !g.lab) return false;
  if(f.exceptional && !g.exceptional) return false;
  return true;
}
function results(f){
  var r = GEMS.filter(function(g){ return passAll(g,f); });
  var bi = function(g){ return BANDS.indexOf(g.band); };
  if(f.sort==="carat-asc")   r.sort(function(a,b){ return a.carat-b.carat; });
  else if(f.sort==="carat-desc") r.sort(function(a,b){ return b.carat-a.carat; });
  else if(f.sort==="price-asc")  r.sort(function(a,b){ return bi(a)-bi(b); });
  else if(f.sort==="price-desc") r.sort(function(a,b){ return bi(b)-bi(a); });
  else if(f.sort==="newest")     r.sort(function(a,b){ return GEMS.indexOf(a)-GEMS.indexOf(b); });
  else r.sort(function(a,b){ return a.rank-b.rank; });
  return r;
}
function optCount(dim,val){
  var c = {}; for(var k in F) c[k]=F[k];
  if(Object.prototype.toString.call(F[dim])==="[object Array]") c[dim]=[val]; else c[dim]=val;
  return GEMS.filter(function(g){ return passAll(g,c); }).length;
}

/* ---------------- catalogue view ---------------- */
function checkOpt(dim,val,label){
  var n = optCount(dim,val), on = F[dim].indexOf(val)>-1, zero = n===0 && !on;
  return '<label class="fopt'+(zero?" is-zero":"")+'"><input type="checkbox" data-dim="'+dim+'" value="'+esc(val)+'"'+
    (on?" checked":"")+(zero?" disabled":"")+'><span>'+esc(label||val)+'</span><span class="fcount">'+n+'</span></label>';
}
function radioOpt(dim,val,label){
  var c = {}; for(var k in F) c[k]=F[k]; c[dim]=val;
  var n = GEMS.filter(function(g){ return passAll(g,c); }).length;
  return '<label class="fopt"><input type="radio" name="'+dim+'" data-dim="'+dim+'" value="'+val+'"'+
    (F[dim]===val?" checked":"")+'><span>'+esc(label)+'</span><span class="fcount">'+n+'</span></label>';
}
function chips(){
  var c = [];
  F.type.forEach(function(v){ c.push(["type",v,v]); });
  F.band.forEach(function(v){ c.push(["band",v,v]); });
  F.origin.forEach(function(v){ c.push(["origin",v,v]); });
  F.colour.forEach(function(v){ c.push(["colour",v,v+" colour"]); });
  F.shape.forEach(function(v){ c.push(["shape",v,v]); });
  if(F.treatment!=="all") c.push(["treatment","all",F.treatment==="unheated"?"Unheated only":"Heated only"]);
  if(F.availability!=="available") c.push(["availability","available","Including archive"]);
  if(F.cert) c.push(["cert",false,"Certified only"]);
  if(F.exceptional) c.push(["exceptional",false,"Exceptional"]);
  if(F.cmin!=="" || F.cmax!=="") c.push(["carat",null,(F.cmin||"0")+"–"+(F.cmax||"∞")+" ct"]);
  if(!c.length) return "";
  return '<div class="chips" data-prd="FR-SRCH-015">'+c.map(function(x){
    return '<button class="chip" type="button" data-chip="'+x[0]+'" data-val="'+esc(String(x[1]))+'">'+esc(x[2])+'<span class="x" aria-hidden="true">×</span><span class="sr">Remove filter</span></button>';
  }).join("")+'<button class="chip" type="button" data-chip="clear">Clear all</button></div>';
}
function viewCatalogue(){
  var r = results(F), adv = store.get("spg-adv")==="1";
  var page = r.slice(0, F.shown);

  var grid = r.length ? '<div class="grid-gems" data-prd="FR-CAT-001/002 · 4:5 cards">'+page.map(card).join("")+'</div>'+
      (r.length>F.shown ? '<div class="loadmore"><button class="btn btn-secondary" type="button" id="more" data-prd="FR-CAT-007 · page size 24 in production">Load more ('+(r.length-F.shown)+' remaining)</button></div>' : "")
    : zeroState();

  return '<div class="wrap">'+
    '<div class="cat-head stack g2">'+
      '<p class="eyebrow">Gemstones</p>'+
      '<h1>The collection</h1>'+
      '<p class="t-lg measure">Every stone individually catalogued: full specification, origin, treatment status, and laboratory report where one exists. Sold stones stay in the archive.</p>'+
    '</div>'+
    '<div class="cat-layout">'+
      '<form class="filters" id="filters" data-prd="§19.1 · FR-SRCH-001 five primary filters">'+
        '<div class="fgroup"><p class="eyebrow">Gemstone type</p>'+TYPES.map(function(t){ return checkOpt("type",t); }).join("")+'</div>'+
        '<div class="fgroup"><p class="eyebrow">Carat weight</p><div class="frange">'+
          '<label class="sr" for="cmin">Minimum carat</label><input id="cmin" type="number" step="0.01" min="0" placeholder="Min" value="'+esc(F.cmin)+'">'+
          '<span aria-hidden="true" style="color:var(--ink-tertiary)">–</span>'+
          '<label class="sr" for="cmax">Maximum carat</label><input id="cmax" type="number" step="0.01" min="0" placeholder="Max" value="'+esc(F.cmax)+'">'+
        '</div></div>'+
        /* Price-band filter removed for MVP — SDD §19.4 defers all price-tier
           presentation. The band field stays in the CMS for Phase 2. */
        '<div class="fgroup" data-prd="FR-SRCH-003 · defaults to All"><p class="eyebrow">Treatment</p>'+
          radioOpt("treatment","all","All")+radioOpt("treatment","unheated","Unheated only")+radioOpt("treatment","heated","Heated")+'</div>'+
        '<div class="fgroup"><p class="eyebrow">Availability</p>'+
          radioOpt("availability","available","Available")+radioOpt("availability","all","Include archive")+'</div>'+
        '<button class="fmore" type="button" id="advBtn" aria-expanded="'+adv+'" aria-controls="advPanel" data-prd="FR-SRCH-002 · state persisted">'+
          '<span class="chev" aria-hidden="true">▾</span> More filters</button>'+
        '<div id="advPanel"'+(adv?"":' hidden')+' class="stack g3">'+
          '<div class="fgroup"><p class="eyebrow">Origin region</p>'+ORIGINS.map(function(o){ return checkOpt("origin",o); }).join("")+'</div>'+
          '<div class="fgroup"><p class="eyebrow">Colour</p><div class="swatches">'+COLOURS.map(function(c){
              return '<button class="sw" type="button" data-dim="colour" data-val="'+c[0]+'" aria-pressed="'+(F.colour.indexOf(c[0])>-1)+'" style="background:'+c[1]+'"><span class="sr">'+c[0]+'</span></button>';
            }).join("")+'</div></div>'+
          '<div class="fgroup"><p class="eyebrow">Shape</p><div class="shapes">'+SHAPES.map(function(sh){
              var pts = shapePoints(sh,48);
              return '<button class="shp" type="button" data-dim="shape" data-val="'+sh+'" aria-pressed="'+(F.shape.indexOf(sh)>-1)+'" title="'+sh+'">'+
                '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="'+pathOf(pts,1,20,20,15)+'"/></svg><span class="sr">'+sh+'</span></button>';
            }).join("")+'</div></div>'+
          '<div class="fgroup">'+
            '<label class="fopt"><input type="checkbox" data-flag="cert"'+(F.cert?" checked":"")+'><span>Certified only</span></label>'+
            '<label class="fopt"><input type="checkbox" data-flag="exceptional"'+(F.exceptional?" checked":"")+'><span>Exceptional gems</span></label>'+
          '</div>'+
        '</div>'+
      '</form>'+
      '<div>'+
        chips()+
        '<div class="cat-bar">'+
          '<span class="count" data-prd="FR-SRCH-012 · aria-live">'+r.length+' '+(r.length===1?"stone":"stones")+'</span>'+
          '<label style="display:flex; align-items:center; gap:10px"><span class="eyebrow">Sort</span>'+
          '<select class="sortsel" id="sort">'+
            [["curated","Curated"],["newest","Newest"],["carat-desc","Carat, high to low"],["carat-asc","Carat, low to high"],["price-desc","Price, high to low"],["price-asc","Price, low to high"]]
            .map(function(o){ return '<option value="'+o[0]+'"'+(F.sort===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+
          '</select></label>'+
        '</div>'+
        grid+
      '</div>'+
    '</div></div>';
}
function zeroState(){
  var widest = null;
  ["type","band","origin","colour","shape"].forEach(function(d){ if(F[d].length && !widest) widest = d; });
  var relax = "";
  if(F.cmin!=="" || F.cmax!=="") relax = '<button class="btn btn-secondary" type="button" data-relax="carat">Widen the carat range</button>';
  else if(F.treatment!=="all") relax = '<button class="btn btn-secondary" type="button" data-relax="treatment">Include all treatment states</button>';
  else if(widest) relax = '<button class="btn btn-secondary" type="button" data-relax="'+widest+'">Clear the '+widest+' filter</button>';
  else relax = '<button class="btn btn-secondary" type="button" data-relax="all">Clear all filters</button>';
  return '<div class="empty" data-prd="FR-SRCH-016 · zero results is a lead-capture opportunity">'+
    '<h3>No stone in the current catalogue matches that.</h3>'+
    '<p class="measure">Our inventory turns over constantly and a good deal of material is not yet catalogued. Tell us what you are looking for and we will come back to you when we have it — or say honestly that we do not.</p>'+
    '<div class="hero-cta" style="margin-top:0">'+relax+
    '<a class="btn btn-primary" href="#/contact">Tell us what you are seeking</a></div></div>';
}
</script>

<script>
"use strict";
/* ---------------- gemstone detail — PRD section 13 ---------------- */
function specRow(k,v,gloss){
  return '<div class="spec-row"><span class="spec-k">'+esc(k)+
    (gloss?' <button class="qmark" type="button" data-gloss="'+esc(gloss)+'" aria-label="What does '+esc(k)+' mean?">?</button>':"")+
    '</span><span class="spec-v">'+v+'</span></div>';
}
function related(g){
  var pool = GEMS.filter(function(x){ return x.stoneId!==g.stoneId && isLive(x) && x.availability!=="sold"; });
  var score = function(x){
    var s=0;
    if(x.type===g.type) s+=3;
    if(originGroup(x)===originGroup(g)) s+=2;
    if(x.treatment===g.treatment) s+=2;
    if(Math.abs(x.carat-g.carat) <= g.carat*0.4) s+=2;
    if(x.band===g.band) s+=1;
    if(x.exceptional===g.exceptional) s+=1;
    return s;
  };
  return pool.sort(function(a,b){ return score(b)-score(a); }).slice(0,4);
}
function viewGem(slug){
  /* accepts a slug, or a draft record directly for the CMS live preview (FR-CMS-004) */
  var g = (slug && typeof slug === "object") ? slug : GEMS.filter(function(x){ return x.slug===slug; })[0];
  if(!g) return '<div class="wrap stub"><h1>Stone not found</h1><a class="link" href="#/gemstones">Back to the collection</a></div>';
  var sold = g.availability==="sold";
  var availCls = sold ? "avail avail-sold" : (g.availability==="reserved" ? "avail avail-res" : "avail");
  var availTxt = sold ? "Sold" : (g.availability==="reserved" ? "Reserved" : "Available");

  var badges = '<span class="badge badge-strong">'+(g.treatment==="unheated"?"Unheated":"Heated")+'</span>'+
    (g.lab?'<span class="badge">'+g.lab+' certified</span>':"")+
    (g.cutByUs?'<span class="badge">Cut in Yangon</span>':"")+
    (g.exceptional?'<span class="badge badge-exc">Exceptional</span>':"")+
    (sold?'<span class="badge badge-sold">Sold</span>':"");

  /* right rail */
  var rail = '<div class="rail">'+
    '<div class="ident" data-prd="§13.2.2 Identity">'+
      '<h1>'+esc(g.title)+'</h1>'+
      '<p class="ident-sub">'+g.carat.toFixed(2)+' ct &middot; '+esc(g.shape)+' &middot; '+esc(g.origin)+'</p>'+
      '<p class="ident-id mono">'+esc(g.stoneId)+'</p>'+
      '<div class="ident-badges">'+badges+'</div>'+
    '</div>'+
    '<div class="spec" data-prd="§13.2.3 · FR-UI-010 tabular figures">'+
      specRow("Carat", g.carat.toFixed(2)+" ct", "Carat")+
      specRow("Dimensions", g.dims[0].toFixed(2)+" × "+g.dims[1].toFixed(2)+" × "+g.dims[2].toFixed(2)+" mm", "Dimensions")+
      specRow("Shape", esc(g.shape)+(g.cut?" · "+esc(g.cut)+" cut":""))+
      specRow("Colour", esc(g.colour)+(g.tradeTerm?'<br><span class="t-sm" style="color:var(--ink-meta)">'+esc(g.tradeTerm)+'</span>':""), "Colour")+
      specRow("Clarity", esc(g.clarity), "Clarity")+
      specRow("Origin", esc(g.origin), "Origin")+
      specRow("Treatment", g.treatment==="unheated"?"No indication of heating":"Heated", "Treatment")+
      specRow("Certification", g.lab ? esc(g.lab)+' <span class="mono t-sm" style="color:var(--ink-meta)">'+esc(g.certNo)+'</span>' : "None at present", "Certification")+
    '</div>'+
    '<div class="price-blk" data-prd="SDD §19.4 quotation-only">'+
      '<p class="price-v">'+esc(sold ? "Sold" : priceLabel(g))+'</p>'+
      '<p class="'+availCls+'">'+availTxt+'</p>'+
      (!sold ? '<p class="t-sm" style="color:var(--ink-meta)">Shown for reference. Stones are seen in person or by appointment, never sold through this site.</p>' : "")+
    '</div>';

  if(sold){
    rail += '<div class="cta-blk" data-prd="FR-GEM-064 sold state">'+
      '<p class="measure">This stone was sold in 2023. Its record stays here permanently.</p>'+
      '<div class="cta-pair">'+
        '<a class="btn btn-primary btn-full" href="#/contact">Tell us what you are seeking</a>'+
      '</div>'+
    '</div>';
  } else {
    rail += '<div class="cta-blk" data-prd="SDD §19.4 · viewing only, no purchase path">'+
      '<div class="cta-pair">'+
        '<button class="btn btn-primary btn-full" type="button" data-quote="'+g.slug+'">Request a quotation</button>'+
        '<button class="btn btn-secondary btn-full" type="button" data-appointment="'+g.slug+'">Schedule an appointment</button>'+
      '</div>'+
      '<div class="msg-row">'+
        '<a href="#" data-toast="Opens WhatsApp with '+esc(g.stoneId)+' and the page link already in the message — FR-CAT-021.">WhatsApp</a>'+
        '<a href="#" data-toast="Opens Viber with '+esc(g.stoneId)+' and the page link already in the message — FR-CAT-021.">Viber</a>'+
        '<a href="#" data-toast="Opens your mail client with '+esc(g.stoneId)+' in the subject line — FR-CAT-021.">Email</a>'+
      '</div>'+
      '<p class="reassure">Typically answered within one business day, Yangon time.</p>'+
    '</div>';
  }
  rail += '</div>';

  /* media column */
  var media = '<div class="det-media" data-prd="§13.2.1 · FR-GEM-050 LCP">'+
    '<div class="det-hero plate" id="detHero" role="button" tabindex="0" aria-label="Open '+esc(g.title)+' in the fullscreen viewer">'+
      gemSVG(g,0,900,1000)+'<span class="plate-note">'+VIEWS[0].k+'</span><span class="plate-mark">SP Gems &middot; click to enlarge</span></div>'+
    '<div class="thumbs" role="tablist" aria-label="Images">'+
      VIEWS.map(function(v,i){
        return '<button class="thumb" type="button" data-view="'+i+'" aria-current="'+(i===0)+'" title="'+v.k.replace(/&middot;/g,"·")+'">'+
          gemSVG(g,i,200,200)+'</button>';
      }).join("")+
      (g.video?'<button class="thumb" type="button" data-toast="Video placeholder — 8–15 s, stone rotating under moving light, no music (FR-CAT-045)." title="Video"><div class="ph" style="aspect-ratio:1"><span>Video</span></div></button>':"")+
    '</div>'+
  '</div>';

  /* below the fold */
  var below = '<div class="band band-ivory-deep"><div class="wrap"><div class="ed" data-prd="§13.2.6 Provenance">'+
      '<div class="stack g3"><p class="eyebrow">Provenance</p>'+
        (g.ownMine?'<h3>Recovered from our own workings in Mogok.</h3>':'<h3>Where this stone came from.</h3>')+
        '<p class="t-lg measure">'+esc(g.provenance)+'</p>'+
        (g.cutByUs?'<p class="measure" data-prd="§13.2.8 Cut">Cut and polished in our Yangon workshop. <a class="link-plain" href="#/about/mining-works">Our craft</a></p>':"")+
      '</div><div>'+img(g.ownMine?"assets/img/mining-4.jpg":"assets/img/mining-6.jpg", g.ownMine?"Our workings at Mogok":"Sorting and cutting","4/3")+'</div>'+
    '</div></div></div>';

  /* treatment disclosure — always rendered, FR-GEM-052 */
  below += '<div class="band band-ivory band-tight"><div class="wrap-text">'+
    '<div class="treat" data-prd="FR-GEM-052 · always rendered, treated or not">'+
      '<div class="treat-hd"><p class="eyebrow">Treatment</p>'+
        (g.treatVerified?'<span class="verified">Verified by '+esc(g.lab)+'</span>':'<span class="t-sm" style="color:var(--ink-meta)">House assessment</span>')+'</div>'+
      '<p class="t-lg measure">'+(g.treatment==="unheated"
        ? "This "+esc(g.type.toLowerCase())+" is unheated. It has undergone no thermal or chemical enhancement."
        : "This "+esc(g.type.toLowerCase())+" has been heated. Heating is conventional practice for this material and is always disclosed. No filling or residue is present.")+'</p>'+
      (g.treatVerified?'':'<p class="t-sm measure" style="color:var(--ink-secondary)">This finding is our own assessment, not a laboratory determination. We can arrange an independent report before purchase.</p>')+
      '<a class="link" href="#/journal">Heated versus unheated — read more</a>'+
    '</div></div></div>';

  /* colour analysis */
  if(g.colourNotes){
    below += '<div class="band band-ivory band-tight"><div class="wrap"><div class="ed-3" data-prd="§13.2.7 Colour">'+
      '<div class="stack g3"><p class="eyebrow">Colour</p><h3>'+esc(g.colour)+'</h3>'+
        '<p class="t-lg measure">'+esc(g.colourNotes)+'</p>'+
        (g.tradeTerm?'<p class="t-sm measure" style="color:var(--ink-secondary)">Colour graded <em>'+esc(g.tradeTerm.split(" (")[0])+'</em> by '+esc(g.lab)+', report '+esc(g.certNo)+'. We use trade colour terms only where a laboratory has issued them.</p>':"")+
      '</div>'+
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--s3)">'+
        '<figure style="margin:0"><div class="plate" style="aspect-ratio:1">'+gemSVG(g,0,400,400)+'<span class="plate-note">Daylight 6500K</span></div></figure>'+
        '<figure style="margin:0"><div class="plate" style="aspect-ratio:1">'+gemSVG(g,3,400,400)+'<span class="plate-note">Incandescent 2800K</span></div></figure>'+
      '</div></div></div></div>';
  }

  /* certification */
  below += '<div class="band band-ivory-deep band-tight"><div class="wrap-text"><div class="stack g4" data-prd="§13.2.10 · §13.6 gated documents">'+
    '<p class="eyebrow">Certification</p>';
  if(g.lab){
    below += '<div class="cert-card">'+
      '<div class="cert-thumb"><div class="cert-wm">'+esc(g.lab)+' &nbsp; SP GEMS &nbsp; SPECIMEN</div>'+
        '<span class="mono t-cap" style="color:var(--ink-meta); text-align:center; padding:12px">Watermarked<br>thumbnail<br>max 800 px</span></div>'+
      '<div class="stack g2">'+
        '<h4>'+esc(g.lab)+' report '+esc(g.certNo)+'</h4>'+
        '<p class="t-sm" style="color:var(--ink-secondary)">Issued '+esc(g.certDate)+'. States species, origin and treatment.</p>'+
        '<p class="measure">The full report is released on enquiry, or immediately to a verified trade account. The report number above can be checked directly with the laboratory.</p>'+
        '<div class="msg-row" style="gap:var(--s3)">'+
          '<a class="btn btn-secondary" href="#/contact">Request the full certificate</a>'+
          '<a href="#" data-toast="Opens the laboratory&rsquo;s public report-verification tool in a new tab.">Verify with '+esc(g.lab)+'</a>'+
        '</div>'+
      '</div></div>';
  } else {
    below += '<p class="t-lg measure" data-prd="FR-GEM-058 · state it plainly">This stone is not currently accompanied by a laboratory report. Certification can be arranged prior to purchase, at our cost for stones above US$10,000.</p>';
  }
  below += '</div></div></div>';

  /* gallery */
  below += '<div class="band band-ivory"><div class="wrap"><div class="stack g4">'+
    '<div class="sec-head" style="margin-bottom:0"><div class="stack"><p class="eyebrow">Photography</p><h3>The full set</h3></div>'+
    '<span class="t-sm" style="color:var(--ink-meta)">'+VIEWS.length+' images · min. 3 per stone (FR-CAT-040)</span></div>'+
    '<div class="gal">'+VIEWS.map(function(v,i){
      return '<figure><div class="plate" style="aspect-ratio:1">'+gemSVG(g,i,400,400)+'<span class="plate-note">'+v.k+'</span></div>'+
        '<figcaption>'+v.cap+'</figcaption></figure>';
    }).join("")+'</div></div></div></div>';

  /* consultation band */
  below += '<div class="band band-dark band-tight" data-prd="§13.2.13"><div class="wrap-text" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--s3)">'+
    '<h3 style="color:var(--ivory); max-width:24ch">Would you like to see this stone in person, or by video call?</h3>'+
    '<a class="btn btn-primary" href="#/contact">Arrange a viewing</a></div></div>';

  /* related */
  below += '<div class="band band-ivory"><div class="wrap"><div class="sec-head"><div class="stack">'+
    '<p class="eyebrow">Also available</p><h3>Related stones</h3></div>'+
    '<a class="link" href="#/gemstones">View all</a></div>'+
    '<div class="grid-gems" data-prd="FR-GEM-070 scoring">'+related(g).map(card).join("")+'</div></div></div>';

  return '<div class="wrap"><div class="det">'+media+rail+'</div></div>'+below;
}

/* ---------------- stub pages for sections outside this demo ---------------- */
function viewStub(title, ref, body){
  return '<div class="wrap stub">'+
    '<p class="eyebrow">'+esc(ref)+'</p>'+
    '<h1>'+esc(title)+'</h1>'+

    '<p class="measure" style="color:var(--ink-meta)">This screen is specified in the PRD but is not built in this demonstration. The three screens carried through to full fidelity are the homepage, the gemstone catalogue, and the gemstone detail page — the pages that carry the commercial argument.</p>'+
    '<div class="hero-cta" style="margin-top:var(--s2)"><a class="btn btn-primary" href="#/gemstones">Go to the catalogue</a>'+

}
var STUBS = {
  jewellery:["Jewellery","§14 Jewellery Experience","Rings, necklaces, earrings and bracelets, plus the collections and the bespoke commission flow specified in §14 and §15."],
  mogok:["Mogok","§18 Provenance &amp; Mogok","The origin story, the mines, cutting and craftsmanship, the responsible-sourcing position, and the provenance scrollytelling experience."],
  journal:["Journal","§17 Content &amp; Education","The twelve-article launch set, the education hub at /journal/learn, and the stories and news streams that replace three anaemic news sections."],
  about:["About","§17.4 &amp; §32A","Our story, the family and team, how buying works, and the international purchasing and compliance page."],
  contact:["Contact","§16 Consultation System","Contact routing and the consultation booking flow, including video calls with correct Yangon time-zone handling (§16.5)."]
};

<script>
"use strict";
/* ---------------- router ---------------- */
function route(keepScroll){
  var h = location.hash.replace(/^#/,"") || "/";
  var qi = h.indexOf("?"), path = qi<0?h:h.slice(0,qi), qs = qi<0?"":h.slice(qi+1);
  var parts = path.split("/").filter(Boolean);
  var demoKey = "home";

  if(parts[0]==="admin"){
    app.innerHTML = renderAdmin(parts);
    $$("[data-demo]").forEach(function(a){ a.setAttribute("aria-current", a.getAttribute("data-demo")==="admin"); });
    if(!keepScroll) window.scrollTo(0,0);
    return;
  }
  document.body.classList.remove("admin");

  var pageKey = parts.join("/");
  if(!parts.length){ app.innerHTML = viewHome(); }
  else if(PAGES[pageKey]){ app.innerHTML = PAGES[pageKey][0](); demoKey = PAGES[pageKey][1]; }
  else if(parts[0]==="gemstones" && parts[1]){ app.innerHTML = viewGem(parts[1]); demoKey="gem"; }
  else if(parts[0]==="gemstones"){ F = parseQuery(qs); app.innerHTML = viewCatalogue(); demoKey="gemstones"; }
  else if(STUBS[parts[0]]){ var s=STUBS[parts[0]]; app.innerHTML = viewStub(s[0],s[1],s[2]); demoKey=parts[0]; }
  else { app.innerHTML = viewStub("Page not found","404","That address is not part of this demonstration build."); }

  var navk = parts.length ? pageKey : "home";
  if(parts[0]==="gemstones") navk="gemstones";
  $$("[data-nav]").forEach(function(a){
    if(a.getAttribute("data-nav")===navk) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  $$("[data-demo]").forEach(function(a){ a.setAttribute("aria-current", a.getAttribute("data-demo")===demoKey); });
  closeDrops(); setMob(false);
  armReveal();
  if(!keepScroll) window.scrollTo(0,0);
}
window.addEventListener("hashchange", function(){ route(); });

/* ---------------- filters ---------------- */
function applyFilters(){
  var q = buildQuery(F);
  history.replaceState(null,"", "#/gemstones"+(q?"?"+q:""));
  var y = window.scrollY;
  app.innerHTML = viewCatalogue();
  window.scrollTo(0,y);
  var n = results(F).length;
  live.textContent = n+" "+(n===1?"stone":"stones")+" match the current filters.";
}
function toggleArr(dim,val){
  var i = F[dim].indexOf(val);
  if(i>-1) F[dim].splice(i,1); else F[dim].push(val);
  F.shown = PAGE;
}
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.closest && t.closest("#filters")){
    var dim = t.getAttribute("data-dim"), flag = t.getAttribute("data-flag");
    if(dim && t.type==="checkbox"){ toggleArr(dim, t.value); applyFilters(); }
    else if(dim && t.type==="radio"){ F[dim] = t.value; F.shown = PAGE; applyFilters(); }
    else if(flag){ F[flag] = t.checked; F.shown = PAGE; applyFilters(); }
    else if(t.id==="cmin" || t.id==="cmax"){ F[t.id==="cmin"?"cmin":"cmax"] = t.value; F.shown = PAGE; applyFilters(); }
  }
  if(t.id==="sort"){ F.sort = t.value; applyFilters(); }
  if(t.id==="prdToggle"){ document.body.classList.toggle("prd", t.checked); }
});

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-enquire],[data-toast],[data-gloss],[data-chip],[data-relax],[data-view],[data-dim][data-val],#more,#advBtn,#detHero,.burger,[data-close]") : null;
  if(!t) return;

  if(t.hasAttribute("data-enquire")){ e.preventDefault(); openEnquiry(t.getAttribute("data-enquire")); return; }
  if(t.hasAttribute("data-toast")){ e.preventDefault(); toast(t.getAttribute("data-toast")); return; }
  if(t.hasAttribute("data-gloss")){ e.preventDefault(); popover(t, t.getAttribute("data-gloss")); return; }
  if(t.hasAttribute("data-close")){ closeModal(); return; }

  /* full-screen mobile menu — SDD §19.8 */
  if(t.classList.contains("burger")){ setMob(true); return; }
  if(t.id==="advBtn"){
    var p = $("#advPanel"), willOpen = p.hasAttribute("hidden");
    if(willOpen) p.removeAttribute("hidden"); else p.setAttribute("hidden","");
    t.setAttribute("aria-expanded", willOpen);
    store.set("spg-adv", willOpen?"1":"0");
    return;
  }
  if(t.id==="more"){ F.shown += PAGE; applyFilters(); return; }

  if(t.hasAttribute("data-chip")){
    var c = t.getAttribute("data-chip"), v = t.getAttribute("data-val");
    if(c==="clear") F = defaults();
    else if(c==="carat"){ F.cmin=""; F.cmax=""; }
    else if(c==="treatment") F.treatment="all";
    else if(c==="availability") F.availability="available";
    else if(c==="cert") F.cert=false;
    else if(c==="exceptional") F.exceptional=false;
    else toggleArr(c, v);
    F.shown = PAGE; applyFilters(); return;
  }
  if(t.hasAttribute("data-relax")){
    var r = t.getAttribute("data-relax");
    if(r==="all") F = defaults();
    else if(r==="carat"){ F.cmin=""; F.cmax=""; }
    else if(r==="treatment") F.treatment="all";
    else F[r] = [];
    F.shown = PAGE; applyFilters(); return;
  }
  if(t.classList.contains("sw") || t.classList.contains("shp")){
    toggleArr(t.getAttribute("data-dim"), t.getAttribute("data-val")); applyFilters(); return;
  }
  if(t.hasAttribute("data-view")){
    var i = +t.getAttribute("data-view"), g = currentGem();
    if(!g) return;
    var hero = $("#detHero");
    hero.innerHTML = gemSVG(g,i,900,1000)+'<span class="plate-note">'+VIEWS[i].k+'</span><span class="plate-mark">SP Gems &middot; click to enlarge</span>';
    $$(".thumb").forEach(function(b){ b.setAttribute("aria-current", b.getAttribute("data-view")===String(i)); });
    return;
  }
  if(t.id==="detHero"){ openViewer(currentGem(), currentView()); return; }
});
document.addEventListener("keydown", function(e){
  if((e.key==="Enter"||e.key===" ") && e.target.id==="detHero"){ e.preventDefault(); openViewer(currentGem(), currentView()); }
});
function currentGem(){
  var m = location.hash.match(/#\/gemstones\/([^?]+)/);
  return m ? GEMS.filter(function(x){ return x.slug===m[1]; })[0] : null;
}
function currentView(){
  var a = $$(".thumb").filter(function(b){ return b.getAttribute("aria-current")==="true"; })[0];
  return a ? +a.getAttribute("data-view") : 0;
}

/* ---------------- toast + glossary popover ---------------- */
var toastT;
function toast(msg){
  var old = $(".toast"); if(old) old.remove();
  var d = document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent = msg;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(function(){ d.remove(); }, 5200);
}
function popover(btn, key){
  var old = $(".pop"); if(old){ old.remove(); if(old.dataset.k===key) return; }
  var d = document.createElement("div"); d.className="pop"; d.dataset.k = key; d.setAttribute("role","dialog"); d.setAttribute("aria-label", key);
  d.innerHTML = '<button class="pop-close" type="button" aria-label="Close">×</button><strong style="display:block; margin-bottom:8px; color:#fff">'+esc(key)+'</strong>'+esc(GLOSS[key]||"")+
    ' <a href="#/journal">Read more</a>';
  document.body.appendChild(d);
  var r = btn.getBoundingClientRect();
  var left = Math.min(r.left + window.scrollX, window.innerWidth - d.offsetWidth - 16);
  d.style.left = Math.max(12,left)+"px"; d.style.top = (r.bottom + window.scrollY + 8)+"px";
  d.querySelector(".pop-close").focus();
  d.querySelector(".pop-close").addEventListener("click", function(){ d.remove(); btn.focus(); });
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ var p=$(".pop"); if(p) p.remove(); } });
document.addEventListener("click", function(e){
  var p = $(".pop");
  if(p && !p.contains(e.target) && !(e.target.closest && e.target.closest("[data-gloss]"))) p.remove();
});

/* ---------------- enquiry modal — PRD FR-GEM-051, §21.2 field discipline ---------------- */
var lastFocus = null;
var COUNTRIES = ["Myanmar","Thailand","Singapore","Hong Kong SAR","China","Japan","India","United Arab Emirates",
  "United Kingdom","Switzerland","France","Germany","Italy","United States","Canada","Australia","Other"];

function openEnquiry(key){
  var g = GEMS.filter(function(x){ return x.slug===key; })[0];
  var mode = g ? "stone" : key;
  var heading = g ? "Request a quotation"
    : mode==="sourcing" ? "Tell us what you are seeking" : "Request a quotation";
  var intro = g ? "We will reply with a written quotation, the full laboratory report, and full-resolution images."
    : mode==="sourcing" ? "Describe the stone you are after. If we do not have it, we will say so."
    : "Tell us what you are looking for and we will come back with a written quotation.";

  var ctx = g ? '<div class="ctx">'+plate(g,0)+'<div class="stack g1">'+
      '<strong style="font-family:var(--f-display); font-size:20px; font-weight:400">'+esc(g.title)+'</strong>'+
      '<span class="t-sm num" style="color:var(--ink-secondary)">'+g.carat.toFixed(2)+' ct &middot; '+esc(g.shape)+' &middot; '+esc(g.origin)+'</span>'+
      '<span class="mono t-cap" style="color:var(--ink-meta)">'+esc(g.stoneId)+'</span>'+
    '</div></div>' : "";

  $("#modalBody").innerHTML =
    '<button class="modal-x" type="button" data-close="modal" aria-label="Close">×</button>'+
    '<form class="stack g4" id="enqForm" novalidate>'+
      '<div class="stack g2"><p class="eyebrow">Enquiry</p><h3 id="mtitle">'+heading+'</h3>'+
      '<p class="t-sm" style="color:var(--ink-secondary)">'+intro+'</p></div>'+
      ctx+
      '<div class="stack g3">'+
        '<div class="fld"><label for="f-name">Your name *</label><input id="f-name" required autocomplete="name"><span class="err">Please tell us your name.</span></div>'+
        '<div class="two">'+
          '<div class="fld"><label for="f-email">Email *</label><input id="f-email" type="email" required autocomplete="email"><span class="err">Please enter a valid email address.</span></div>'+
          '<div class="fld"><label for="f-phone">Phone or WhatsApp</label><input id="f-phone" type="tel" autocomplete="tel"></div>'+
        '</div>'+
        '<div class="fld" data-prd="§21.4 · country drives compliance routing"><label for="f-country">Country or territory *</label>'+
          '<select id="f-country" required><option value="">Select…</option>'+COUNTRIES.map(function(c){ return '<option>'+c+'</option>'; }).join("")+'</select>'+
          '<span class="hint">We ask because export documentation and compliance review differ by destination.</span>'+
          '<span class="err">Please select a country or territory.</span></div>'+
        '<div class="fld"><label for="f-int">What would you like?</label><select id="f-int">'+
          (g?'<option>Price and availability</option><option>A copy of the laboratory report</option><option>Full-resolution images or video</option><option>A private viewing</option><option>Similar stones</option>'
            :'<option>A consultation</option><option>Help sourcing a specific stone</option><option>A bespoke commission</option><option>Trade access</option><option>Something else</option>')+
        '</select></div>'+
        '<div class="fld"><label for="f-msg">Message</label><textarea id="f-msg" placeholder="'+
          (g?"Anything you would like us to know about what you are looking for.":"Carat, colour, treatment, budget — whatever you already know.")+'"></textarea></div>'+
        '<label class="fopt" style="align-items:flex-start; gap:12px"><input type="checkbox" id="f-consent" style="margin-top:5px">'+
          '<span class="t-sm">Keep me informed when comparable stones become available.</span></label>'+
      '</div>'+
      '<div class="stack g2">'+
        '<button class="btn btn-primary btn-full" type="submit">Send enquiry</button>'+
        '<p class="t-cap" style="color:var(--ink-meta)">Typically answered within one business day, Yangon time. Demonstration build — nothing is transmitted.</p>'+
      '</div>'+
    '</form>';

  lastFocus = document.activeElement;
  $("#modal").setAttribute("data-open","true");
  document.body.style.overflow = "hidden";
  $("#f-name").focus();

  var form = $("#enqForm");
  ["f-name","f-email","f-country"].forEach(function(id){
    var el = $("#"+id);
    el.addEventListener("blur", function(){ validate(el); }); /* on blur, never on keystroke */
  });
  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    var ok = ["f-name","f-email","f-country"].map(function(id){ return validate($("#"+id)); }).every(Boolean);
    if(!ok){ var bad = $(".fld.is-err input, .fld.is-err select"); if(bad) bad.focus(); return; }
    var ref = "ENQ-2026-"+String(1000+Math.floor(Math.random()*8999));
    $("#modalBody").innerHTML =
      '<button class="modal-x" type="button" data-close="modal" aria-label="Close">×</button>'+
      '<div class="stack g4"><div class="stack g2"><p class="eyebrow">Enquiry received</p>'+
      '<h3 id="mtitle">Thank you — we have your enquiry.</h3></div>'+
      '<p class="measure">A specialist will reply within one business day, Yangon time. '+
      (g?'Your reply will include the price, the full '+(g.lab?esc(g.lab)+' report':'specification')+', and full-resolution images of '+esc(g.stoneId)+'.':'')+'</p>'+
      '<div class="ctx"><div class="stack g1"><span class="eyebrow">Your reference</span>'+
      '<strong class="mono" style="font-size:18px">'+ref+'</strong></div></div>'+
      '<p class="t-cap" style="color:var(--ink-meta)">Demonstration build. No message was sent and no data was stored. In production this creates a lead record, routes it by country and value per §21.4, and notifies the sales desk.</p>'+
      '<button class="btn btn-secondary btn-full" type="button" data-close="modal">Close</button></div>';
    $(".modal-x").focus();
  });
}
function validate(el){
  var f = el.closest(".fld"), ok = true;
  if(el.id==="f-email") ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value.trim());
  else ok = el.value.trim().length > 0;
  f.classList.toggle("is-err", !ok);
  el.setAttribute("aria-invalid", !ok);
  return ok;
}
function closeModal(){
  $("#modal").setAttribute("data-open","false");
  document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}
function trap(container, e){
  if(e.key!=="Tab") return;
  var f = $$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', container)
    .filter(function(x){ return x.offsetParent !== null; });
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}
document.addEventListener("keydown", function(e){
  if($("#modal").getAttribute("data-open")==="true"){
    if(e.key==="Escape") closeModal(); else trap($("#modalBody"), e);
  }
});
</script>

<script>
"use strict";
/* ---------------- fullscreen viewer — PRD section 13.8 ---------------- */
var V = { gem:null, idx:0, zoom:1, x:0, y:0, drag:false, sx:0, sy:0, last:null };
var vStage = $("#vStage");

function openViewer(g, idx){
  if(!g) return;
  V.gem = g; V.idx = idx||0; V.zoom = 1; V.x = 0; V.y = 0;
  V.last = document.activeElement;
  $("#viewer").setAttribute("data-open","true");
  document.body.style.overflow = "hidden";
  paintViewer();
  $("#vClose").focus();
}
function closeViewer(){
  $("#viewer").setAttribute("data-open","false");
  document.body.style.overflow = "";
  if(V.last) V.last.focus();
}
function paintViewer(){
  var g = V.gem;
  /* FR-VIEW-006: open immediately with the already-rendered asset, never block */
  vStage.innerHTML = gemSVG(g, V.idx, 900, 900);
  var svg = vStage.querySelector("svg");
  svg.style.maxHeight = "100%";
  svg.style.width = "min(92vw, 78vh)";
  applyTransform();
  $("#vTitle").textContent = g.stoneId + " — " + g.title + ", " + g.carat.toFixed(2) + " ct";
  $("#vCount").textContent = (V.idx+1) + " / " + VIEWS.length + "  ·  " + VIEWS[V.idx].k.replace(/&middot;/g,"·");
}
function applyTransform(){
  var svg = vStage.querySelector("svg");
  if(!svg) return;
  svg.style.transform = "translate("+V.x+"px,"+V.y+"px) scale("+V.zoom+")";
  $("#vZoom").textContent = Math.round(V.zoom*100) + "%";
}
function setZoom(z){
  V.zoom = Math.max(1, Math.min(4, z));
  if(V.zoom === 1){ V.x = 0; V.y = 0; }
  applyTransform();
}
function step(d){
  V.idx = (V.idx + d + VIEWS.length) % VIEWS.length;
  V.zoom = 1; V.x = 0; V.y = 0;
  paintViewer();
}
$("#vClose").addEventListener("click", closeViewer);
$("#vIn").addEventListener("click", function(){ setZoom(V.zoom + 0.5); });
$("#vOut").addEventListener("click", function(){ setZoom(V.zoom - 0.5); });
$("#vPrev").addEventListener("click", function(){ step(-1); });
$("#vNext").addEventListener("click", function(){ step(1); });

vStage.addEventListener("wheel", function(e){
  if($("#viewer").getAttribute("data-open")!=="true") return;
  e.preventDefault();
  setZoom(V.zoom + (e.deltaY < 0 ? 0.3 : -0.3));
}, {passive:false});

vStage.addEventListener("dblclick", function(){ setZoom(V.zoom > 1 ? 1 : 2.5); });

vStage.addEventListener("pointerdown", function(e){
  if(V.zoom <= 1) return;
  V.drag = true; V.sx = e.clientX - V.x; V.sy = e.clientY - V.y;
  vStage.classList.add("is-drag");
  vStage.setPointerCapture(e.pointerId);
});
vStage.addEventListener("pointermove", function(e){
  if(!V.drag) return;
  V.x = e.clientX - V.sx; V.y = e.clientY - V.sy; applyTransform();
});
["pointerup","pointercancel"].forEach(function(ev){
  vStage.addEventListener(ev, function(){ V.drag = false; vStage.classList.remove("is-drag"); });
});

/* pinch to zoom */
var pinch = null;
vStage.addEventListener("touchstart", function(e){
  if(e.touches.length === 2){
    pinch = { d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), z: V.zoom };
  }
}, {passive:true});
vStage.addEventListener("touchmove", function(e){
  if(pinch && e.touches.length === 2){
    e.preventDefault();
    var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    setZoom(pinch.z * (d / pinch.d));
  }
}, {passive:false});
vStage.addEventListener("touchend", function(){ pinch = null; });

document.addEventListener("keydown", function(e){
  if($("#viewer").getAttribute("data-open")!=="true") return;
  if(e.key === "Escape"){ closeViewer(); return; }
  if(e.key === "Tab"){ trap($("#viewer"), e); return; }
  /* FR-VIEW-003/004: arrows pan when zoomed, navigate when not */
  var P = 60;
  if(e.key === "ArrowLeft"){ e.preventDefault(); if(V.zoom>1){ V.x += P; applyTransform(); } else step(-1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); if(V.zoom>1){ V.x -= P; applyTransform(); } else step(1); }
  else if(e.key === "ArrowUp"){ if(V.zoom>1){ e.preventDefault(); V.y += P; applyTransform(); } }
  else if(e.key === "ArrowDown"){ if(V.zoom>1){ e.preventDefault(); V.y -= P; applyTransform(); } }
  else if(e.key === "+" || e.key === "="){ setZoom(V.zoom + 0.5); }
  else if(e.key === "-"){ setZoom(V.zoom - 0.5); }
});

/* init runs at the very end of the document, once the admin layer is defined too */

/* --- helpers --- */
function can(k){ return !!ROLES[A.role].can[k]; }
function ro(){ return !ROLES[A.role].can.write; }
function flagged(q){ return COMPLIANCE_LIST.indexOf(q.country) > -1; }
function ageLabel(h){
  if(h < 24) return h + "h";
  return Math.floor(h/24) + "d";
}
function ageClass(q){ /* FR-INQ-033 — amber at 2 business days, red at 4 */
  if(q.status!=="new" && q.status!=="contacted") return "";
  if(q.ageHrs >= 96) return "bad";
  if(q.ageHrs >= 48) return "warn";
  return "ok";
}
function openInq(){ return INQ.filter(function(q){ return !q.spam && ["new","contacted","in-discussion","quoted"].indexOf(q.status)>-1; }); }
function staleStones(){ return GEMS.filter(function(g){ return g.status==="published" && g.availability!=="sold" && g.verifiedAgo>30; }); }
function thinStones(){ return GEMS.filter(function(g){ return g.status==="published" && (g.imageCount<3 || g.altMissing); }); }
function fmtAgo(d){ return d===0?"today":d===1?"yesterday":d+" days ago"; }

function thumb(g){ return '<span class="a-thumb">'+gemSVG(g,0,120,150)+'</span>'; }
function statusChip(g){
  if(g.status==="draft") return '<span class="a-chip">Draft</span>';
  if(g.availability==="sold") return '<span class="a-chip flat">Sold</span>';
  if(g.availability==="reserved") return '<span class="a-chip warn">Reserved</span>';
  return '<span class="a-chip ok">Published</span>';
}

function adminDashboard(){

  var overdue = openInq().filter(function(q){ return q.ageHrs>=48; });

  var tiles = '<div class="a-tiles">'+

    '<div class="a-tile '+(overdue.length?"bad":"ok")+'"><span class="k">Open inquiries</span><span class="v">'+openInq().length+'</span><span class="s">'+overdue.length+' past 2 business days</span></div>'+

    '<div class="a-tile '+(thin.length?"warn":"ok")+'"><span class="k">Incomplete records</span><span class="v">'+thin.length+'</span><span class="s">under 3 images or missing alt text</span></div>'+
  '</div>';

  /* FR-CMS-033 content freshness */
  var fresh = '<div class="a-panel"><div class="a-panel-h"><h2>Content freshness</h2>'+
    '<span class="a-sub">FR-CMS-033 — the guard against another 2017</span></div><div class="a-panel-b">'+
    '<div class="a-cols">'+
      '<div class="a-tile ok" style="border:0; padding:0"><span class="k">Most recent published stone</span><span class="v" style="font-size:20px">'+fmtAgo(freshStone)+'</span></div>'+
