      '<div class="a-tile ok" style="border:0; padding:0"><span class="k">Homepage news section</span><span class="v" style="font-size:20px">Visible</span><span class="s">auto-hides at 120 days</span></div>'+
    '</div></div></div>';

  var staleRows = stale.length ? stale.map(function(g){
    return '<tr><td><div class="a-name">'+thumb(g)+'<div><b>'+esc(g.title)+'</b><br><span class="id">'+g.stoneId+'</span></div></div></td>'+
      '<td class="num">'+g.carat.toFixed(2)+'</td>'+
      '<td><span class="a-chip '+(g.verifiedAgo>90?"bad":"warn")+'">'+g.verifiedAgo+' days</span></td>'+
      '<td class="a-rowact"><button class="a-btn a-btn-sm" type="button" data-verify="'+g.stoneId+'"'+(ro()?" disabled":"")+'>Still available</button>'+
      '<button class="a-btn a-btn-sm" type="button" data-aedit="'+g.slug+'">Edit</button></td></tr>';
  }).join("") : '<tr><td colspan="4" class="a-empty">Every published stone has been confirmed within 30 days.</td></tr>';

  var thinRows = thin.length ? thin.map(function(g){
    var issues = [];
    if(g.imageCount<3) issues.push('<span class="a-chip warn">'+g.imageCount+' of 3 images</span>');
    if(g.altMissing) issues.push('<span class="a-chip bad">'+g.altMissing+' missing alt text</span>');
    return '<tr><td><div class="a-name">'+thumb(g)+'<div><b>'+esc(g.title)+'</b><br><span class="id">'+g.stoneId+'</span></div></div></td>'+
      '<td>'+issues.join(" ")+'</td>'+
      '<td class="a-rowact"><button class="a-btn a-btn-sm" type="button" data-aedit="'+g.slug+'">Fix</button></td></tr>';
  }).join("") : '<tr><td colspan="3" class="a-empty">All published records are complete.</td></tr>';

  var inqRows = openInq().slice(0,5).map(function(q){

        (flagged(q)?' <span class="a-chip a-flag" style="font-size:10px">Compliance</span>':"")+'</span></td>'+
      '<td><span class="a-chip '+ageClass(q)+'">'+ageLabel(q.ageHrs)+'</span></td>'+

  var body = tiles + fresh +
    '<div class="a-cols-2">'+

  body += '<p class="a-hint">A weekly digest of everything on this page goes to the catalogue manager every Monday (FR-CMS-032).</p>';
  return adminShell("dashboard","Dashboard",'<a href="#/">Public site</a> · Admin', body);

<script>
"use strict";
/* ---------------- gemstone list view — PRD 20.4 ---------------- */
var SAVED_VIEWS = [
  ["all","All stones", function(){ return true; }],
  ["available","Available", function(g){ return g.status==="published" && g.availability==="available"; }],
  ["rubies","Available rubies", function(g){ return g.type==="Ruby" && g.availability==="available"; }],
  ["photo","Needs photography", function(g){ return g.imageCount<3 || g.altMissing; }],
  ["drafts","Unpublished drafts", function(g){ return g.status==="draft"; }],
  ["stale","Stale availability", function(g){ return g.status==="published" && g.availability!=="sold" && g.verifiedAgo>30; }],
  ["sold","Archive (sold)", function(g){ return g.availability==="sold"; }]
];
var A_PAGE = 25; /* FR-CMS-040 — list views paginated at 25 */

function viewRows(){
  var v = SAVED_VIEWS.filter(function(s){ return s[0]===A.view; })[0] || SAVED_VIEWS[0];
  var r = GEMS.filter(v[2]);
  if(A.sort==="updated") r.sort(function(a,b){ return a.updatedAgo-b.updatedAgo; });
  else if(A.sort==="carat") r.sort(function(a,b){ return b.carat-a.carat; });
  else if(A.sort==="rank") r.sort(function(a,b){ return a.featureRank-b.featureRank; });
  else if(A.sort==="type") r.sort(function(a,b){ return a.type.localeCompare(b.type) || b.carat-a.carat; });
  return r;
}
function selCount(){ return Object.keys(A.sel).filter(function(k){ return A.sel[k]; }).length; }

function adminGemstones(){
  var rows = viewRows(), total = rows.length;
  var start = (A.page-1)*A_PAGE, page = rows.slice(start, start+A_PAGE);
  var n = selCount();

  var views = '<div class="a-views">'+SAVED_VIEWS.map(function(s){
    return '<button class="a-view" type="button" data-aview="'+s[0]+'" aria-pressed="'+(A.view===s[0])+'">'+s[1]+
      '<span class="n">'+GEMS.filter(s[2]).length+'</span></button>';
  }).join("")+'</div>';

  var bulk = n ? '<div class="a-bulk"><b>'+n+' selected</b>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="publish"'+(ro()?" disabled":"")+'>Publish</button>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="unpublish"'+(ro()?" disabled":"")+'>Unpublish</button>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="sold"'+(ro()?" disabled":"")+'>Mark sold</button>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="verify"'+(ro()?" disabled":"")+'>Confirm available</button>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="feature"'+(ro()?" disabled":"")+'>Set feature rank…</button>'+
    '<button class="a-btn a-btn-sm a-btn-d" type="button" data-bulk="delete"'+(ro()?" disabled":"")+'>Delete</button>'+
    '<button class="a-btn a-btn-sm" type="button" data-bulk="clear" style="margin-left:auto">Clear selection</button></div>' : "";

  var body = page.map(function(g){
    var warn = [];
    if(g.imageCount<3) warn.push('<span class="a-chip warn" title="FR-CAT-040 minimum 3 images">'+g.imageCount+' img</span>');
    if(g.altMissing) warn.push('<span class="a-chip bad" title="FR-CMS-008 alt text required">alt</span>');
    if(g.status==="published" && g.availability!=="sold" && g.verifiedAgo>30) warn.push('<span class="a-chip warn" title="FR-CMS-030">'+g.verifiedAgo+'d</span>');
    return '<tr'+(A.sel[g.stoneId]?' class="is-sel"':"")+'>'+
      '<td><input type="checkbox" data-asel="'+g.stoneId+'"'+(A.sel[g.stoneId]?" checked":"")+' aria-label="Select '+g.stoneId+'" style="accent-color:var(--ink)"></td>'+
      '<td><div class="a-name">'+thumb(g)+'<div><b>'+esc(g.title)+'</b><br><span class="id">'+g.stoneId+'</span></div></div></td>'+
      '<td>'+esc(g.type)+'</td>'+
      '<td class="num">'+g.carat.toFixed(2)+'</td>'+
      '<td>'+esc(g.shape)+'</td>'+
      '<td>'+(g.treatment==="unheated"?'<span class="a-chip ok">Unheated</span>':'<span class="a-chip">Heated</span>')+'</td>'+
      '<td>'+(g.lab?esc(g.lab):'<span style="color:var(--ink-tertiary)">—</span>')+'</td>'+
      '<td style="white-space:nowrap">'+esc(g.pricing==="public-price"?g.price:g.pricing==="price-on-request"?"POR":g.band)+'</td>'+
      '<td>'+statusChip(g)+'</td>'+
      '<td>'+(warn.join(" ")||'<span class="a-chip ok flat">OK</span>')+'</td>'+
      '<td class="num" style="color:var(--ink-meta)">'+fmtAgo(g.updatedAgo)+'</td>'+
      '<td class="a-rowact">'+
        '<button class="a-btn a-btn-sm" type="button" data-aedit="'+g.slug+'">Edit</button>'+
        '<button class="a-btn a-btn-sm" type="button" data-adup="'+g.stoneId+'"'+(ro()?" disabled":"")+' title="FR-CMS-002">Duplicate</button>'+
        (g.availability!=="sold"?'<button class="a-btn a-btn-sm" type="button" data-asold="'+g.stoneId+'"'+(ro()?" disabled":"")+' title="FR-CMS-009">Sold</button>':"")+
        '<a class="a-btn a-btn-sm" href="#/gemstones/'+g.slug+'" title="View on the public site">View</a>'+
      '</td></tr>';
  }).join("") || '<tr><td colspan="12" class="a-empty">No stones in this view.</td></tr>';

  var pages = Math.max(1, Math.ceil(total/A_PAGE));
  var pag = '<div class="a-pag"><span>Showing '+(total?start+1:0)+'–'+Math.min(start+A_PAGE,total)+' of '+total+'</span>'+

  var content = views +
    '<div class="a-panel">'+bulk+
      '<div class="a-tw"><table class="a-tbl"><thead><tr>'+
        '<th><input type="checkbox" id="aselAll" aria-label="Select all on this page" style="accent-color:var(--ink)"></th>'+
        '<th>Stone</th><th>Type</th><th class="num">Carat</th><th>Shape</th><th>Treatment</th><th>Lab</th><th>Price</th>'+
        '<th>Status</th><th>Health</th><th class="num">Updated</th><th></th>'+
      '</tr></thead><tbody>'+body+'</tbody></table></div>'+pag+
    '</div>'+
    '<p class="a-hint">Every column is sortable and filterable. Saved views, bulk status changes and CSV export are all here because a catalogue that is tedious to maintain stops being maintained — which is exactly what happened to the current site in 2017.</p>';

  var right = '<select class="a-sel" id="asort" style="width:auto; min-height:32px; padding:5px 8px; font-size:12.5px" aria-label="Sort">'+
      [["updated","Recently updated"],["carat","Carat, high to low"],["rank","Feature rank"],["type","Type"]]
      .map(function(o){ return '<option value="'+o[0]+'"'+(A.sort===o[0]?" selected":"")+'>'+o[1]+'</option>'; }).join("")+'</select>'+
    '<button class="a-btn a-btn-sm" type="button" data-toast="Exports the current view as CSV, including every commercial field (§20.4).">Export CSV</button>'+
    '<button class="a-btn a-btn-p" type="button" data-anew="1"'+(ro()?" disabled":"")+'>New stone</button>';

  if(!can("catalogue")) return adminShell("gemstones","Gemstones",'<a href="#/admin">Admin</a> · Catalogue', noAccess("the catalogue"));
  return adminShell("gemstones","Gemstones",'<a href="#/admin">Admin</a> · Catalogue', content, right);
}
function noAccess(what){
  return '<div class="a-panel"><div class="a-panel-b a-empty">'+
    '<p style="font-size:15px; color:var(--ink)">The <b>'+ROLES[A.role].label+'</b> role has no access to '+what+'.</p>'+
    '<p style="margin-top:10px">Roles are defined in §20.5. Inquiry records contain personal data and are restricted to Administrator and Sales (FR-CMS-020).</p>'+
    '<p style="margin-top:14px"><button class="a-btn" type="button" data-role="admin">Switch to Administrator</button></p></div></div>';
}

/* ---------------- inquiries — PRD 21.5 ---------------- */
function inqStatusChip(q){
  var m = {"new":["info","New"],"contacted":["","Contacted"],"in-discussion":["","In discussion"],
           "quoted":["warn","Quoted"],"won":["ok","Won"],"lost":["bad","Lost"],"spam":["","Spam"]};
  var s = m[q.status]||["","?"];
  return '<span class="a-chip '+s[0]+'">'+s[1]+(q.status==="lost"&&q.lostReason?" · "+q.lostReason:"")+'</span>';
}
function adminInquiries(){
  if(!can("inquiries")) return adminShell("inquiries","Inquiries",'<a href="#/admin">Admin</a> · Sales', noAccess("inquiries"));

  var list = INQ.filter(function(q){
    if(A.inqFilter==="open") return !q.spam && ["new","contacted","in-discussion","quoted"].indexOf(q.status)>-1;
    if(A.inqFilter==="spam") return q.spam;
    if(A.inqFilter==="flagged") return !q.spam && flagged(q);
    if(A.inqFilter==="closed") return !q.spam && ["won","lost"].indexOf(q.status)>-1;
    return !q.spam;
  }).sort(function(a,b){ return b.ageHrs-a.ageHrs; });

  var counts = {
    open: INQ.filter(function(q){ return !q.spam && ["new","contacted","in-discussion","quoted"].indexOf(q.status)>-1; }).length,
    flagged: INQ.filter(function(q){ return !q.spam && flagged(q); }).length,
    closed: INQ.filter(function(q){ return !q.spam && ["won","lost"].indexOf(q.status)>-1; }).length,
    all: INQ.filter(function(q){ return !q.spam; }).length,
    spam: INQ.filter(function(q){ return q.spam; }).length
  };
  var views = '<div class="a-views">'+
    [["open","Open"],["flagged","Compliance review"],["closed","Closed"],["all","All"],["spam","Spam quarantine"]]
    .map(function(v){ return '<button class="a-view" type="button" data-ainqf="'+v[0]+'" aria-pressed="'+(A.inqFilter===v[0])+'">'+v[1]+
      '<span class="n">'+counts[v[0]]+'</span></button>'; }).join("")+'</div>';

  var rows = list.map(function(q){
    var g = q.item ? GEMS.filter(function(x){ return x.slug===q.item; })[0] : null;
    return '<tr>'+
      '<td><span class="mono" style="font-size:11.5px">'+q.ref+'</span>'+
        (q.priority==="high"?'<br><span class="a-chip warn" style="margin-top:3px">High value</span>':"")+'</td>'+
      '<td><span class="a-chip flat">'+q.type+'</span></td>'+
      '<td><b style="font-weight:500">'+esc(q.name)+'</b><br><span style="font-size:11.5px; color:var(--ink-meta)">'+esc(q.email)+'</span></td>'+
      '<td>'+esc(q.country)+(flagged(q)?'<br><span class="a-chip a-flag" style="margin-top:3px">Compliance</span>':"")+'</td>'+
      '<td>'+(g?'<div class="a-name">'+thumb(g)+'<span class="id">'+g.stoneId+'</span></div>':'<span style="color:var(--ink-tertiary)">—</span>')+'</td>'+
      '<td><span class="a-chip '+ageClass(q)+'">'+ageLabel(q.ageHrs)+'</span></td>'+
      '<td>'+esc(q.assignee||"—")+'</td>'+
      '<td>'+inqStatusChip(q)+'</td>'+
      '<td class="a-rowact"><button class="a-btn a-btn-sm" type="button" data-ainq="'+q.ref+'">Open</button></td></tr>';
  }).join("") || '<tr><td colspan="9" class="a-empty">Nothing in this view.</td></tr>';

  var body = views;
  if(A.inqFilter==="spam") body += '<p class="a-hint">Suspected spam is quarantined here, never silently discarded — a false positive on a US$100,000 enquiry is unacceptable (FR-INQ-071).</p>';
  body += '<div class="a-panel"><div class="a-tw"><table class="a-tbl"><thead><tr>'+
    '<th>Reference</th><th>Type</th><th>From</th><th>Country</th><th>Item</th><th>Age</th><th>Assignee</th><th>Status</th><th></th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<p class="a-hint">Amber at two business days without a response, red at four (FR-INQ-033). Country drives compliance routing, not marketing (FR-INQ-002).</p>';

  var right = '<button class="a-btn a-btn-sm" type="button" data-toast="Exports the current view as CSV (FR-INQ-034).">Export CSV</button>';
  return adminShell("inquiries","Inquiries",'<a href="#/admin">Admin</a> · Sales', body, right);
}

function adminInquiry(ref){
  if(!can("inquiries")) return adminShell("inquiries","Inquiries",'<a href="#/admin">Admin</a> · Sales', noAccess("inquiries"));
  var q = INQ.filter(function(x){ return x.ref===ref; })[0];
  if(!q) return adminShell("inquiries","Not found",'<a href="#/admin/inquiries">Inquiries</a>','<div class="a-panel"><div class="a-empty">No such inquiry.</div></div>');
  var g = q.item ? GEMS.filter(function(x){ return x.slug===q.item; })[0] : null;

  var banner = flagged(q) ? '<div class="a-banner" data-prd="FR-INQ-022"><b>Compliance review required</b>'+
    'This enquiry originates in '+esc(q.country)+', which is on the compliance-review list configured by SP Gems on the advice of counsel. '+
    'Complete the review before any commercial response, quotation or commitment. This flag is advisory to staff and is never shown to the enquirer, who received the same confirmation as everyone else (FR-INQ-023).</div>' : "";

  var notes = q.notes.length ? q.notes.map(function(n){
    return '<div class="a-note"><span class="m">'+esc(n.who)+' · '+esc(n.when)+'</span><p>'+esc(n.text)+'</p></div>';
  }).join("") : '<p class="a-hint">No internal notes yet.</p>';

  var main = banner +
    '<div class="a-panel"><div class="a-panel-h"><h2>'+esc(q.name)+'</h2>'+inqStatusChip(q)+
      (q.priority==="high"?'<span class="a-chip warn">High value — FR-INQ-021</span>':"")+
      '<span class="a-sub" style="margin-left:auto">'+q.ref+'</span></div>'+
      '<div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-4)">'+
        '<dl class="a-kv">'+
          '<dt>Email</dt><dd>'+esc(q.email)+'</dd>'+
          '<dt>Country</dt><dd>'+esc(q.country)+'</dd>'+
          '<dt>Type</dt><dd>'+esc(q.type)+'</dd>'+
          '<dt>Received</dt><dd>'+ageLabel(q.ageHrs)+' ago</dd>'+
          '<dt>Assignee</dt><dd>'+esc(q.assignee||"Unassigned")+'</dd>'+
        '</dl>'+
        '<div><p style="font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-meta); margin-bottom:6px">Message</p>'+
        '<p style="font-size:14px; line-height:1.6">'+esc(q.message)+'</p></div>'+
      '</div></div>'+
    (g ? '<div class="a-panel"><div class="a-panel-h"><h2>Attached stone</h2><span class="a-sub">FR-INQ-004 — captured automatically</span></div>'+
      '<div class="a-panel-b"><div class="a-name">'+thumb(g)+
      '<div><b>'+esc(g.title)+'</b><br><span class="id">'+g.stoneId+' · '+g.carat.toFixed(2)+' ct · '+esc(priceLabel(g))+'</span></div>'+
      '<div style="margin-left:auto; display:flex; gap:6px"><a class="a-btn a-btn-sm" href="#/gemstones/'+g.slug+'">View on site</a>'+
      '<button class="a-btn a-btn-sm" type="button" data-aedit="'+g.slug+'">Edit record</button></div></div></div></div>' : "")+
    '<div class="a-panel"><div class="a-panel-h"><h2>Internal notes</h2><span class="a-sub">FR-INQ-032</span></div>'+
      '<div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-4)">'+notes+
      '<div class="a-f"><label for="noteTxt">Add a note</label><textarea class="a-inp" id="noteTxt" placeholder="Visible to staff only."></textarea>'+
      '<div><button class="a-btn" type="button" data-anote="'+q.ref+'"'+(ro()?" disabled":"")+'>Add note</button></div></div>'+
      '</div></div>';

  var rail = '<div class="a-panel"><div class="a-panel-h"><h2>Status</h2></div><div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-4)">'+
      '<div class="a-f"><label for="inqStatus">Pipeline status</label><select class="a-sel" id="inqStatus" data-astatus="'+q.ref+'"'+(ro()?" disabled":"")+'>'+
        ["new","contacted","in-discussion","quoted","won","lost"].map(function(s){
          return '<option value="'+s+'"'+(q.status===s?" selected":"")+'>'+s.charAt(0).toUpperCase()+s.slice(1).replace("-"," ")+'</option>'; }).join("")+
        '</select></div>'+
      (q.status==="lost" ? '<div class="a-f"><label for="lostR">Reason lost <span class="req">*</span></label>'+
        '<select class="a-sel" id="lostR" data-alost="'+q.ref+'"'+(ro()?" disabled":"")+'>'+
        ["price","timing","availability","no response","compliance","other"].map(function(r){
          return '<option value="'+r+'"'+(q.lostReason===r?" selected":"")+'>'+r+'</option>'; }).join("")+'</select>'+
        '<span class="help">Required on Lost — this is how SP Gems learns what the site actually produces (FR-INQ-031).</span></div>' : "")+
      '<div class="a-f"><label for="inqAssign">Assignee</label><select class="a-sel" id="inqAssign"'+(ro()?" disabled":"")+'>'+
        ["","Aung Kyaw Zin","Su Su Hlaing"].map(function(p){ return '<option'+(q.assignee===p?" selected":"")+'>'+(p||"Unassigned")+'</option>'; }).join("")+
        '</select></div>'+
      (q.spam?'<button class="a-btn" type="button" data-anotspam="'+q.ref+'">Not spam — restore</button>':"")+
    '</div></div>'+
    '<div class="a-panel"><div class="a-panel-h"><h2>Audit</h2></div><div class="a-panel-b">'+
      '<p class="a-hint">Inquiry records are never deleted (§20.2). Status changes and notes are attributed and timestamped. '+
      'Personal data is visible to Administrator and Sales only (FR-CMS-020).</p></div></div>';

  return adminShell("inquiries", q.ref, '<a href="#/admin">Admin</a> · <a href="#/admin/inquiries">Inquiries</a> · '+q.ref,
    '<div class="a-inq"><div style="display:flex; flex-direction:column; gap:var(--a-5); min-width:0">'+main+'</div>'+
    '<div style="display:flex; flex-direction:column; gap:var(--a-3)">'+rail+'</div></div>');
}
</script>

<script>
"use strict";
/* ---------------- gemstone editor — PRD 20.3 ---------------- */
var REQUIRED = [
  ["title","Title","identity"],["gemType","Type","identity"],
  ["carat","Carat weight","spec"],["dimL","Length","spec"],["dimW","Width","spec"],["dimD","Depth","spec"],["shape","Shape","spec"],
  ["colour","Primary colour","colour"],["clarity","Clarity description","colour"],
  ["origin","Origin","origin"],["treatment","Treatment status","treat"]
];
var SAVE = { state:"saved", at:"14:32", timer:null };

function blankGem(){
  var n = 400 + GEMS.length;
  return { stoneId:"SPG-R-0"+n, slug:"", title:"", type:"Ruby", variety:"", carat:"", dims:["","",""],
    shape:"Cushion", cut:"Mixed", cutByUs:true, pieces:1, colour:"", colourFamily:"Red", tradeTerm:"", tint:"#9E2436",
    clarity:"", transparency:"Transparent", origin:"Mogok, Myanmar", ownMine:false, treatment:"unheated", treatVerified:false,
    lab:"", certNo:"", certDate:"", pricing:"price-band", band:"US$10,000–25,000", price:"", availability:"available",
    exceptional:false, rank:30, video:false, rough:false, colourNotes:"", provenance:"",
    status:"draft", imageCount:0, altMissing:0, verifiedAgo:0, updatedAgo:0, featureRank:30, images:[], isNew:true };
}
function toDraft(g){
  var d = JSON.parse(JSON.stringify(g));
  if(!d.images){
    d.images = [];
    for(var i=0;i<(d.imageCount||0);i++){
      d.images.push({ view:i%VIEWS.length, alt: (i===0 && !d.altMissing) ? d.title+", face-up on a neutral grey ground" : (d.altMissing && i===1 ? "" : VIEWS[i%VIEWS.length].cap), pct:100 });
    }
  }
  return d;
}
function draftErrors(d){
  var e = [];
  REQUIRED.forEach(function(r){
    var v;
    if(r[0]==="dimL") v = d.dims[0]; else if(r[0]==="dimW") v = d.dims[1]; else if(r[0]==="dimD") v = d.dims[2];
    else if(r[0]==="gemType") v = d.type;
    else v = d[r[0]];
    if(v===""||v===null||v===undefined) e.push({f:r[0], label:r[1], grp:r[2]});
  });
  if(!d.images || d.images.length < 3) e.push({f:"images", label:"At least 3 images (FR-CAT-040)", grp:"media"});
  (d.images||[]).forEach(function(im,i){ if(!im.alt || !im.alt.trim()) e.push({f:"alt"+i, label:"Alt text on image "+(i+1)+" (FR-CMS-008)", grp:"media"}); });
  if(d.tradeTerm && !d.lab) e.push({f:"tradeTerm", label:"Trade colour term requires a laboratory (§32A)", grp:"colour"});
  if(d.lab && !d.certNo) e.push({f:"certNo", label:"Report number", grp:"cert"});
  return e;
}

function f(id, label, value, opts){
  opts = opts||{};
  var err = opts.err ? " err" : "", lock = opts.lock ? " locked" : "";
  var attrs = 'class="a-inp" id="ed-'+id+'" data-ed="'+id+'"'+(opts.lock?' readonly':"")+(ro()?" disabled":"")+
    (opts.type?' type="'+opts.type+'"':"")+(opts.step?' step="'+opts.step+'"':"")+(opts.ph?' placeholder="'+esc(opts.ph)+'"':"");
  var input;
  if(opts.options) input = '<select class="a-inp" id="ed-'+id+'" data-ed="'+id+'"'+(ro()||opts.lock?" disabled":"")+'>'+
      opts.options.map(function(o){ var v=(o instanceof Array)?o[0]:o, t=(o instanceof Array)?o[1]:o;
        return '<option value="'+esc(v)+'"'+(String(value)===String(v)?" selected":"")+'>'+esc(t)+'</option>'; }).join("")+'</select>';
  else if(opts.area) input = '<textarea '+attrs+'>'+esc(value||"")+'</textarea>';
  else input = '<input '+attrs+' value="'+esc(value===null||value===undefined?"":value)+'">';
  return '<div class="a-f'+err+lock+(opts.wide?" wide":"")+'" data-fw="'+id+'"><label for="ed-'+id+'">'+esc(label)+
    (opts.req?' <span class="req">*</span>':"")+'</label>'+input+
    (opts.help?'<span class="help">'+opts.help+'</span>':"")+
    (opts.err?'<span class="fe">'+esc(opts.err)+'</span>':"")+'</div>';
}
function grp(id, title, count, bodyHtml, errs, open){
  var has = errs && errs.some(function(e){ return e.grp===id; });
  return '<details class="a-grpx"'+(open||has?" open":"")+' data-grp="'+id+'"><summary'+(has?' class="has-err"':"")+'>'+title+
    '<span class="a-gcount">'+(has?errs.filter(function(e){return e.grp===id;}).length+" to fix":count)+'</span></summary>'+
    '<div class="a-gbody">'+bodyHtml+'</div></details>';
}

function adminEditor(slug){
  if(!can("catalogue")) return adminShell("gemstones","Gemstones",'<a href="#/admin">Admin</a> · Catalogue', noAccess("the catalogue"));
  if(!A.draft || (slug!=="new" && A.draft.slug!==slug && A.draft.stoneId!==slug)){
    var src = slug==="new" ? blankGem() : GEMS.filter(function(x){ return x.slug===slug || x.stoneId===slug; })[0];
    if(!src) return adminShell("gemstones","Not found",'<a href="#/admin/gemstones">Gemstones</a>','<div class="a-panel"><div class="a-empty">No such stone.</div></div>');
    A.draft = toDraft(src);
  }
  var d = A.draft, errs = draftErrors(d), pub = d.status==="published";
  var E = function(field){ var m = errs.filter(function(e){ return e.f===field; })[0]; return m ? m.label+" is required" : null; };

  var identity = f("title","Editorial title",d.title,{req:1,wide:1,err:E("title"),help:"Shown as the page H1. e.g. Unheated Mogok Ruby"})+
    f("stoneId","Stone ID",d.stoneId,{lock:1,help:"Auto-generated and immutable. Quote this on the phone."})+
    f("slug","URL slug",d.slug||"(generated on publish)",{lock:pub||!d.slug,help:pub?"Immutable after publish. Editing carat or origin will not change a live URL (FR-URL-002).":"Built from ID, treatment, origin, type and carat on publish (§10.2)."})+
    f("type","Gemstone type",d.type,{req:1,options:TYPES,err:E("gemType")})+
    f("variety","Variety name",d.variety,{ph:"Padparadscha, Star Sapphire, Cat's Eye"});

  var spec = f("carat","Carat weight",d.carat,{req:1,type:"number",step:"0.01",err:E("carat")})+
    f("shape","Shape",d.shape,{req:1,options:SHAPES,err:E("shape")})+
    f("dimL","Length (mm)",d.dims[0],{req:1,type:"number",step:"0.01",err:E("dimL")})+
    f("dimW","Width (mm)",d.dims[1],{req:1,type:"number",step:"0.01",err:E("dimW")})+
    f("dimD","Depth (mm)",d.dims[2],{req:1,type:"number",step:"0.01",err:E("dimD")})+
    f("cut","Cutting style",d.cut,{options:["Brilliant","Step","Mixed","Cabochon","Fantasy"]})+
    '<label class="a-check"><input type="checkbox" data-edc="cutByUs"'+(d.cutByUs?" checked":"")+(ro()?" disabled":"")+'>'+
      '<span>Cut in our own workshop<br><span class="help">A genuine differentiator most competitors cannot claim.</span></span></label>'+
    '<label class="a-check"><input type="checkbox" data-edc="rough"'+(d.rough?" checked":"")+(ro()?" disabled":"")+'>'+
      '<span>Rough photograph available<br><span class="help">Unlocks the before/after cutting comparison (FR-VIEW-020).</span></span></label>';

  var colour = f("colour","Primary colour",d.colour,{req:1,err:E("colour"),ph:"Vivid red"})+
    f("colourFamily","Colour family",d.colourFamily,{options:COLOURS.map(function(c){return c[0];}),help:"Drives the catalogue swatch filter."})+
    f("tradeTerm","Laboratory trade term",d.tradeTerm,{err:E("tradeTerm"),lock:!d.lab,
      help:d.lab?"Only where "+esc(d.lab)+" has actually issued the term.":"Locked until a laboratory is recorded. Trade terms must never be applied editorially (§32A)."})+
    f("clarity","Clarity description",d.clarity,{req:1,err:E("clarity"),ph:"Eye-clean",
      help:"Descriptive only. Do not use diamond clarity grades — it signals inexperience."})+
    f("transparency","Transparency",d.transparency,{options:["Transparent","Semi-transparent","Translucent","Opaque"]})+
    f("colourNotes","Colour notes",d.colourNotes,{area:1,wide:1,help:"Behaviour under daylight versus incandescent light; fluorescence."});

  var origin = f("origin","Origin",d.origin,{req:1,err:E("origin"),options:["Mogok, Myanmar","Pyaung Gaung, Mogok","Namyarseik, Kachin State","Myanmar (region undisclosed)"]})+
    f("mine","Specific mine (internal)",d.mine||"",{help:"Internal only. Never rendered publicly (§12.5)."})+
    '<label class="a-check"><input type="checkbox" data-edc="ownMine"'+(d.ownMine?" checked":"")+(ro()?" disabled":"")+'>'+
      '<span>Recovered from our own workings<br><span class="help">Adds the provenance callout on the detail page.</span></span></label>'+
    f("provenance","Provenance narrative",d.provenance,{area:1,wide:1,
      help:"Where it was recovered or bought, from whom, and when. This is the chain-of-custody record buyers ask for (§3.3)."});

  var treat = f("treatment","Treatment status",d.treatment,{req:1,err:E("treatment"),options:[["unheated","Unheated — no thermal or chemical enhancement"],["heated","Heated"]]})+
    (d.treatment!=="unheated" ? f("treatDetail","Treatment detail",d.treatDetail||"",{help:"Shown in the disclosure section. Conditional field — appears only for treated stones."}) : "")+
    '<label class="a-check"><input type="checkbox" data-edc="treatVerified"'+(d.treatVerified?" checked":"")+(ro()?" disabled":"")+'>'+
      '<span>Lab-verified finding<br><span class="help">Unchecked renders as &ldquo;house assessment&rdquo; on the public page — the honest default.</span></span></label>'+
    '<div class="a-f wide"><span class="help">The treatment section renders on every stone regardless of status, including unheated ones (FR-GEM-052). Making the disclosure prominent for treated stones is what makes it credible for the rest.</span></div>';

  var cert = f("lab","Laboratory",d.lab,{options:["","GRS","Gübelin","GIA","AGL","Lotus","SSEF","AIGS"],help:"Leave blank if uncertified — the page will say so plainly (FR-GEM-058)."})+
    f("certNo","Report number",d.certNo,{err:E("certNo"),lock:!d.lab,help:"Public text. A buyer can verify it with the laboratory — that is a trust win, not a risk."})+
    f("certDate","Report date",d.certDate,{lock:!d.lab})+
    '<div class="a-f"><label>Certificate document</label>'+
      (d.lab?'<div class="a-drop" style="padding:var(--a-4)">'+esc(d.lab)+'-'+esc(d.certNo||"…")+'.pdf<br><span style="font-size:11px">Non-public storage · signed URL, 15 min (FR-GEM-060)</span></div>'
        :'<div class="a-drop" style="padding:var(--a-4)">No document</div>')+'</div>';

  var comm = f("pricing","Pricing model",d.pricing,{options:[["public-price","Public price"],["price-band","Price band"],["price-on-request","Price on request"]]})+
    (d.pricing==="public-price" ? f("price","Price",d.price,{ph:"US$3,900"}) : f("band","Price band",d.band,{options:BANDS}))+
    f("availability","Availability",d.availability,{options:[["available","Available"],["reserved","Reserved"],["sold","Sold"]]})+
    f("featureRank","Feature rank",d.featureRank,{type:"number",help:"Lower sorts first in the curated default order (FR-CAT-008)."})+
    '<label class="a-check"><input type="checkbox" data-edc="exceptional"'+(d.exceptional?" checked":"")+(ro()?" disabled":"")+'>'+
      '<span>Exceptional tier<br><span class="help">Forces price-on-request, changes the CTA, and flags inquiries as high priority (FR-INQ-021).</span></span></label>';

  var imgs = (d.images||[]).map(function(im,i){
    var missing = !im.alt || !im.alt.trim();
    return '<div class="a-mi'+(i===0?" primary":"")+'" draggable="'+(!ro())+'" data-mi="'+i+'">'+
      '<div class="plate">'+gemSVG(d.tint?d:d, im.view, 200, 250)+'</div>'+
      (im.pct<100?'<div class="a-prog"><i style="width:'+im.pct+'%"></i></div>':"")+
      '<div class="a-mi-b">'+
        '<div class="a-mi-t">'+(i===0?"Primary":"Image "+(i+1))+
          '<span style="margin-left:auto; display:flex; gap:2px">'+
          '<button class="a-btn a-btn-sm" type="button" data-mmove="'+i+',-1" aria-label="Move earlier"'+(i===0||ro()?" disabled":"")+' style="padding:2px 5px; min-height:0">←</button>'+
          '<button class="a-btn a-btn-sm" type="button" data-mmove="'+i+',1" aria-label="Move later"'+(i===d.images.length-1||ro()?" disabled":"")+' style="padding:2px 5px; min-height:0">→</button>'+
          '<button class="a-btn a-btn-sm" type="button" data-mdel="'+i+'" aria-label="Remove image"'+(ro()?" disabled":"")+' style="padding:2px 5px; min-height:0">×</button>'+
          '</span></div>'+
        '<input class="a-inp'+(missing?"":"")+'" data-malt="'+i+'" value="'+esc(im.alt||"")+'" placeholder="Alt text (required)"'+(ro()?" disabled":"")+
          (missing?' style="border-color:var(--error)"':"")+' aria-label="Alt text for image '+(i+1)+'">'+
      '</div></div>';
  }).join("");
  var media = '<div class="a-f wide"><div class="a-drop" id="dropZone">'+
      (ro()?"Read-only role":"Drag images here, or <button class=\"a-btn a-btn-sm\" type=\"button\" data-aupload=\"1\">choose files</button>")+
      '<br><span style="font-size:11px">Multi-file, per-file progress, resumable after an interruption. Derivatives at 400/800/1200/2000 px generate in the background (FR-CMS-006).</span></div></div>'+
    '<div class="a-f wide"><div class="a-media">'+(imgs||'<p class="a-hint">No images yet. Three is the minimum to publish.</p>')+'</div>'+
      '<span class="help" style="margin-top:8px">Drag to reorder, or use the arrows — keyboard-operable reordering is required, drag alone fails WCAG 2.2 (§26). The first image is the primary and is the LCP element on the detail page.</span></div>';

  var seo = f("metaTitle","Meta title",d.metaTitle||(d.title?d.title+" | SP Gems":""),{wide:1,help:"Falls back to the editorial title."})+
    f("metaDesc","Meta description",d.metaDesc||"",{area:1,wide:1,ph:"Auto-generated from carat, treatment, origin and type if left blank."});

  var rel = '<div class="a-f wide"><label>Related gemstones</label>'+
    '<p class="a-hint">Left empty, four are generated by the scoring rule in FR-GEM-070: same type +3, same origin +2, same treatment +2, carat within 40% +2, same band +1.</p></div>';

  var groups = '<div class="a-groups">'+
    grp("identity","Identity",5,identity,errs,true)+
    grp("spec","Specification",8,spec,errs)+
    grp("colour","Colour",6,colour,errs)+
    grp("origin","Origin & provenance",4,origin,errs)+
    grp("treat","Treatment",3,treat,errs)+
    grp("cert","Certification",4,cert,errs)+
    grp("comm","Commercial",5,comm,errs)+
    grp("media","Media",(d.images||[]).length+" images",media,errs)+
    grp("rel","Relationships",1,rel,errs)+
    grp("seo","SEO",2,seo,errs)+
  '</div>';

  var saveTxt = SAVE.state==="saved" ? "Draft saved at "+SAVE.at
    : SAVE.state==="saving" ? "Saving…" : "Connection lost — changes queued locally";
  var rail = '<div class="a-rail">'+
    '<div class="a-panel"><div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-3)">'+
      '<div class="a-save '+(SAVE.state==="saved"?"":SAVE.state)+'">'+saveTxt+'</div>'+
      '<div style="display:flex; gap:6px; flex-wrap:wrap">'+statusChip(d)+
        (d.exceptional?'<span class="a-chip info">Exceptional</span>':"")+'</div>'+
      (errs.length
        ? '<div><p style="font-size:12px; font-weight:600; color:var(--error); margin-bottom:7px">'+errs.length+' item'+(errs.length>1?"s":"")+' before this can be published</p>'+
          '<ul class="a-errlist">'+errs.slice(0,8).map(function(e){
            return '<li><button type="button" data-jump="'+e.grp+'|'+e.f+'">'+esc(e.label)+'</button></li>'; }).join("")+
          (errs.length>8?'<li style="font-size:12px; color:var(--ink-meta)">and '+(errs.length-8)+' more</li>':"")+'</ul></div>'
        : '<p style="font-size:12.5px; color:var(--success)">All required fields are complete.</p>')+
      '<button class="a-btn a-btn-p" type="button" data-apublish="1"'+(errs.length||ro()?" disabled":"")+'>'+(pub?"Save & republish":"Publish")+'</button>'+
      '<button class="a-btn" type="button" data-asave="1"'+(ro()?" disabled":"")+'>Save draft</button>'+
      '<button class="a-btn" type="button" data-apreview="1" aria-pressed="'+A.preview+'">'+(A.preview?"Hide":"Show")+' live preview</button>'+
    '</div></div>'+
    '<div class="a-panel"><div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-2)">'+
      '<button class="a-btn" type="button" data-adup="'+d.stoneId+'"'+(ro()||d.isNew?" disabled":"")+'>Duplicate this stone</button>'+
      (d.availability!=="sold"?'<button class="a-btn" type="button" data-asold="'+d.stoneId+'"'+(ro()||d.isNew?" disabled":"")+'>Mark as sold</button>':"")+
      (pub?'<a class="a-btn" href="#/gemstones/'+d.slug+'">View on the public site</a>':"")+
      '<button class="a-btn a-btn-d" type="button" data-adelete="'+d.stoneId+'"'+(ro()||d.isNew?" disabled":"")+'>Delete</button>'+
      '<span class="help">Deletes are soft, with a 30-day recovery window (FR-CMS-041).</span>'+
    '</div></div>'+
    (A.preview ? '<div class="a-prev"><div class="a-prev-h">Live preview — public detail page from this draft (FR-CMS-004)</div>'+
      '<div class="a-prev-in">'+viewGem(previewable(d))+'</div></div>' : "")+
  '</div>';

  var title = d.isNew ? "New stone" : d.title || d.stoneId;
  return adminShell("gemstones", title,
    '<a href="#/admin">Admin</a> · <a href="#/admin/gemstones">Gemstones</a> · '+esc(d.stoneId),
    '<div class="a-edit">'+groups+rail+'</div>');
}
/* the preview needs a renderable record even while fields are blank */
function previewable(d){
  var p = JSON.parse(JSON.stringify(d));
  p.title = p.title || "Untitled stone";
  p.carat = parseFloat(p.carat) || 0;
  p.dims = p.dims.map(function(x){ return parseFloat(x) || 0; });
  p.colour = p.colour || "—";
  p.clarity = p.clarity || "—";
  p.imageCount = (p.images||[]).length;
  return p;
}
</script>

<script>
"use strict";
/* ---------------- media library + remaining admin screens ---------------- */

  var items = [];
  GEMS.slice(0,8).forEach(function(g){
    for(var i=0;i<Math.min(2,g.imageCount);i++) items.push({g:g,v:i,alt:(g.altMissing&&i===1)?"":VIEWS[i].cap});
  });
  var grid = items.map(function(it,i){
    return '<div class="a-mi"><div class="plate">'+gemSVG(it.g,it.v,200,250)+'</div><div class="a-mi-b">'+
      '<div class="a-mi-t">'+it.g.stoneId+'</div>'+
      (it.alt?'<span class="help" style="font-size:11px">'+esc(it.alt.slice(0,44))+'…</span>'
        :'<span class="a-chip bad" style="font-size:10px">Alt text missing</span>')+
      '</div></div>';
  }).join("");
  return adminShell("media","Media",'<a href="#/admin">Admin</a> · Catalogue',
    '<div class="a-panel"><div class="a-panel-h"><h2>Media library</h2>'+
    '<span class="a-sub">'+items.length+' assets · '+items.filter(function(i){return !i.alt;}).length+' missing alt text</span></div>'+
    '<div class="a-panel-b"><div class="a-media">'+grid+'</div></div></div>'+
    '<p class="a-hint">Masters are stored at 4000 px on the long edge, sRGB and colour-managed (FR-CAT-041). Public derivatives carry a discreet corner watermark; originals are never served publicly (FR-CAT-044).</p>',
    '<button class="a-btn a-btn-p" type="button" data-toast="Drag-and-drop multi-file upload with per-file progress, resumable after interruption (FR-CMS-006)."'+(ro()?" disabled":"")+'>Upload</button>');
}
function adminSettings(){
  if(!can("settings")) return adminShell("settings","Settings",'<a href="#/admin">Admin</a> · System', noAccess("settings"));
  return adminShell("settings","Settings",'<a href="#/admin">Admin</a> · System',
    '<div class="a-panel"><div class="a-panel-h"><h2>Compliance-review list</h2><span class="a-sub">FR-INQ-022</span></div>'+
    '<div class="a-panel-b" style="display:flex; flex-direction:column; gap:var(--a-4)">'+
      '<div class="a-banner"><b>Requires professional review</b>The system provides the mechanism; SP Gems sets the policy on the advice of counsel with sanctions expertise. The values below are placeholders, not legal advice (§3.3, §32A).</div>'+
      '<div style="display:flex; gap:7px; flex-wrap:wrap">'+COMPLIANCE_LIST.map(function(c){
        return '<span class="a-chip a-flag">'+esc(c)+'</span>'; }).join("")+'</div>'+
      '<p class="a-hint">An inquiry from any listed country is flagged <code>requires-compliance-review</code> and shows a persistent banner to staff before any commercial response. The enquirer never sees the flag and receives the same confirmation as anyone else (FR-INQ-023).</p>'+
    '</div></div>'+
    '<div class="a-panel"><div class="a-panel-h"><h2>Inquiry routing</h2><span class="a-sub">FR-INQ-020</span></div>'+
    '<div class="a-tw"><table class="a-tbl"><thead><tr><th>Type</th><th>Owner</th><th>High-value trigger</th></tr></thead><tbody>'+
      [["gemstone","Sales","Exceptional tier, or band above US$50,000"],["jewellery","Sales","—"],
       ["bespoke","Bespoke owner","—"],["consultation","Sales","—"],["trade","Trade owner","—"],
       ["general","General","—"],["partnership","Management","—"],["media","Management","—"]]
      .map(function(r){ return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'; }).join("")+
    '</tbody></table></div></div>');
}
function adminStub(key, title, ref, note){
  return adminShell(key, title, '<a href="#/admin">Admin</a> · '+esc(ref),
    '<div class="a-panel"><div class="a-panel-b a-empty">'+
    '<p style="font-size:15px; color:var(--ink)">'+esc(title)+' — specified in '+esc(ref)+'.</p>'+
    '<p style="margin-top:10px; max-width:56ch; margin-left:auto; margin-right:auto">'+note+'</p>'+
    '<p style="margin-top:16px"><a class="a-btn" href="#/admin/gemstones">Go to gemstones</a></p></div></div>');
}
var A_STUBS = {
  jewellery:["Jewellery","§14","Same editor pattern as gemstones, with the jewellery field set from §14.2 and collection assignment."],
  collections:["Collections","§14.4","Create collections, write the collection story, and reorder the pieces within them."],
  articles:["Articles","§17","The Journal: education, stories and news in one system, with scheduled publishing and categories."],
  homepage:["Homepage curation","§29 · FR-HOME-012","Pick the featured stones, the featured collection, the three education articles, and edit the hero."],
  glossary:["Glossary","§13.4 · FR-GEM-056","The plain-language explanations behind every (?) affordance on the detail page."],
  consultations:["Consultations","§16","Requests, scheduling and status, with correct Yangon time-zone handling (§16.5)."],
  redirects:["Redirects","§10.2 · FR-URL-003","301s, including the ones generated automatically whenever a published slug changes."],
  users:["Users & roles","§20.5","Five roles: Administrator, Catalogue Manager, Editor, Sales, Viewer. Try the role switcher above."]
};

/* ---------------- admin router ---------------- */
function renderAdmin(parts){
  document.body.classList.add("admin");
  var seg = parts[1] || "dashboard";
  if(seg==="dashboard") return adminDashboard();
  if(seg==="gemstones"){
    if(parts[2]) return adminEditor(parts[2]);
    A.draft = null; return adminGemstones();
  }
  if(seg==="inquiries") return parts[2] ? adminInquiry(parts[2]) : adminInquiries();
  if(seg==="media") return adminMedia();
  if(seg==="settings") return adminSettings();
  if(A_STUBS[seg]){ var s=A_STUBS[seg]; return adminStub(seg,s[0],s[1],s[2]); }
  return adminDashboard();
}

/* ---------------- admin actions ---------------- */
function reAdmin(keepScroll){
  var y = window.scrollY;
  route(true);
  if(keepScroll) window.scrollTo(0,y);
}
function markSaving(){
  SAVE.state = "saving"; touchSave();
  clearTimeout(SAVE.timer);
  if(A.slow){
    SAVE.timer = setTimeout(function(){
      SAVE.state = "queued"; touchSave();
      SAVE.timer = setTimeout(function(){ SAVE.state="saved"; SAVE.at=clockNow(); touchSave(); }, 2600);
    }, 1400);
  } else {
    SAVE.timer = setTimeout(function(){ SAVE.state="saved"; SAVE.at=clockNow(); touchSave(); }, 700);
  }
}
function clockNow(){ var d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function touchSave(){
  var el = document.querySelector(".a-save");
  if(!el) return;
  el.className = "a-save " + (SAVE.state==="saved" ? "" : SAVE.state);
  el.textContent = SAVE.state==="saved" ? "Draft saved at "+SAVE.at
    : SAVE.state==="saving" ? "Saving…" : "Connection lost — changes queued locally";
}
/* FR-CMS-003 — autosave every 20 seconds */
setInterval(function(){ if(A.draft && A.dirty && document.body.classList.contains("admin")){ A.dirty=false; markSaving(); } }, 20000);

function commitDraft(publish){
  var d = A.draft;
  d.carat = parseFloat(d.carat)||0;
  d.dims = d.dims.map(function(x){ return parseFloat(x)||0; });
  d.imageCount = (d.images||[]).length;
  d.altMissing = (d.images||[]).filter(function(i){ return !i.alt || !i.alt.trim(); }).length;
  d.updatedAgo = 0;
  d.rank = d.featureRank = parseInt(d.featureRank,10)||30;
  if(publish){
    d.status = "published";
    d.verifiedAgo = 0;
    if(!d.slug) d.slug = d.stoneId.toLowerCase();
  }
  var existing = GEMS.filter(function(x){ return x.stoneId===d.stoneId; })[0];
  if(existing){ for(var k in d){ if(k!=="isNew") existing[k]=d[k]; } }
  else { delete d.isNew; GEMS.push(JSON.parse(JSON.stringify(d))); }
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-aview],[data-asel],[data-bulk],[data-apage],[data-aedit],[data-adup],[data-asold],[data-anew],[data-verify],[data-ainq],[data-ainqf],[data-anote],[data-anotspam],[data-jump],[data-apublish],[data-asave],[data-apreview],[data-adelete],[data-aupload],[data-mmove],[data-mdel],[data-role]") : null;
  if(!t) return;
  var v;

  if((v=t.getAttribute("data-aview"))!==null && v!==undefined && t.hasAttribute("data-aview")){ A.view=v; A.page=1; A.sel={}; reAdmin(); return; }
  if(t.hasAttribute("data-ainqf")){ A.inqFilter=t.getAttribute("data-ainqf"); reAdmin(); return; }
  if(t.hasAttribute("data-apage")){ A.page=Math.max(1,+t.getAttribute("data-apage")); A.sel={}; reAdmin(); return; }
  if(t.hasAttribute("data-role")){ A.role=t.getAttribute("data-role"); reAdmin(); return; }

  if(t.hasAttribute("data-asel")){ var id=t.getAttribute("data-asel"); A.sel[id]=t.checked; reAdmin(true); return; }
  if(t.hasAttribute("data-bulk")){
    var act=t.getAttribute("data-bulk"), ids=Object.keys(A.sel).filter(function(k){return A.sel[k];});
    if(act==="clear"){ A.sel={}; reAdmin(true); return; }
    if(act==="delete"){
      if(!confirm("Soft-delete "+ids.length+" stone"+(ids.length>1?"s":"")+"? They can be recovered for 30 days (FR-CMS-041).")) return;
      ids.forEach(function(id){ var i=GEMS.findIndex(function(g){return g.stoneId===id;}); if(i>-1) GEMS.splice(i,1); });
      A.sel={}; toast(ids.length+" stone(s) moved to trash. Recoverable for 30 days."); reAdmin(); return;
    }
    if(act==="feature"){
      var r=prompt("Set feature rank for "+ids.length+" stone(s). Lower sorts first."); if(r===null) return;
      ids.forEach(function(id){ var g=GEMS.filter(function(x){return x.stoneId===id;})[0]; if(g){ g.featureRank=g.rank=parseInt(r,10)||30; g.updatedAgo=0; } });
      toast("Feature rank set on "+ids.length+" stone(s)."); A.sel={}; reAdmin(); return;
    }
    ids.forEach(function(id){
      var g=GEMS.filter(function(x){return x.stoneId===id;})[0]; if(!g) return;
      if(act==="publish"){ g.status="published"; g.verifiedAgo=0; }
      if(act==="unpublish") g.status="draft";
      if(act==="sold"){ g.availability="sold"; g.pricing="price-band"; }
      if(act==="verify") g.verifiedAgo=0;
      g.updatedAgo=0;
    });
    toast(ids.length+" stone(s) updated. The public catalogue reflects this immediately.");
    A.sel={}; reAdmin(); return;
  }

  if(t.hasAttribute("data-verify")){
    var g1=GEMS.filter(function(x){return x.stoneId===t.getAttribute("data-verify");})[0];
    if(g1){ g1.verifiedAgo=0; toast(g1.stoneId+" confirmed as still available."); } reAdmin(); return;
  }
  if(t.hasAttribute("data-aedit")){ A.draft=null; A.preview=false; location.hash="#/admin/gemstones/"+t.getAttribute("data-aedit"); return; }
  if(t.hasAttribute("data-anew")){ A.draft=blankGem(); A.preview=false; location.hash="#/admin/gemstones/new"; return; }
  if(t.hasAttribute("data-adup")){
    var src=GEMS.filter(function(x){return x.stoneId===t.getAttribute("data-adup");})[0]; if(!src) return;
    var c=toDraft(src), n=400+GEMS.length;
    c.stoneId="SPG-"+({Ruby:"R",Sapphire:"S",Spinel:"SP",Peridot:"P",Tourmaline:"T",Moonstone:"M"}[c.type]||"X")+"-0"+n;
    c.slug=""; c.images=[]; c.imageCount=0; c.lab=""; c.certNo=""; c.certDate=""; c.status="draft"; c.isNew=true;
    A.draft=c; A.preview=false;
    toast("Duplicated. Everything copied except the stone ID, slug, media and certificates (FR-CMS-002).");
    location.hash="#/admin/gemstones/new"; reAdmin(); return;
  }
  if(t.hasAttribute("data-asold")){
    var g2=GEMS.filter(function(x){return x.stoneId===t.getAttribute("data-asold");})[0];
    if(g2){ g2.availability="sold"; g2.updatedAgo=0;
      if(A.draft && A.draft.stoneId===g2.stoneId) A.draft.availability="sold";
      toast(g2.stoneId+" marked sold. The record stays live at its URL with a Sold state (FR-GEM-064)."); }
    reAdmin(); return;
  }
  if(t.hasAttribute("data-adelete")){
    var id3=t.getAttribute("data-adelete");
    if(!confirm("Soft-delete "+id3+"? Recoverable for 30 days (FR-CMS-041).")) return;
    var i3=GEMS.findIndex(function(g){return g.stoneId===id3;}); if(i3>-1) GEMS.splice(i3,1);
    A.draft=null; toast(id3+" moved to trash."); location.hash="#/admin/gemstones"; return;
  }
  if(t.hasAttribute("data-ainq")){ location.hash="#/admin/inquiries/"+t.getAttribute("data-ainq"); return; }
  if(t.hasAttribute("data-anote")){
    var q=INQ.filter(function(x){return x.ref===t.getAttribute("data-anote");})[0];
    var txt=document.querySelector("#noteTxt");
    if(q && txt && txt.value.trim()){ q.notes.push({who:ROLES[A.role].label,when:"just now",text:txt.value.trim()}); reAdmin(); }
    return;
  }
  if(t.hasAttribute("data-anotspam")){
    var q2=INQ.filter(function(x){return x.ref===t.getAttribute("data-anotspam");})[0];
    if(q2){ q2.spam=false; toast("Restored to the open queue."); } reAdmin(); return;
  }

  /* editor */
  if(t.hasAttribute("data-jump")){
    var p=t.getAttribute("data-jump").split("|");
    var d1=document.querySelector('[data-grp="'+p[0]+'"]'); if(d1) d1.open=true;
    var fld=document.querySelector('#ed-'+p[1]) || document.querySelector('[data-fw="'+p[1]+'"]') ||
            document.querySelector('[data-grp="'+p[0]+'"]');
    if(fld){ fld.scrollIntoView({block:"center",behavior:"smooth"}); if(fld.focus) fld.focus(); }
    return;
  }
  if(t.hasAttribute("data-asave")){ A.dirty=false; markSaving(); toast("Draft saved. Autosave also runs every 20 seconds and on blur (FR-CMS-003)."); return; }
  if(t.hasAttribute("data-apublish")){
    commitDraft(true);
    toast(A.draft.title+" published. It is live on the public catalogue now.");
    A.draft=null; location.hash="#/admin/gemstones"; return;
  }
  if(t.hasAttribute("data-apreview")){ A.preview=!A.preview; reAdmin(true); return; }
  if(t.hasAttribute("data-aupload")){
    if(!A.draft) return;
    var base=(A.draft.images||[]).length;
    for(var u=0;u<3;u++) A.draft.images.push({view:(base+u)%VIEWS.length, alt:"", pct:0});
    reAdmin(true); simulateUpload(); return;
  }
  if(t.hasAttribute("data-mmove")){
    var mp=t.getAttribute("data-mmove").split(","), from=+mp[0], to=from+(+mp[1]);
    var im=A.draft.images;
    if(to>=0 && to<im.length){ var tmp=im[from]; im[from]=im[to]; im[to]=tmp; A.dirty=true; reAdmin(true); }
    return;
  }
  if(t.hasAttribute("data-mdel")){
    A.draft.images.splice(+t.getAttribute("data-mdel"),1); A.dirty=true; reAdmin(true); return;
  }
});

function simulateUpload(){
  var pending = (A.draft.images||[]).filter(function(i){ return i.pct<100; });
  if(!pending.length) return;
  var stalled = false;
  var iv = setInterval(function(){
    var any=false;
    (A.draft.images||[]).forEach(function(im){
      if(im.pct<100){
        any=true;
        if(A.slow && im.pct>=55 && im.pct<60 && !stalled){ stalled=true; im.pct=58;
          toast("Connection dropped at 58%. The upload resumes from where it stopped — it does not restart (FR-CMS-006).");
          setTimeout(function(){ stalled=false; }, 2200);
          return;
        }
        if(!stalled) im.pct = Math.min(100, im.pct + (A.slow?7:22));
      }
    });
    var bars = document.querySelectorAll(".a-prog i");
    var idx=0;
    (A.draft.images||[]).forEach(function(im){ if(im.pct<100 && bars[idx]){ bars[idx].style.width=im.pct+"%"; idx++; } });
    if(!any){ clearInterval(iv); A.dirty=true; reAdmin(true);
      toast("Upload complete. Alt text is required on every image before this stone can be published (FR-CMS-008)."); }
  }, 260);
}

/* editor field binding — input for text, change for selects, blur triggers autosave */
document.addEventListener("input", function(e){
  var t=e.target, k=t.getAttribute && t.getAttribute("data-ed");
  if(k && A.draft){
    if(k==="dimL") A.draft.dims[0]=t.value;
    else if(k==="dimW") A.draft.dims[1]=t.value;
    else if(k==="dimD") A.draft.dims[2]=t.value;
    else if(k==="type") A.draft.type=t.value;
    else A.draft[k]=t.value;
    A.dirty=true; return;
  }
  var ai=t.getAttribute && t.getAttribute("data-malt");
  if(ai!==null && ai!==undefined && A.draft && A.draft.images[+ai]){
    A.draft.images[+ai].alt=t.value; A.dirty=true;
    t.style.borderColor = t.value.trim() ? "" : "var(--error)";
  }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.id==="roleSel"){ A.role=t.value; A.sel={}; reAdmin(); return; }
  if(t.id==="slowNet"){ A.slow=t.checked; toast(A.slow
    ? "Simulating 1 Mbps with 400 ms latency — the condition the admin must stay usable in (§3.4, FR-CMS-040)."
    : "Back to a normal connection."); return; }
  if(t.id==="asort"){ A.sort=t.value; reAdmin(); return; }
  if(t.id==="aselAll"){
    viewRows().slice((A.page-1)*A_PAGE, (A.page-1)*A_PAGE+A_PAGE).forEach(function(g){ A.sel[g.stoneId]=t.checked; });
    reAdmin(true); return;
  }
  var c=t.getAttribute && t.getAttribute("data-edc");
  if(c && A.draft){ A.draft[c]=t.checked; A.dirty=true; markSaving(); reAdmin(true); return; }
  var k2=t.getAttribute && t.getAttribute("data-ed");
  if(k2 && A.draft && t.tagName==="SELECT"){
    if(k2==="type") A.draft.type=t.value; else A.draft[k2]=t.value;
    A.dirty=true; markSaving(); reAdmin(true); return;
  }
  var st=t.getAttribute && t.getAttribute("data-astatus");
  if(st){ var q=INQ.filter(function(x){return x.ref===st;})[0];
    if(q){ q.status=t.value; if(q.status==="lost" && !q.lostReason) q.lostReason="price"; reAdmin(); } return; }
  var lr=t.getAttribute && t.getAttribute("data-alost");
  if(lr){ var q3=INQ.filter(function(x){return x.ref===lr;})[0]; if(q3){ q3.lostReason=t.value; reAdmin(); } return; }
});
document.addEventListener("blur", function(e){
  if(e.target.getAttribute && (e.target.getAttribute("data-ed")||e.target.getAttribute("data-malt")) && A.dirty){
    A.dirty=false; markSaving();
  }
}, true);

/* drag-and-drop image reorder — FR-CMS-007 (buttons provide the accessible path) */
var dragI = null;
document.addEventListener("dragstart", function(e){
  var m=e.target.closest && e.target.closest("[data-mi]"); if(!m) return;
  dragI=+m.getAttribute("data-mi"); e.dataTransfer.effectAllowed="move";
});
document.addEventListener("dragover", function(e){ if(dragI!==null && e.target.closest && e.target.closest("[data-mi]")) e.preventDefault(); });
document.addEventListener("drop", function(e){
  var m=e.target.closest && e.target.closest("[data-mi]"); if(!m || dragI===null) return;
  e.preventDefault();
  var to=+m.getAttribute("data-mi"), im=A.draft.images, moved=im.splice(dragI,1)[0];
  im.splice(to,0,moved); dragI=null; A.dirty=true; reAdmin(true);
});
</script>

<script>
"use strict";
/* filter state initialised here; boot happens after the SDD §19 layer loads */
F = defaults();
</script>
<style>
/* ============================================================
   SDD v1.0 §19 additions.
   Same tokens, same type, same zero-radius discipline as the
   original build — this adds structure, not a new visual style.
   ============================================================ */

/* --- logo (SDD §19.2) --- */
.brand-logo{height:52px; width:auto; display:block}
.foot .brand-logo{height:60px}
.mobmenu .brand-logo{height:46px}
.a-brand .brand-logo{height:44px; filter:brightness(1.06)}

/* --- grouped nav with dropdown (SDD §19.3) --- */
.nav{gap:var(--s4)}
.navitem{position:relative; display:flex; align-items:center}
.navitem>a,.navitem>button{
  text-decoration:none; font-size:12px; font-weight:500; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-secondary); padding:28px 0; background:none;
  border:0; border-bottom:1px solid transparent; cursor:pointer; display:flex; align-items:center; gap:7px;
  transition:color 180ms var(--ease-in);
}
.navitem>a:hover,.navitem>button:hover,.navitem.on>a,.navitem.on>button,
.navitem>a[aria-current="page"]{color:var(--ink)}
.navitem>button .caret{font-size:8px; transition:transform 200ms var(--ease-in); color:var(--ink-tertiary)}
.navitem.on>button .caret{transform:rotate(180deg)}
.navitem>a::after,.navitem>button::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--ink);
  transform:scaleX(0); transform-origin:left; transition:transform 220ms var(--ease-in);
}
.navitem:hover>a::after,.navitem:hover>button::after,.navitem.on>button::after,
.navitem>a[aria-current="page"]::after{transform:scaleX(1)}

.dropdown{
  position:absolute; top:100%; left:50%; transform:translate(-50%,-6px); min-width:520px;
  background:var(--ivory); border:1px solid var(--rule); border-top:0; padding:var(--s4);
  display:grid; grid-template-columns:1fr 1fr; gap:2px var(--s4);
  opacity:0; visibility:hidden; pointer-events:none; z-index:70;
  transition:opacity 220ms var(--ease-in), transform 220ms var(--ease-in), visibility 220ms;
  box-shadow:0 18px 44px rgba(20,19,18,.10);
}
.navitem.on .dropdown{opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0)}
.dropdown a{
  display:flex; flex-direction:column; gap:3px; padding:13px var(--s2); text-decoration:none;
  border-bottom:0; transition:background 160ms var(--ease-in);
}
.dropdown a:hover{background:var(--ivory-deep)}
.dropdown a b{font-family:var(--f-display); font-size:19px; font-weight:500; letter-spacing:.01em; color:var(--ink); text-transform:none}
.dropdown a span{font-size:12.5px; color:var(--ink-meta); line-height:1.5; letter-spacing:0; text-transform:none}

.hdr-cta{display:flex; align-items:center; gap:10px; margin-left:var(--s3)}
/* header button uses the standard site button */

/* --- full-screen mobile menu (SDD §19.8) --- */
.mobmenu{
  position:fixed; inset:0; z-index:90; background:var(--ivory); display:flex; flex-direction:column;
  padding:var(--s3); overflow:auto;
  opacity:0; visibility:hidden; transform:translateY(-8px);
  transition:opacity 300ms var(--ease-in), transform 300ms var(--ease-in), visibility 300ms;
}
.mobmenu[data-open="true"]{opacity:1; visibility:visible; transform:none}
.mobmenu-top{display:flex; align-items:center; justify-content:space-between; padding-bottom:var(--s4); border-bottom:1px solid var(--rule)}
.mobmenu-x{background:none; border:1px solid var(--rule); padding:11px 16px; border-radius:2px; cursor:pointer;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.mobmenu nav{display:flex; flex-direction:column; padding:var(--s3) 0; flex:1}
.mobmenu nav>a,.mobmenu-grp>b{
  font-family:var(--f-display); font-size:30px; font-weight:400; text-decoration:none; color:var(--ink);
  padding:15px 0; border-bottom:1px solid var(--rule); display:block;
}
.mobmenu-grp>b{color:var(--ink-meta); font-size:13px; font-family:var(--f-body); font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; border-bottom:0; padding:22px 0 6px}
.mobmenu-grp a{
  font-family:var(--f-display); font-size:24px; text-decoration:none; color:var(--ink);
  padding:11px 0 11px var(--s3); border-bottom:1px solid var(--rule); display:block;
}
.mobmenu-cta{display:flex; flex-direction:column; gap:10px; padding-top:var(--s3); border-top:1px solid var(--rule)}

/* --- scroll reveal (PRD FR-UI-032: fade + ≤24px, ≤80ms stagger, max 6) --- */
.rv{opacity:0; transform:translateY(20px); transition:opacity 520ms var(--ease-in), transform 520ms var(--ease-in)}
.rv.in{opacity:1; transform:none}

/* --- quotation / appointment CTA pair (SDD §19.4) --- */
.cta-pair{display:flex; flex-direction:column; gap:10px}
.cta-pair .btn{width:100%}
.quote-note{font-size:13px; color:var(--ink-meta); line-height:1.55}

/* --- appointment picker (SDD §7.5 — both timezones, always) --- */
.appt-types{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.appt-t{
  border:1px solid var(--rule); background:none; padding:var(--s3) var(--s2); cursor:pointer; border-radius:2px;
  display:flex; flex-direction:column; gap:5px; text-align:left; transition:border-color 180ms var(--ease-in);
}
.appt-t:hover{border-color:var(--ink)}
.appt-t[aria-pressed="true"]{border-color:var(--ink); background:var(--ivory-deep)}
.appt-t b{font-size:14px; font-weight:500}
.appt-t span{font-size:12px; color:var(--ink-meta); line-height:1.45}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px}
.slot{
  border:1px solid var(--rule); background:none; padding:11px 8px; cursor:pointer; border-radius:2px;
  font-size:14px; font-variant-numeric:tabular-nums; transition:border-color 180ms var(--ease-in);
}
.slot:hover{border-color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ivory)}
.tzbox{border:1px solid var(--ink); background:var(--ivory-deep); padding:var(--s3); display:flex; flex-direction:column; gap:11px}
.tzrow{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); font-variant-numeric:tabular-nums}
.tzrow .lbl{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-meta)}
.tzrow .val{font-size:16px}
.tzrow.you .val{font-weight:600}

/* --- editorial content pages --- */
.pg-hd{padding:var(--s7) 0 var(--s5); border-bottom:1px solid var(--rule)}
.prose{display:flex; flex-direction:column; gap:var(--s3); max-width:66ch}
.prose p{font-size:18px; line-height:1.7}
.pullq{
  border-left:2px solid var(--gold); padding:var(--s1) 0 var(--s1) var(--s4); margin:var(--s3) 0;
  font-family:var(--f-display); font-size:26px; line-height:1.4; color:var(--ink); max-width:52ch;
}
.factgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:var(--s4); border-top:1px solid var(--rule); padding-top:var(--s4)}
.fact{display:flex; flex-direction:column; gap:6px}
.fact .n{font-family:var(--f-display); font-size:39px; line-height:1; font-variant-numeric:tabular-nums}
.fact .l{font-size:13px; color:var(--ink-meta); line-height:1.5}
.newsrow{display:grid; grid-template-columns:150px 1fr; gap:var(--s4); padding:var(--s4) 0; border-bottom:1px solid var(--rule); align-items:start}
.newsrow .dt{font-size:12px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-meta); padding-top:5px}
.gal4{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s2)}
.gal2{display:grid; grid-template-columns:1fr 1fr; gap:var(--s3)}

/* --- contact (SDD §19.5) --- */
.contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s7); align-items:start; padding:var(--s6) 0 var(--s7)}
.cblock{display:flex; flex-direction:column; gap:var(--s4)}
.crow{display:grid; grid-template-columns:132px 1fr; gap:var(--s3); padding:14px 0; border-bottom:1px solid var(--rule); align-items:baseline}
.crow dt{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-meta)}
.crow dd{margin:0; font-size:16px; line-height:1.6; font-variant-numeric:tabular-nums}
.crow dd a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule)}
.crow dd a:hover{border-color:var(--ink)}

/* --- minimal footer (SDD §19.6) --- */
.foot-min{background:var(--charcoal-deep); color:#B9B3AA; padding:var(--s6) 0 var(--s4)}
.foot-min .in{max-width:var(--max); margin:0 auto; padding:0 var(--s4); display:flex; flex-direction:column; gap:var(--s4); align-items:center; text-align:center}
.foot-map{display:flex; gap:var(--s4); flex-wrap:wrap; justify-content:center; padding:var(--s3) 0; border-top:1px solid #2A2725; border-bottom:1px solid #2A2725; width:100%}
.foot-map a{color:#B9B3AA; text-decoration:none; font-size:12px; letter-spacing:.12em; text-transform:uppercase}
.foot-map a:hover{color:var(--ivory)}
.foot-cr{font-size:12.5px; color:#7E7871; line-height:1.6; max-width:70ch}

@media (max-width:1180px){
  .nav{display:none}
  .hdr-cta{display:none}
  .burger{display:block; margin-left:auto}
}
@media (max-width:900px){
  .contact-grid{grid-template-columns:1fr; gap:var(--s5)}
  .gal4{grid-template-columns:1fr 1fr}
  .appt-types{grid-template-columns:1fr}
  .newsrow{grid-template-columns:1fr; gap:10px}
  .gal2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1; transform:none; transition:none}
}
</style>

<script>
"use strict";
/* ==========================================================================
   SDD v1.0 §19 — confirmed client decisions that narrow or override the PRD.
   Nav grouping (§19.3), quotation/appointment-only commerce (§19.4),
   site settings (§19.5), minimal footer (§19.6), logo (§19.2).
   ========================================================================== */

var LOGO_SRC = "assets/img/logo.png";

/* --- NavigationMenu global (SDD §19.3) — data, not a component tree --------
   Mirrors the Payload global exactly, so re-grouping the nav later is a CMS
   edit rather than a front-end rebuild. Editable in the CMS demo. */
var NAV_MENU = [
  { label:"Home",          route:"#/",                           children:[] },
  { label:"About",         route:"#/about/our-story",            children:[] },
  { label:"The Value",     route:"#/about/the-value",            children:[] },
  { label:"Gemstones",     route:"#/gemstones",                  children:[] },
  { label:"Mining Works",  route:"#/about/mining-works",         children:[] },
  { label:"Milestones",    route:"#/about/milestones",           children:[] },
  { label:"CSR",           route:"#/about/csr",                  children:[] },
  { label:"News & Events", route:"#/news",                       children:[] },
  { label:"Contact",       route:"#/contact",                    children:[] }
];

/* --- SiteSettings global (SDD §19.5) — confirmed seed values -------------- */
var SITE = {
  legalName:"SP GEMS & Jewellery",
  addressLine:"No. 30 A, Pyay Road, (7 Mile), Mayangone Tsp, Yangon, Myanmar.",
  telephones:["(95)-1-660-397","666-052","666-053"],
  fax:"(95)-1-664-574",
  poBox:"11061",
  viber:"(95)-9-788-440-929",
  emails:["spgems.myanmar@gmail.com","spgems.akz@gmail.com"],
  /* Reproduced verbatim per SDD §19.6. The 2015 year and "Jewelery" spelling
     are the supplied string; SDD flags both for one confirmation pass. */
  footerCopyright:"Copyright © SP Gems & Jewelery. All right reserved 2015. Another Creation of Media Lane, The Creative Agency."
};

/* --- header + footer render ---------------------------------------------- */
function navHTML(){
  return NAV_MENU.map(function(n,i){
    if(!n.children.length){
      return '<div class="navitem"><a href="'+n.route+'" data-nav="'+navKey(n.route)+'">'+esc(n.label)+'</a></div>';
    }
    return '<div class="navitem" data-drop="'+i+'">'+
      '<button type="button" aria-expanded="false" aria-controls="dd'+i+'">'+esc(n.label)+
        '<span class="caret" aria-hidden="true">▼</span></button>'+
      '<div class="dropdown" id="dd'+i+'">'+n.children.map(function(c){
        return '<a href="'+c.route+'"><b>'+esc(c.label)+'</b><span>'+esc(c.description||"")+'</span></a>';
      }).join("")+'</div></div>';
  }).join("");
}
function navKey(route){ var p=String(route).replace(/^#\/?/,"").split("?")[0]; return p||"home"; }

function mountChrome(){
  var hdr = document.querySelector(".hdr-in");
  if(!hdr) return;
  hdr.innerHTML =
    '<a class="brand" href="#/" aria-label="SP Gems — home"><img class="brand-logo" src="'+LOGO_SRC+'" alt="SP Gems"></a>'+
    '<nav class="nav" aria-label="Primary">'+navHTML()+'</nav>'+
    '<div class="hdr-cta">'+
      '<a class="btn btn-primary" href="#/contact">Enquire</a>'+
    '</div>'+
    '<button class="burger" type="button" aria-expanded="false" aria-controls="mobmenu">Menu</button>';

  var mm = document.getElementById("mobmenu");
  if(mm) mm.innerHTML =
    '<div class="mobmenu-top"><img class="brand-logo" src="'+LOGO_SRC+'" alt="SP Gems">'+
      '<button class="mobmenu-x" type="button" data-mobclose="1">Close</button></div>'+
    '<nav aria-label="Mobile">'+NAV_MENU.map(function(n){
      if(!n.children.length) return '<a href="'+n.route+'">'+esc(n.label)+'</a>';
      return '<div class="mobmenu-grp"><b>'+esc(n.label)+'</b>'+n.children.map(function(c){
        return '<a href="'+c.route+'">'+esc(c.label)+'</a>'; }).join("")+'</div>';
    }).join("")+
      '<div class="mobmenu-grp"><b>More</b>'+
        '<a href="#/about/responsible-sourcing">Responsible Sourcing</a>'+
        '<a href="#/about/the-value">Jewellery</a></div>'+
    '</nav>'+
    '<div class="mobmenu-cta">'+
      '<a class="btn btn-primary" href="#/contact">Enquire</a>'+
    '</div>';

  /* minimal footer — SDD §19.6: brand mark, slim sitemap, copyright. No
     repeated contact block, no social links to the legacy placeholders. */
  var f = document.querySelector(".foot, .foot-min");
  if(!f) return;
  f.className = "foot-min";
  f.setAttribute("data-prd","SDD §19.6 Footer");
  f.innerHTML = '<div class="in">'+
    '<img class="brand-logo" src="'+LOGO_SRC+'" alt="SP Gems">'+
    '<div class="foot-map">'+
      '<a href="#/">Home</a><a href="#/about/our-story">Our Story</a><a href="#/about/the-value">The Value</a>'+
      '<a href="#/about/mining-works">Mining Works</a><a href="#/about/milestones">Milestones</a>'+
      '<a href="#/about/csr">CSR</a><a href="#/about/responsible-sourcing">Responsible Sourcing</a>'+
      '<a href="#/gemstones">Gemstones</a><a href="#/news">News &amp; Events</a><a href="#/contact">Contact</a>'+
    '</div>'+
    '<p class="foot-cr">'+esc(SITE.footerCopyright)+'</p>'+
  '</div>';
}

/* --- dropdown, mobile menu, scroll reveal --------------------------------- */
function closeDrops(){ $$(".navitem.on").forEach(function(n){
  n.classList.remove("on"); var b=n.querySelector("button"); if(b) b.setAttribute("aria-expanded","false"); }); }

document.addEventListener("click", function(e){
  var btn = e.target.closest && e.target.closest(".navitem[data-drop]>button");
  if(btn){
    var item = btn.parentNode, was = item.classList.contains("on");
    closeDrops();
    if(!was){ item.classList.add("on"); btn.setAttribute("aria-expanded","true"); }
    e.stopPropagation(); return;
  }
  if(!(e.target.closest && e.target.closest(".dropdown"))) closeDrops();
  if(e.target.closest && e.target.closest("[data-mobclose]")) setMob(false);
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ closeDrops(); if(document.getElementById("mobmenu").getAttribute("data-open")==="true") setMob(false); }
});
document.addEventListener("mouseover", function(e){
  var item = e.target.closest && e.target.closest(".navitem[data-drop]");
  if(item && window.matchMedia("(hover:hover)").matches){
    closeDrops(); item.classList.add("on");
    var b=item.querySelector("button"); if(b) b.setAttribute("aria-expanded","true");
  } else if(e.target.closest && !e.target.closest(".nav")) {
    if(window.matchMedia("(hover:hover)").matches) closeDrops();
  }
});
function setMob(open){
  var mm=document.getElementById("mobmenu");
  mm.setAttribute("data-open", open?"true":"false");
  var b=document.querySelector(".burger"); if(b) b.setAttribute("aria-expanded", open?"true":"false");
  document.body.style.overflow = open ? "hidden" : "";
}

var revealObs = null;
function armReveal(){
  if(!("IntersectionObserver" in window)) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add("in"); revealObs.unobserve(en.target); }
    });
  }, {rootMargin:"0px 0px -8% 0px", threshold:0.06});
  /* stagger capped at 6 items / 80ms per PRD FR-UI-032 */
  $$("#main .band, #main .newsrow, #main .rvme").forEach(function(el,i){
    el.classList.add("rv");
    el.style.transitionDelay = Math.min(i,5)*80 + "ms";
    revealObs.observe(el);
  });
}

/* --- Myanmar Standard Time handling (SDD §7.5) ----------------------------
   Offsets are read from the IANA database through Intl, never hardcoded —
   the half-hour UTC+06:30 offset is exactly what hand-rolled math gets wrong. */
var YANGON_TZ = "Asia/Yangon";
function tzOffsetMinutes(date, tz){
  var dtf = new Intl.DateTimeFormat("en-US", { timeZone:tz, hour12:false,
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
  var p = {}; dtf.formatToParts(date).forEach(function(x){ p[x.type]=x.value; });
  var asUTC = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second);
  return (asUTC - date.getTime())/60000;
}
function zonedToUtc(y,m,d,hh,mm,tz){
  var guess = Date.UTC(y, m-1, d, hh, mm, 0);
  var off = tzOffsetMinutes(new Date(guess), tz);
  return new Date(guess - off*60000);
}
function fmtIn(date, tz){
  try{
    return new Intl.DateTimeFormat("en-GB", { timeZone:tz, weekday:"short", day:"numeric", month:"short",
      hour:"numeric", minute:"2-digit", hour12:true, timeZoneName:"short" }).format(date);
  }catch(e){ return date.toISOString(); }
}
function clientTz(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }catch(e){ return "UTC"; }
}
/* FR-CON-011 — both times, always, from one function */
function formatWindowForDisplay(utcDate){
  var ctz = clientTz();
  return { clientTz:ctz, clientLocal:fmtIn(utcDate,ctz), yangonLocal:fmtIn(utcDate,YANGON_TZ) };
}
</script>

<script>
"use strict";
/* ---------------- content pages (SDD §19.3 destinations) ---------------- */
function pgHead(eyebrow, title, lede){
  return '<div class="wrap"><div class="pg-hd stack g3">'+
    '<p class="eyebrow">'+esc(eyebrow)+'</p><h1>'+esc(title)+'</h1>'+
    (lede?'<p class="t-lg measure">'+esc(lede)+'</p>':"")+'</div></div>';
}
function ctaBand(line){
  return '<section class="band band-dark band-tight"><div class="wrap-text" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:var(--s3)">'+
    '<h3 style="color:var(--ivory); max-width:26ch">'+esc(line)+'</h3>'+
    '<div class="hero-cta" style="justify-content:center">'+
      '<a class="btn btn-primary" href="#/contact">Enquire</a>'+
    '</div></div></section>';
}

function pgOurStory(){
  return pgHead("About","Our Story","Born in Mogok, trading since 1985, and still working the same valley.")+
  '<section class="band band-ivory"><div class="wrap"><div class="ed">'+
    '<div class="prose">'+
      '<p>The SanPya family began trading precious stones in Mogok in 1985. For the first two decades the business was what most Mogok businesses were: a family, a loupe, and a reputation held together by who would vouch for you.</p>'+
      '<p>SP Gems was formally established in 2007. What changed was not the material or the relationships but the scale — our own workings in the valley, our own sorting, and a cutting workshop in Yangon staffed by cutters we trained ourselves.</p>'+
      '<div class="pullq">We are not a dealer who buys finished stones. We take our own rough to the wheel, which is why our cutting serves the colour rather than the carat weight.</div>'+
      '<p>Four decades on, the family is still in the valley. That continuity is the whole of our credential, and it is the reason we can tell you where a stone came from without reconstructing it from an invoice.</p>'+
    '</div>'+
    '<div class="ed-off">'+img("assets/img/page-banner.jpg","SP Gems","4/5")+'</div>'+
  '</div></div></section>'+
  '<section class="band band-ivory-deep band-tight"><div class="wrap"><div class="factgrid">'+
    '<div class="fact"><span class="n">1985</span><span class="l">First year of family gem trading in Mogok</span></div>'+
    '<div class="fact"><span class="n">2007</span><span class="l">SP Gems formally established</span></div>'+
    '<div class="fact"><span class="n">40+</span><span class="l">Years of continuous presence in the valley</span></div>'+
    '<div class="fact"><span class="n">1</span><span class="l">Workshop, in Yangon, cutting everything we sell</span></div>'+
  '</div></div></section>'+
  ctaBand("Come and see what we have.");
}

function pgTheValue(){
  return pgHead("About · Collection","The Value","Design-led jewellery built around stones too good to sit in a safe.")+
  '<section class="band band-ivory"><div class="wrap"><div class="ed-3">'+
    '<div class="prose">'+
      '<p>The Value is our jewellery house, led by Aung Kyaw Zin, who came to gem design from an architecture degree in 2003. That background shows: the settings are structural rather than decorative, and they are drawn around a specific stone rather than adapted to whatever fits.</p>'+
      '<p>The collection runs from everyday pieces to commissioned high jewellery. What holds it together is that every stone in it passed through our own hands first.</p>'+
    '</div>'+
    '<div class="gal2">'+imgs([["assets/img/value-1.jpg","The Value — sapphire and diamond earrings"],
      ["assets/img/value-2.jpg","The Value — piece 2"],["assets/img/value-3.jpg","The Value — piece 3"],
      ["assets/img/value-4.jpg","The Value — piece 4"]],"1/1")+'</div>'+
  '</div></div></section>'+
